# ============================================================
# 班级工作台 · 统一网页入口（nginx 反向代理）
# ------------------------------------------------------------
# 一个地址、一个端口，两套服务：
#
#   http://<NAS>:8080/         → 工作台（教师端 /teacher/、学生端 /s/）
#   http://<NAS>:8080/qf/      → QuickForm 教师版（任务 / 收集表 / 分析）
#   http://<NAS>:8080/static/  → QuickForm 的静态资源（兼容其模板里的绝对路径）
#
# 说明：
# · /qf/ 转发时剥掉前缀（proxy_pass 末尾带 /），并把 X-Forwarded-Prefix
#   传给 QuickForm，由 quickform/serve.py 负责把页面里的地址补回 /qf；
# · 其余路径原样转给工作台，工作台本来就按 Host/前缀生成学生端链接；
# · 关闭 proxy_buffering：工作台的 /api/v2/events 是 SSE 实时推送，
#   缓冲会让事件卡住不下发。
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 课件 / 作品单文件上限 300MB，网关必须放大，否则 413
    client_max_body_size 320m;
    client_body_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_buffering off;

    # ---- QuickForm 入口（带不带斜杠都行）----
    location = /qf {
        return 301 /qf/;
    }

    location /qf/ {
        proxy_pass http://quickform:5055/;
        proxy_set_header X-Forwarded-Prefix /qf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # QuickForm 官方模板里有几处写死的 /static/… 绝对路径，
    # 直接访问根路径 /static/ 时兜底转给 QuickForm（工作台自身不用这个前缀）。
    location /static/ {
        proxy_pass http://quickform:5055;
        proxy_read_timeout 120s;
    }

    # ---- 工作台（教师端 / 学生端 / API / SSE 全在这里）----
    location / {
        proxy_pass http://workbench:20020;
        # SSE：长连接不要被超时掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 网关自身健康检查（不经过后端，方便判断是网关还是服务的问题）
    location = /gw-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "gateway ok\n";
    }
}
