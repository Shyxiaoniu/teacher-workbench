# ============================================================
# 班级工作台 · 统一网页入口（nginx 反向代理）
# ------------------------------------------------------------
# 双入口：
#   http://<NAS>:8090/    原 HTTP 入口，保持不变（老书签照常用）
#   https://<NAS>:8443/   新增 HTTPS 入口，截图工具必须用这个
#
# 为什么要 HTTPS：浏览器只在「安全上下文」下开放 getDisplayMedia
# （屏幕截图）与 showDirectoryPicker（选文件夹保存）。HTTP 下这两个
# API 不存在。截图工具页面会自己检测，用 HTTP 打开时提示切到 HTTPS。
#
# 说明：
# · 课堂活动已内嵌在工作台自己的库里，无需专门转发规则。
# · 关闭 proxy_buffering：/api/v2/events 是 SSE 实时推送，缓冲会卡住。
# · 证书部署见 deploy/nas/HTTPS部署说明.md
# ============================================================

# ---- 公共后端转发（两个 server 复用不了 upstream 之外的，逐块写） ----

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 课件 / 作品单文件上限 300MB，网关必须放大，否则 413
    client_max_body_size 5120m;
    client_body_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_buffering off;

    location / {
        proxy_pass http://workbench:20020;
        # SSE：长连接不要被超时掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 网关自身健康检查（不经过后端，方便判断是网关还是服务的问题）
    location = /gw-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "gateway ok\n";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # 证书：由 compose 把 certs 目录挂到这里（只读）
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 5120m;
    client_body_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_buffering off;

    location / {
        proxy_pass http://workbench:20020;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /gw-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "gateway ok\n";
    }
}
