# ============================================================
# 班级工作台 · 统一网页入口（nginx 反向代理）
# ------------------------------------------------------------
# 一个地址、一个端口，所有请求都进工作台：
#
#   http://<NAS>:8080/           → 工作台（教师端 /teacher/、学生端 /s/）
#   http://<NAS>:8080/api/act/   → 课堂活动接口（工作台内置）
#   http://<NAS>:8080/static/    → 课堂活动附件
#
# 说明：
# · 课堂活动已经内嵌在工作台自己的库里，不需要任何专门转发规则。
# · 关闭 proxy_buffering：工作台的 /api/v2/events 是 SSE 实时推送，
#   缓冲会让事件卡住不下发。
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 课件 / 作品单文件上限 300MB，网关必须放大，否则 413
    client_max_body_size 320m;
    client_body_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_buffering off;

    # ---- 全部交给工作台 ----
    # 活动接口 /api/act/ 与附件 /static/uploads/ 都由工作台自己处理。
    # 唯一保留的特殊规则是 SSE 长连接超时。
    location / {
        proxy_pass http://workbench:20020;
        # SSE：长连接不要被超时掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 网关自身健康检查（不经过后端，方便判断是网关还是服务的问题）
    location = /gw-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "gateway ok\n";
    }
}
