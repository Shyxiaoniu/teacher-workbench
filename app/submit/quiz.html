<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试题提交</title>
<style>
  :root{--brand:#0F6E56;--brand-soft:#E1F5EE;--bg:#F7F9F8;--surface:#fff;--border:#DDE5E1;--text:#1A2E28;--muted:#5F6E68;--err:#E24B4A;--ok:#1D9E75}
  *{box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);max-width:680px;margin:24px auto;padding:0 16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(15,110,86,.06)}
  h2{margin:0 0 4px;color:var(--brand);font-size:20px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  label{display:block;margin:14px 0 5px;font-weight:600;font-size:13px}
  input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--surface);color:var(--text);font-family:inherit}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .req{color:var(--err);margin-left:3px}
  .intro{background:var(--brand-soft);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .q{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:14px}
  .q-t{font-weight:600;margin-bottom:10px}
  .opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer}
  .opt:hover{background:var(--brand-soft)}
  .opt input{accent-color:var(--brand)}
  button{margin-top:18px;width:100%;background:var(--brand);color:#fff;border:0;padding:12px;border-radius:10px;font-size:15px;cursor:pointer}
  #msg{margin-top:14px;font-size:14px;min-height:20px}
  .ok{color:var(--ok)} .err{color:var(--err)}
  .score{font-size:15px;font-weight:700;color:var(--brand);margin-top:10px}
</style>
</head>
<body>
  <div class="card">
    <h2 id="title">测试题提交</h2>
    <div class="sub" id="subTitle"></div>
    <div class="note" style="background:var(--brand-soft);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:12px;color:var(--muted);margin-bottom:12px">
      请填写学号并完成答题。提交后系统将<b>自动算分</b>并纳入排行榜，同一学号重复提交仅保留最新成绩。
    </div>

    <label>学号<span class="req">*</span></label>
    <input id="sid" type="text" placeholder="例如 20250301" inputmode="numeric">

    <div id="quizBox"></div>

    <button id="btn" onclick="submitQuiz()">提交并算分</button>
    <div id="msg"></div>
  </div>

<script>
let CFG = {quiz:{intro:'', questions:[]}};
async function load(){
  try{ const r = await fetch('/api/config'); CFG = await r.json(); }catch(e){}
  document.getElementById('title').textContent = '测试题 · ' + (CFG.title||'在线问卷');
  document.getElementById('subTitle').textContent = CFG.title || '测试题提交';
  const intro = (CFG.quiz && CFG.quiz.intro) || '请完成下列题目。';
  const qs = (CFG.quiz && CFG.quiz.questions) || [];
  let h = '<div class="intro">'+esc(intro)+'</div>';
  if(!qs.length){ h += '<div style="color:var(--muted);margin-top:12px">教师暂未配置题目。</div>'; }
  qs.forEach((q, i)=>{
    h += '<div class="q"><div class="q-t">'+(i+1)+'. '+esc(q.q)+'</div>';
    (q.options||[]).forEach((o, j)=>{
      h += '<label class="opt"><input type="radio" name="q'+i+'" value="'+esc(o)+'"> '+esc(o)+'</label>';
    });
    h += '</div>';
  });
  document.getElementById('quizBox').innerHTML = h;
}
const $ = id => document.getElementById(id);
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setMsg(t,c){ const m=$('msg'); m.textContent=t; m.className=c||''; }

async function submitQuiz(){
  const sid = $('sid').value.trim();
  if(!sid){ setMsg('请填写学号','err'); return; }
  const qs = (CFG.quiz && CFG.quiz.questions) || [];
  const fields = {}; let score = 0; let answered = 0;
  qs.forEach((q,i)=>{
    const sel = document.querySelector('input[name="q'+i+'"]:checked');
    const ans = sel ? sel.value : '';
    fields['Q'+(i+1)] = ans;
    if(ans){ answered++; }
    if(ans && ans === q.answer){ score += (Number(q.score)||0); }
  });
  if(answered < qs.length){ setMsg('请完成全部题目后再提交','err'); return; }
  $('btn').disabled = true; setMsg('提交中…');
  try{
    const payload = { sid, type:'quiz', fields, score };
    const r = await fetch('/api/submit', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const j = await r.json();
    if(j.ok){
      setMsg('✓ 提交成功（第 '+j.rank+' 名），本次得分 '+score+' 分','ok');
    } else setMsg('✗ '+(j.msg||'提交失败'),'err');
  }catch(e){ setMsg('✗ '+e.message,'err'); }
  finally{ $('btn').disabled = false; }
}
load();
</script>
</body>
</html>
