<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件提交</title>
<style>
:root{--brand:#0F6E56;--brand2:#1D9E75;--bg:#F4F8F6;--surface:#fff;--border:rgba(15,110,86,.16);--soft:#E1F5EE;--text:#1A2E28;--sub:#5F6E68;--radius:14px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;width:100%;max-width:480px;box-shadow:0 4px 20px rgba(15,110,86,.08)}
h2{margin:0 0 4px;color:var(--brand);font-size:19px}
.sub{color:var(--sub);font-size:13px;margin-bottom:18px}
label{display:block;margin:12px 0 5px;font-weight:600;font-size:13px;color:var(--sub)}
input[type=text],textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fff}
textarea{resize:vertical;min-height:60px}
.filezone{border:2px dashed var(--brand);border-radius:12px;padding:18px;text-align:center;color:var(--sub);cursor:pointer;background:var(--soft);transition:.15s}
.filezone:hover{background:#d4efe4}
.filezone.drag{background:#c7ecdc}
#fileList{margin-top:10px;font-size:13px}
#fileList div{background:#FAFCFB;border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin-top:6px;display:flex;justify-content:space-between}
.btn{width:100%;margin-top:18px;background:var(--brand);color:#fff;border:0;padding:13px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px}
.ok{color:var(--brand)} .err{color:#E24B4A}
.note{margin-top:14px;font-size:12px;color:var(--sub);background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h2 id="title">📎 文件提交</h2>
  <div class="sub" id="subtitle">请填写学号并上传作品</div>

  <label>学号 *</label>
  <input id="sid" type="text" placeholder="例如 20250301" autocomplete="off">
  <label>姓名（选填，自动关联名册）</label>
  <input id="name" type="text" placeholder="如留空则按学号自动匹配">
  <label>作品标题（选填）</label>
  <input id="title_f" type="text" placeholder="例如：我的AI听音作品">
  <label>作品简介（选填）</label>
  <textarea id="intro" placeholder="一句话介绍你的作品"></textarea>

  <label>上传作品文件 *</label>
  <div class="filezone" id="zone">点击选择文件，或拖拽到此处（可多选）</div>
  <input id="file" type="file" multiple hidden>
  <div id="fileList"></div>

  <button class="btn" id="submit">提交</button>
  <div class="msg" id="msg"></div>
  <div class="note">提交以<b>学号</b>为唯一标识：同一学号重复提交将<b>覆盖为最新版本</b>，排行榜按提交时间排序。</div>
</div>

<script>
const picked=[];
const zone=document.getElementById('zone'), fileInput=document.getElementById('file');
zone.onclick=()=>fileInput.click();
zone.ondragover=e=>{e.preventDefault();zone.classList.add('drag')};
zone.ondragleave=()=>zone.classList.remove('drag');
zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drag');addFiles(e.dataTransfer.files)};
fileInput.onchange=()=>addFiles(fileInput.files);
function addFiles(files){
  for(const f of files) picked.push(f);
  renderFiles();
}
function renderFiles(){
  document.getElementById('fileList').innerHTML = picked.map((f,i)=>
    `<div><span>${esc(f.name)}（${(f.size/1024).toFixed(1)} KB）</span><span style="cursor:pointer;color:#E24B4A" onclick="rm(${i})">✕</span></div>`).join('');
}
function rm(i){ picked.splice(i,1); renderFiles(); }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadTitle(){
  try{ const j=await (await fetch('/api/config')).json();
    if(j.title){document.getElementById('title').textContent='📎 '+j.title; document.getElementById('subtitle').textContent='请填写学号并上传作品';}
  }catch(e){}
}
document.getElementById('submit').onclick=async()=>{
  const sid=document.getElementById('sid').value.trim();
  const msg=document.getElementById('msg');
  if(!sid){ msg.className='msg err'; msg.textContent='请填写学号'; return; }
  if(!picked.length){ msg.className='msg err'; msg.textContent='请至少选择一个文件'; return; }
  msg.className='msg'; msg.textContent='上传中…';
  const btn=document.getElementById('submit'); btn.disabled=true;
  try{
    const files=[];
    for(const f of picked){
      const buf=await f.arrayBuffer();
      files.push({name:f.name, mime:f.type||'application/octet-stream', data:btoa(String.fromCharCode(...new Uint8Array(buf)))});
    }
    const res=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ sid, name:document.getElementById('name').value.trim(), type:'file',
        title:document.getElementById('title_f').value.trim(), intro:document.getElementById('intro').value.trim(), files })});
    const j=await res.json();
    if(j.ok){ msg.className='msg ok'; msg.textContent='✓ 提交成功（第 '+j.rank+' 名），可再次提交以更新作品'; }
    else { msg.className='msg err'; msg.textContent='失败：'+(j.msg||'未知错误'); }
  }catch(e){ msg.className='msg err'; msg.textContent='提交出错：'+e.message; }
  finally{ btn.disabled=false; }
};
loadTitle();
</script>
</body>
</html>
