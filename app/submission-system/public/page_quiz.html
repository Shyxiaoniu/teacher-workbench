<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试题提交</title>
<style>
:root{--brand:#0F6E56;--brand2:#1D9E75;--bg:#F4F8F6;--surface:#fff;--border:rgba(15,110,86,.16);--soft:#E1F5EE;--text:#1A2E28;--sub:#5F6E68;--radius:14px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:20px}
.wrap{max-width:680px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:0 4px 20px rgba(15,110,86,.06);margin-bottom:16px}
h2{margin:0 0 4px;color:var(--brand);font-size:20px}
.sub{color:var(--sub);font-size:13px;margin-bottom:6px}
.guide{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7;margin:10px 0 4px}
label.sid{display:block;margin:14px 0 5px;font-weight:600;font-size:13px;color:var(--sub)}
#sid{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px}
.q{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:14px;background:#FAFCFB}
.q .qt{font-weight:700;margin-bottom:10px}
.q .qt .pts{color:var(--brand);font-size:13px;font-weight:600}
.opt{display:block;padding:9px 12px;border:1px solid var(--border);border-radius:9px;margin-top:8px;cursor:pointer;transition:.12s}
.opt:hover{background:var(--soft)}
.opt.sel{background:var(--soft);border-color:var(--brand);font-weight:600}
.opt input{margin-right:9px}
.btn{width:100%;margin-top:18px;background:var(--brand);color:#fff;border:0;padding:13px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5}
.msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px}
.ok{color:var(--brand)} .err{color:#E24B4A}
.result{text-align:center;padding:18px}
.result .score{font-size:42px;font-weight:800;color:var(--brand)}
.note{margin-top:14px;font-size:12px;color:var(--sub);background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2 id="title">📝 测试题提交</h2>
    <div class="sub" id="subtitle">完成答题后系统自动算分并进入排行榜</div>
    <div class="guide" id="guide" style="display:none"></div>
    <label class="sid">学号 *</label>
    <input id="sid" type="text" placeholder="例如 20250301" autocomplete="off">
    <div id="quizBox"></div>
    <button class="btn" id="submit">提交并算分</button>
    <div class="msg" id="msg"></div>
    <div class="note">提交以<b>学号</b>为唯一标识：同一学号重复提交将<b>覆盖为最新成绩</b>，排行榜按提交时间排序。</div>
  </div>
  <div class="card result" id="resultCard" style="display:none"></div>
</div>

<script>
let QUIZ={intro:'',questions:[]};
async function load(){
  try{
    const j=await (await fetch('/api/config')).json();
    if(j.title) document.getElementById('title').textContent='📝 '+j.title;
    QUIZ=j.quiz||{intro:'',questions:[]};
    if(QUIZ.intro){ const g=document.getElementById('guide'); g.style.display='block'; g.innerHTML=QI(QUIZ.intro); }
    render();
  }catch(e){ document.getElementById('quizBox').innerHTML='<p style="color:#E24B4A">加载题目失败：'+e.message+'</p>'; }
}
function QI(s){return String(s||'').replace(/\n/g,'<br>');}
function render(){
  const box=document.getElementById('quizBox');
  if(!QUIZ.questions||!QUIZ.questions.length){ box.innerHTML='<p style="color:var(--sub)">教师尚未配置题目。</p>'; return; }
  box.innerHTML=QUIZ.questions.map((q,i)=>`
    <div class="q" data-i="${i}">
      <div class="qt">${i+1}. ${esc(q.q)} <span class="pts">（${q.score||0}分）</span></div>
      ${(q.options||[]).map((o,k)=>`<label class="opt" data-k="${k}"><input type="radio" name="q${i}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}
    </div>`).join('');
  box.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
    const q=el.closest('.q'); q.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel'); el.querySelector('input').checked=true;
  });
}
async function submit(){
  const sid=document.getElementById('sid').value.trim();
  const msg=document.getElementById('msg');
  if(!sid){ msg.className='msg err'; msg.textContent='请填写学号'; return; }
  if(!QUIZ.questions.length){ msg.className='msg err'; msg.textContent='教师尚未配置题目'; return; }
  const answers={}; let total=0,got=0;
  QUIZ.questions.forEach((q,i)=>{
    const sel=document.querySelector(`input[name="q${i}"]:checked`);
    const val=sel?sel.value:'';
    answers['Q'+(i+1)]=val;
    total+=(q.score||0);
    if(val && val===q.answer) got+=(q.score||0);
  });
  const btn=document.getElementById('submit'); btn.disabled=true; msg.textContent='提交中…';
  try{
    const res=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ sid, type:'quiz', fields:answers, score:got })});
    const j=await res.json();
    if(j.ok){
      msg.className='msg ok'; msg.textContent='✓ 提交成功（第 '+j.rank+' 名）';
      showResult(got,total);
    } else { msg.className='msg err'; msg.textContent='失败：'+(j.msg||'未知错误'); }
  }catch(e){ msg.className='msg err'; msg.textContent='提交出错：'+e.message; }
  finally{ btn.disabled=false; }
}
function showResult(got,total){
  const c=document.getElementById('resultCard'); c.style.display='block';
  c.innerHTML=`<div style="color:var(--sub);font-size:13px">本次得分</div>
    <div class="score">${got} <span style="font-size:18px;color:var(--sub)">/ ${total}</span></div>
    <div style="margin-top:8px">提交以学号为准，重复提交将更新为最新成绩。</div>`;
  c.scrollIntoView({behavior:'smooth'});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
document.getElementById('submit').onclick=submit;
load();
</script>
</body>
</html>
