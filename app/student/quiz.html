<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>测验 / 检测 · 班级工作台</title>
<link rel="stylesheet" href="style.css">
<style>
.qzx-wrap{max-width:820px;margin:0 auto;padding:16px 14px 110px}
.qzx-hd{background:var(--card,#fff);border:1px solid var(--line,#e4e8e6);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.qzx-hd h1{margin:0 0 6px;font-size:19px;font-weight:700}
.qzx-hd .qzx-sub{font-size:12.5px;color:var(--ink3,#6b7772);line-height:1.8}
.qzx-pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:7px;background:#eef4f1;color:#0F6E56;margin-right:6px}
.qzx-pill.warn{background:#fff3e0;color:#8a5a00}
.qzx-q{background:var(--card,#fff);border:1px solid var(--line,#e4e8e6);border-radius:13px;padding:14px 15px;margin-bottom:11px}
.qzx-q-t{font-size:14px;font-weight:600;line-height:1.7;margin-bottom:10px}
.qzx-q-t .n{color:var(--brand-primary,#0F6E56);font-weight:700;margin-right:6px}
.qzx-q-t .ty{font-size:11px;font-weight:500;color:var(--ink3,#6b7772);border:1px solid var(--line,#e4e8e6);border-radius:6px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.qzx-opt{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid var(--line,#e6eae8);border-radius:9px;margin:6px 0;cursor:pointer;font-size:13.5px;line-height:1.6}
.qzx-opt:has(input:checked){border-color:var(--brand-primary,#0F6E56);background:rgba(15,110,86,.06)}
.qzx-opt input{margin-top:3px;flex:none}
.qzx-inp,.qzx-ta,.qzx-sel{width:100%;box-sizing:border-box;border:1px solid var(--line,#dfe5e2);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--card,#fff);color:inherit}
.qzx-ta{min-height:96px;resize:vertical;line-height:1.7}
.qzx-match{display:flex;gap:8px;align-items:center;margin:7px 0}
.qzx-match .l{flex:1;font-size:13px;padding:8px 10px;background:rgba(127,127,127,.06);border-radius:8px}
.qzx-match select{flex:1;min-width:120px}
.qzx-img{margin-top:8px}
.qzx-img img{max-width:100%;max-height:190px;border-radius:9px;border:1px solid var(--line,#e6eae8);display:block;margin-top:7px}
.qzx-foot{position:fixed;left:0;right:0;bottom:0;background:var(--card,#fff);border-top:1px solid var(--line,#e4e8e6);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -6px 20px rgba(0,0,0,.05)}
.qzx-foot-in{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.qzx-foot .btn{width:auto;flex:none;padding:10px 22px}
.qzx-prog{font-size:12px;color:var(--ink3,#6b7772);flex:1;min-width:130px}
.qzx-receipt{background:#eef7f3;border:1px solid #cfe8dd;border-radius:13px;padding:14px 16px;margin-bottom:12px}
.qzx-receipt h2{margin:0 0 8px;font-size:16px}
.qzx-ans{border-top:1px dashed #b9d9cc;padding-top:9px;margin-top:9px;font-size:12.5px;line-height:1.8}
.qzx-ans .ok{color:#0F6E56;font-weight:700}
.qzx-ans .bad{color:#B3261E;font-weight:700}
.qzx-ans .mut{color:var(--ink3,#6b7772)}
.qzx-err{background:#fdeceb;border:1px solid #f0c9c5;color:#8a1c14;border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:13px}
.qzx-loading{text-align:center;padding:44px 12px;color:var(--ink3,#6b7772);font-size:13.5px}
@media(max-width:520px){.qzx-wrap{padding:12px 10px 118px}.qzx-q{padding:12px}}
</style>
</head>
<body>
<div class="qzx-wrap" id="app"><div class="qzx-loading">正在读取试卷…</div></div>
<script>
(function(){
  'use strict';
  var $ = function(s,r){return (r||document).querySelector(s);};
  var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function api(url,opt){return fetch(url,Object.assign({credentials:'same-origin',
      headers:{'Content-Type':'application/json'}},opt||{})).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){j._status=r.status;return j;});});}
  function qs(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);
    return m?decodeURIComponent(m[1]):'';}
  function toast(msg){
    var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t); requestAnimationFrame(function(){t.classList.add('on');});
    setTimeout(function(){t.classList.remove('on');setTimeout(function(){t.remove();},250);},2200);
  }
  var PUB = qs('pub');
  var S = {paper:null, pub:null, me:null, now:null, cls:'', receipt:null, busy:false, imgs:{}};
  var TN = {single:'单选题',multiple:'多选题',blank:'填空题',judge:'判断题',
            match:'连线题',essay:'简答题',image:'图片上传'};

  function render(){
    var app=$('#app'); if(!app) return;
    if(!S.paper){ app.innerHTML='<div class="qzx-loading">正在读取试卷…</div>'; return; }
    var p=S.pub||{}, paper=S.paper;
    var can = p.open && (p.allow_multiple ? (Number(p.attempts||0)<Number(p.max_attempts||1))
                                          : !(Number(p.attempts||0)>0));
    var head='<div class="qzx-hd"><h1>'+esc(paper.title||p.title||'测验')+'</h1>'
      +'<div class="qzx-sub">'
      +'<span class="qzx-pill">'+esc(S.cls||'本班')+'</span>'
      +'<span class="qzx-pill">'+esc((S.me&&S.me.name)||'')+' '+esc((S.me&&S.me.no)||'')+'</span>'
      +'<span class="qzx-pill">满分 '+esc(paper.total)+' 分</span>'
      +(p.open_at?'<span class="qzx-pill">开放 '+esc(p.open_at)+'</span>':'')
      +(p.close_at?'<span class="qzx-pill">截止 '+esc(p.close_at)+'</span>':'')
      +'<br>服务端时间 '+esc((S.now||{}).date||'')+' '+esc((S.now||{}).time||'')
      +' · 已提交 '+(p.attempts||0)+' 次'
      +(p.allow_multiple?'（最多 '+esc(p.max_attempts)+' 次）':'（本次仅允许提交 1 次）')
      +(paper.desc?'<br>'+esc(paper.desc):'')
      +'</div></div>';
    var err='';
    if(!p.open) err='<div class="qzx-err">'+
      (p.state==='before'?'测验还没到开放时间。':p.state==='expired'?'测验已截止。':'测验已关闭。')+
      '现在只能查看，不能提交。</div>';
    else if(!can) err='<div class="qzx-err">'+
      (p.allow_multiple?'已达到提交次数上限。':'本次测验只允许提交一次，你已经交过了。')+
      '下面是这次的提交回执。</div>';
    var receipt=S.receipt?receiptHtml(S.receipt):'';
    var qsHtml=(paper.questions||[]).map(function(q,i){
      return '<div class="qzx-q" data-q="'+esc(q.id)+'"><div class="qzx-q-t">'
        +'<span class="n">第 '+(i+1)+' 题</span>'
        +'<span class="ty">'+esc(TN[q.type]||q.type)+'</span> '
        +esc(q.title||'')+'</div>'+questionHtml(q,i)+'</div>';
    }).join('');
    var foot='<div class="qzx-foot"><div class="qzx-foot-in">'
      +'<span class="qzx-prog" id="qzxProg">共 '+(paper.questions||[]).length+' 题</span>'
      +(can?'<button class="btn btn-primary" id="qzxSubmit">提交答卷</button>'
           :'<button class="btn" id="qzxBack">返回学生端</button>')
      +'<button class="btn" style="width:auto" id="qzxClose">关闭本页</button>'
      +'</div></div>';
    app.innerHTML=head+err+receipt+(can?qsHtml:'')+foot;
    bind();
    if(can) setTimeout(updateProg,60);
  }
  function questionHtml(q,i){
    var id=esc(q.id), t=q.type;
    if(t==='single'||t==='multiple'){
      var opts=(q.options||[]);
      if(!opts.length) opts=[{key:'A',text:'选项 A'},{key:'B',text:'选项 B'}];
      return opts.map(function(o){
        return '<label class="qzx-opt"><input type="'+(t==='multiple'?'checkbox':'radio')+'" '
          +'name="q_'+id+'" value="'+esc(o.key)+'"><span><b>'+esc(o.key)+'.</b> '+esc(o.text)+'</span></label>';
      }).join('');
    }
    if(t==='judge') return ['对','错'].map(function(v){
      return '<label class="qzx-opt"><input type="radio" name="q_'+id+'" value="'+v+'"><span>'+v+'</span></label>';
    }).join('');
    if(t==='blank') return '<input class="qzx-inp" data-qi="'+id+'" placeholder="在这里填写答案" autocomplete="off">';
    if(t==='essay') return '<textarea class="qzx-ta" data-qi="'+id+'" placeholder="写下你的回答"></textarea>';
    if(t==='match'){
      var lefts=q.lefts||[], choices=q.choices||[];
      return '<div class="qzx-note" style="font-size:12px;color:var(--ink3);margin-bottom:6px">把右边的答案连到左边的每一项</div>'
        + lefts.map(function(l,k){
          return '<div class="qzx-match"><span class="l">'+esc(l)+'</span>'
            +'<select class="qzx-sel" data-ml="'+esc(l)+'"><option value="">请选择…</option>'
            +choices.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('')
            +'</select></div>';
        }).join('');
    }
    if(t==='image') return '<div class="qzx-img"><input type="file" accept="image/*" data-qimg="'+id+'">'
      +'<div class="qzx-note" style="font-size:12px;color:var(--ink3);margin-top:6px">单张不超过 2MB，提交后由老师批阅</div>'
      +'<div id="qzxPrev_'+id+'"></div></div>';
    return '<input class="qzx-inp" data-qi="'+id+'">';
  }
  function bind(){
    var sub=$('#qzxSubmit');
    if(sub) sub.onclick=submit;
    var back=$('#qzxBack'); if(back) back.onclick=function(){location.href='/s/#quiz';};
    var close=$('#qzxClose'); if(close) close.onclick=function(){window.close();setTimeout(function(){location.href='/s/#quiz';},250);};
    $$('[data-qimg]').forEach(function(inp){
      inp.onchange=function(){
        var f=inp.files&&inp.files[0]; if(!f) return;
        if(f.size>2*1024*1024){toast('图片超过 2MB，请换一张');inp.value='';return;}
        var qid=inp.getAttribute('data-qimg');
        var rd=new FileReader();
        rd.onload=function(){
          S.imgs[qid]={name:f.name,data:String(rd.result)};
          var box=$('#qzxPrev_'+qid);
          if(box) box.innerHTML='<img src="'+esc(String(rd.result))+'" alt="已选图片">';
        };
        rd.readAsDataURL(f);
      };
    });
  }
  function updateProg(){
    var total=(S.paper.questions||[]).length, done=0;
    (S.paper.questions||[]).forEach(function(q){if(hasAnswer(q))done++;});
    var el=$('#qzxProg'); if(el) el.textContent='已作答 '+done+' / '+total+' 题';
  }
  function hasAnswer(q){
    var id=q.id;
    if(q.type==='single'||q.type==='judge') return !!$('#app input[name="q_'+CSS.escape(id)+'"]:checked');
    if(q.type==='multiple') return $$('#app input[name="q_'+CSS.escape(id)+'"]:checked').length>0;
    if(q.type==='blank'||q.type==='essay'){
      var el=$('#app [data-qi="'+CSS.escape(id)+'"]'); return !!(el&&String(el.value||'').trim());
    }
    if(q.type==='match') return $$('#app [data-ml]').some(function(s){return !!s.value;});
    if(q.type==='image') return !!S.imgs[id];
    return false;
  }
  function collect(){
    var out={};
    (S.paper.questions||[]).forEach(function(q){
      var id=q.id;
      if(q.type==='single'||q.type==='judge'){
        var el=$('#app input[name="q_'+CSS.escape(id)+'"]:checked'); out[id]=el?el.value:'';
      } else if(q.type==='multiple'){
        out[id]=$$('#app input[name="q_'+CSS.escape(id)+'"]:checked').map(function(x){return x.value;});
      } else if(q.type==='blank'||q.type==='essay'){
        var t=$('#app [data-qi="'+CSS.escape(id)+'"]'); out[id]=t?t.value:'';
      } else if(q.type==='match'){
        var m={}; $$('#app [data-ml]').forEach(function(s){
          if(s.getAttribute('data-ml')&&s.value) m[s.getAttribute('data-ml')]=s.value;});
        out[id]=m;
      } else if(q.type==='image'){
        out[id]=S.imgs[id]||{name:'',data:''};
      }
    });
    return out;
  }
  function submit(){
    if(S.busy) return;
    var answers=collect();
    S.busy=true;
    var btn=$('#qzxSubmit'); if(btn){btn.disabled=true;btn.textContent='提交中…';}
    api('/api/v2/quiz/student/submit',{method:'POST',body:JSON.stringify({pub:PUB,answers:answers})})
      .then(function(j){
        S.busy=false;
        if(!j.ok){ toast(j.msg||'提交失败'); if(btn){btn.disabled=false;btn.textContent='提交答卷';} return; }
        S.receipt=j.receipt;
        // 次数用完 / 未开放：重新拉一次试卷状态再渲染回执
        return api('/api/v2/quiz/student/paper?pub='+encodeURIComponent(PUB)).then(function(k){
          if(k.ok){S.pub=k.publish;S.now=k.now;S.paper=k.paper;S.cls=k.class_name;S.me=k.student;}
          render();
          try{window.scrollTo(0,0);}catch(e){}
          toast('提交成功');
        });
      }).catch(function(){
        S.busy=false; toast('连不上老师电脑，请确认在同一 Wi-Fi');
        if(btn){btn.disabled=false;btn.textContent='提交答卷';}
      });
  }
  function fmt(v){
    if(v==null) return '';
    if(Array.isArray(v)) return v.map(function(x){
      return (Array.isArray(x)&&x.length>=2)?(x[0]+' → '+x[1]):String(x);}).join('、');
    if(typeof v==='object') return Object.keys(v).map(function(k){return k+' → '+v[k];}).join('、');
    return String(v);
  }
  function receiptHtml(r){
    if(!r) return '';
    var h='<div class="qzx-receipt"><h2>✅ 提交成功</h2>'
      +'<div class="qzx-sub" style="font-size:12.5px;color:var(--ink3)">'
      +esc(String(r.submitted_at||''))+' · 第 '+r.attempt+' 次提交</div>';
    if(r.show_score){
      h+='<div style="font-size:20px;font-weight:700;margin:10px 0;color:#0F6E56">'
        +esc(r.score)+' <span style="font-size:13px;font-weight:500">/ '+esc(r.auto_full)+' 分（客观题）</span></div>';
      if(r.needs_grade) h+='<div class="qzx-note" style="font-size:12px">简答 / 图片题由老师批阅后会补进总分；整卷满分 '+esc(r.full)+' 分。</div>';
    } else {
      h+='<div class="qzx-note" style="font-size:12.5px;margin-top:8px">按老师设置，本次提交后不显示分数。</div>';
    }
    if(r.show_answer){
      var mine=r.mine||{}, ans=r.answers||{}, det=r.detail||{};
      var lines=(S.paper.questions||[]).map(function(q,i){
        var id=q.id, d=det[id]||{}, a=ans[id]||{};
        var right=fmt(a.answer||(a.pairs||[]));
        if(!right && (a.accept||[]).length) right=fmt(a.accept);
        var mineV=mine[id];
        /* 图片题的答案落库后是 {name,size,url}，别把地址当文字糊到答案对照里 */
        if(q.type==='image'&&mineV&&typeof mineV==='object') mineV='[已上传图片]';
        var mark=d.correct===true?'<span class="ok">✓ 答对</span>'
          :d.correct===false?'<span class="bad">✗ 答错</span>':'<span class="mut">待批阅</span>';
        return '<div style="margin:7px 0"><b>'+(i+1)+'. '+esc(q.title||'')+'</b> '+mark
          +'<br><span class="mut">你的作答：</span>'+esc(fmt(mineV)||'（未作答）')
          +'<br><span class="mut">正确答案：</span>'+esc(right||'—')+'</div>';
      }).join('');
      h+='<div class="qzx-ans"><b>答案对照</b>'+lines+'</div>';
    } else {
      h+='<div class="qzx-note" style="font-size:12.5px;margin-top:6px">按老师设置，本次提交后不显示答案。</div>';
    }
    return h+'</div>';
  }
  function boot(){
    if(!PUB){$('#app').innerHTML='<div class="qzx-err">缺少测验编号，请从学生端「测验」页进入。</div>';return;}
    api('/api/v2/quiz/student/paper?pub='+encodeURIComponent(PUB)).then(function(j){
      if(!j.ok){ $('#app').innerHTML='<div class="qzx-err">'+esc(j.msg||'打不开这份测验')
        +'<br><br><a href="/s/#quiz">← 返回学生端</a></div>'; return; }
      S.paper=j.paper;S.pub=j.publish;S.now=j.now;S.cls=j.class_name;S.me=j.student;
      return api('/api/v2/quiz/student/result?pub='+encodeURIComponent(PUB)).then(function(k){
        if(k.ok) S.receipt=k.receipt; render();
      });
    }).catch(function(){
      $('#app').innerHTML='<div class="qzx-err">连不上老师电脑，请确认在同一 Wi-Fi 后刷新。</div>';
    });
  }
  boot();
})();
</script>
</body>
</html>
