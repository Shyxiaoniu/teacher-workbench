<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八只宠物的样子 · 打字冒险岛</title>
<style>
  :root{ --ink:#3B322A; --ink2:#6F6257; --ink3:#9A8B7F; --line:#EADFD2; --brand:#B45B33; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{padding:22px 18px 40px;color:var(--ink);
    background:radial-gradient(900px 420px at 82% -12%,#F6E4CE 0%,rgba(246,228,206,0) 62%),
               radial-gradient(760px 380px at -8% 108%,#EDE9D5 0%,rgba(237,233,213,0) 58%),#F8F2E4;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:20px;font-weight:800;letter-spacing:.3px}
  .sub{font-size:13px;color:var(--ink2);margin:6px 0 18px;line-height:1.7}
  .sub b{color:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .pet{border-radius:20px;padding:10px 10px 12px;text-align:center;
    background:linear-gradient(170deg,#FFFFFF,#FBF3EA);
    border:1px solid rgba(200,160,120,.28);
    box-shadow:0 2px 5px rgba(150,95,50,.07),inset 0 1px 0 #fff}
  /* 台面：和牧场页同一套「顶光 + 内凹 + 台面反光」 */
  .stage{height:190px;border-radius:16px;display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:6px;overflow:hidden;
    background:radial-gradient(118% 92% at 50% 4%,#FFFAF1 0%,#FBE9D7 48%,#F1D9C4 100%);
    box-shadow:inset 0 2px 7px rgba(176,118,68,.16),inset 0 -3px 9px rgba(255,255,255,.78)}
  .stage svg{width:170px;height:170px;display:block;
    filter:drop-shadow(0 7px 9px rgba(140,88,48,.17))}
  .pet b{display:block;font-size:14px;margin-top:9px}
  .pet small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.5}
  .foot{margin-top:22px;font-size:12px;color:#B3A698;line-height:1.9;text-align:center}
  @media (max-width:820px){ .grid{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <h1>八只伙伴 · 现在的样子</h1>
  <div class="sub">
    这一版往<b>卡通</b>方向又推了一步：眼睛放大到 6×7、头再放大 6%，腮红铺到 8.8 宽，<br>
    外加一圈<b>同色系深色轮廓</b>（不是黑线，是主色压暗 60% 的柔和描边）—— 远看是卡通角色，近看仍有硅胶玩具的体积光；<br>
    八只靠体型与专属道具区分：柴犬尖耳红项圈、垂耳兔真垂耳胡萝卜、企鹅燕尾领结、熊猫竹子、恐龙背棘、独角兽金角鬃毛、小龙翅脉；<br>
    呼吸 / 眨眼 / 摆尾 / 摇头四层动效常驻，伙伴有了默认名字：<b>小豆丁</b>（品种名退到副标题）。
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">打字冒险岛 · 与牧场、排行榜共用同一份 typing-data.js</div>
</div>
<script src="typing-data.js?v=20261102s"></script>
<script>
(function () {
  'use strict';
  document.getElementById('grid').innerHTML = TD.PETS.map(function (p) {
    return '<div class="pet"><span class="stage">' + TD.petSvg(p, []) + '</span>' +
      '<b>' + p.name + '</b><small>' + p.mood + '</small></div>';
  }).join('');
})();
</script>
</body>
</html>
