<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打字冒险岛 · 班级工作台</title>
<meta name="theme-color" content="#B45B33">
<!-- 宠物小像（背景 + 特效）与教师端排行榜共用同一份样式，避免两边长相不一致 -->
<link rel="stylesheet" href="/typing/pet-ui.css?v=20261105">
<script>
/* 主题：与主站共用同一个存储键 wb-smode。
   放在 <head> 里同步执行 —— 首屏就是对的颜色，不会先亮一下再切暗
   （暗色主题最刺眼的就是这一下白闪）。 */
(function () {
  try {
    if (localStorage.getItem('wb-smode') === 'dark') {
      document.documentElement.setAttribute('data-mode', 'dark');
    }
  } catch (e) {}
})();
</script>
<style>
:root{
  --brand:#B45B33; --brand2:#C9713F; --ink:#3B322A; --ink2:#6F6257; --ink3:#9A8B7F;
  --bg:#F8F2E4; --card:#FFFCF4; --line:#EADFD2; --ok:#3E9E5B; --warn:#D9A054; --bad:#C0392B;
  --sky:#5B8DEF; --purple:#8E6FD8; --teal:#2FA6A0;
  /* ---- 主题令牌（2026-11-03 夜间模式）----
     原来这些颜色是直接写死在规则里的（#fff / #FBF5E9 / #FBF7F3 …），
     一旦切夜间就得逐条覆盖，漏一条就留一块白。现在全部收成变量：
     浅色与夜间各给一套值，规则里只用 var()。 */
  --surface:#FFFFFF;          /* 纯白面：按钮、键帽、输入台 */
  --paper:#FBF5E9;            /* 课文区 / 键盘底 / 指法图底 */
  --key:#FBF7F3;              /* 键帽常态 */
  --key-bd:#EADFD4;
  --key-ink:#6B6257;
  --dim:#C2B9AE;              /* 未敲到的字 */
  --art-todo:#8C9AA5;         /* 文章逐行视图：待输入文字（冷灰蓝） */
  --cur-bg:#F7E2D2;           /* 当前字底纹 */
  --dim-bg:#EFE5D6;           /* 空格占位 */
  --brand-soft:#F6E7D6;
  --sun-bg:#FFF8E2; --sun-line:#E8C96A; --sun-ink:#8A6A1C;
  --info-bg:#EAF3FF; --info-line:#BBD4F5; --info-ink:#2E5E9E;
  --info-badge-bg:#EDF3FB; --info-badge-ink:#2F5C93;
  --en-ok-bg:#EAF4EC; --en-ok-ink:#2C7A46;
  --ok-soft:#D8EEDD; --bad-soft:#FBE3DE;
  --tip-bg:#4A3F33; --tip-ink:#FFEFD9;      /* 拼音气泡 */
  --shadow:rgba(60,30,10,.07);
  --key-3d:#D9B49C;
  --glow1:#F6E4CE; --glow2:#EDE9D5;
  --zone-on:rgba(180,91,51,.07);
  /* 键帽分区底色（按手指） */
  --f-lp:#F1EBFB; --f-lp-bd:#DFD0F4;
  --f-lr:#EAF2FE; --f-lr-bd:#CFE0F8;
  --f-lm:#E7F6F5; --f-lm-bd:#C4E7E5;
  --f-li:#FDF3E3; --f-li-bd:#F3DFBD;
  --f-ri:#EAF6EC; --f-ri-bd:#CDE8D2;
  --f-th:#F3F1EE; --f-th-bd:#E4E0DA;
}
/* 夜间：同一套令牌换值。品牌色提亮（暗底上原先的 #B45B33 只有 3:1），
   底色用暖黑（#191210 / #241B15），避免纯黑 OLED 上的拖影与刺眼对比。 */
html[data-mode="dark"]{
  --brand:#E4926C; --brand2:#F0B392; --ink:#F5EBE4; --ink2:#C9B6A8; --ink3:#A2917F;
  --bg:#191210; --card:#241B15; --line:rgba(226,150,112,.22);
  --ok:#5FBF7E; --warn:#E3BC77; --bad:#F0796F;
  --sky:#7FA7F0; --purple:#B39CF0; --teal:#5CC4BE;
  --surface:#2C221B;
  --paper:#1E1611;
  --key:#2A211B;
  --key-bd:rgba(226,150,112,.20);
  --key-ink:#D9C8BA;
  --dim:#7C6B5F;
  --art-todo:#8E9AA6;
  --cur-bg:rgba(228,146,108,.20);
  --dim-bg:#33271F;
  --brand-soft:rgba(228,146,108,.16);
  --sun-bg:rgba(227,188,119,.13); --sun-line:rgba(227,188,119,.40); --sun-ink:#E3BC77;
  --info-bg:rgba(127,167,240,.13); --info-line:rgba(127,167,240,.35); --info-ink:#A9C4F5;
  --info-badge-bg:rgba(127,167,240,.16); --info-badge-ink:#B7CCF7;
  --en-ok-bg:rgba(95,191,126,.14); --en-ok-ink:#8FD3A5;
  --ok-soft:rgba(95,191,126,.20); --bad-soft:rgba(240,121,111,.18);
  --tip-bg:#F5EBE4; --tip-ink:#2A1B14;
  --shadow:rgba(0,0,0,.45);
  --key-3d:#15100C;
  --glow1:#2A1B14; --glow2:#1F1A14;
  --zone-on:rgba(228,146,108,.09);
  --f-lp:#2E2438; --f-lp-bd:rgba(142,111,216,.42);
  --f-lr:#1F2734; --f-lr-bd:rgba(91,141,239,.38);
  --f-lm:#1B2C2B; --f-lm-bd:rgba(47,166,160,.38);
  --f-li:#2F2517; --f-li-bd:rgba(232,161,60,.40);
  --f-ri:#1D2B20; --f-ri-bd:rgba(62,158,91,.40);
  --f-th:#26221E; --f-th-bd:rgba(200,190,178,.24);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:
  radial-gradient(1200px 500px at 80% -10%, var(--glow1) 0%, transparent 60%),
  radial-gradient(900px 400px at -10% 110%, var(--glow2) 0%, transparent 55%),
  var(--bg);
  /* 固定在视口：吸顶区要复制同一套背景（.stick-top），两层都 fixed 才对得齐 */
  background-attachment:fixed;
  color:var(--ink);-webkit-font-smoothing:antialiased}
#app{max-width:1180px;margin:0 auto;padding:14px 16px 20px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;
  padding:10px 22px;border-radius:12px;font-size:15px;font-weight:600;
  box-shadow:0 4px 14px rgba(180,91,51,.3);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.line{background:var(--surface);color:var(--brand);border:2px solid var(--brand);box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink2);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* 顶栏 */
.top{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:10px 16px;box-shadow:0 6px 20px var(--shadow)}
/* 吸顶区（2026-11-05 调整）：只钉「打字冒险岛」标题行。
   之前顶栏 + 演示条 + 教师练习条 + 页签整块常驻，1080p 上吃掉近 200px，
   地图只剩半屏；现在只有标题行跟随滚动，其余内容随页面正常滚走，
   可视区回到接近满屏。
   实现要点：
     · position:sticky + top:-14px：留出 padding 让卡片离屏幕顶 6px，
       再用负 margin 把这段 padding 吃回去，静止时位置与普通块完全一致
       （不产生 layout 跳动）；
     · z-index:30：高于页面卡片（默认 auto / 1~6），低于弹层
       （.py-pop 40 / .mask 50），所以滚到标题下面的内容会被遮住，
       而文章库、提示弹窗仍然盖在它上面；
     · 背景复制 body 那一套（同样 fixed）：滚动时下方内容不会从
       缝里透出来（半透明+模糊实测会透出卡片边缘）。 */
.stick-top{position:sticky;top:-14px;z-index:30;
  margin:-20px -6px 0;padding:20px 6px 6px;
  /* 背景 = 与 body 完全相同的一套（同样 fixed），这样它是实底的、挡得住
     下方内容，又和周围页面严丝合缝，不会留下一条色块分界。 */
  background:
    radial-gradient(1200px 500px at 80% -10%, var(--glow1) 0%, transparent 60%),
    radial-gradient(900px 400px at -10% 110%, var(--glow2) 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  border-radius:0 0 18px 18px}
body.embed .stick-top{margin:-20px -4px 0;padding:20px 4px 6px}
.logo{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:1px;white-space:nowrap}
.logo small{font-size:12px;color:var(--ink3);font-weight:400;margin-left:6px}
.meter{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.chip{background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:5px}
.chip.b{background:var(--sun-bg);color:var(--sun-ink)}
.chip.p{background:color-mix(in srgb,var(--purple) 14%,transparent);color:var(--purple)}
/* 统一积分 chip：数字单独一个节点，refreshPts 只改它，变动时轻微弹一下 */
.pts-live{font-variant-numeric:tabular-nums;white-space:nowrap}
.pts-live b{font-weight:800;font-size:14.5px;min-width:1.2em;text-align:center}
.pts-live.pts-bump{animation:ptsBump .42s ease}
@keyframes ptsBump{0%{transform:scale(1)}38%{transform:scale(1.14);filter:brightness(1.12)}100%{transform:scale(1)}}
.pet-mini{width:44px;height:44px;border-radius:13px;flex:none;overflow:hidden;
  background:radial-gradient(72% 62% at 50% 74%,var(--paper) 0%,var(--card) 100%);
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--surface),0 1px 3px var(--shadow)}
.pet-mini svg{width:100%;height:100%}
.tabs{display:flex;gap:6px;margin:14px 0 0}
.tabs button{padding:9px 18px;border-radius:12px;font-size:14.5px;font-weight:600;color:var(--ink2);
  background:var(--surface);border:1.5px solid var(--line)}
.tabs button.on{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;
  box-shadow:0 4px 12px rgba(180,91,51,.25)}
.demo-bar{margin-top:12px;background:var(--sun-bg);border:1.5px dashed var(--sun-line);color:var(--sun-ink);
  border-radius:12px;padding:9px 14px;font-size:13.5px}
/* 教师练习条：开关与班级选择跟文字同行，窄屏自动换行（2026-11-03） */
.teacher-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.teacher-bar .tw-lb{display:inline-flex;align-items:center;gap:5px;font-weight:700;cursor:pointer;white-space:nowrap}
.teacher-bar .tw-lb input{margin:0;cursor:pointer;accent-color:var(--brand)}
.teacher-bar select{font-family:inherit;font-size:13px;padding:4px 9px;border-radius:9px;
  border:1.5px solid var(--sun-line);background:var(--card);color:inherit;cursor:pointer}
.teacher-bar select:disabled{opacity:.55;cursor:not-allowed}
.teacher-bar .tw-tip{font-size:12px;opacity:.85}
/* 折叠态（2026-11-05）：提示默认收成一行，吸顶区少吃一截竖向空间，
   下方正文（冒险地图 / 排行榜 / 牧场）能多露出一段。点「展开」才看全文。 */
.teacher-bar .tw-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.teacher-bar .tw-sum .tw-state{font-size:12.5px;opacity:.85}
.teacher-bar .tw-full{display:contents}
.teacher-bar.is-open .tw-sum{display:none}
.teacher-bar:not(.is-open) .tw-full{display:none}
.tw-toggle{margin-left:auto;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  padding:4px 12px;border-radius:99px;border:1.5px solid var(--sun-line);
  background:var(--card);color:inherit;white-space:nowrap}
.tw-toggle:hover{background:var(--sun-bg);border-color:var(--sun-ink)}
.off-bar{margin:60px auto 0;max-width:460px;text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:44px 30px;box-shadow:0 8px 24px var(--shadow)}
.off-bar .big{font-size:44px;margin-bottom:10px}
.off-bar h2{font-size:19px;margin-bottom:8px}
.off-bar p{color:var(--ink2);font-size:14px;line-height:1.7}

/* 冒险地图 */
.map-head{display:flex;align-items:center;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.stage-chip{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;font-size:13.5px;
  font-weight:600;background:var(--surface);border:1.5px solid var(--line);color:var(--ink2)}
.stage-chip.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.stage-chip .ic{font-size:16px}
.stage-desc{font-size:13px;color:var(--ink3);margin:0 0 12px 2px}
.chap-bar{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.chap-bar b{font-size:16px;color:var(--ink)}
.chap-nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.chap-nav button{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);
  font-size:16px;color:var(--ink2)}
.chap-nav button:disabled{opacity:.35}
.chap-nav span{font-size:13px;color:var(--ink3);min-width:70px;text-align:center}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lv{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;position:relative;
  transition:transform .12s,border-color .12s;text-align:left;width:100%}
.lv:not(.lock):hover{transform:translateY(-2px);border-color:var(--brand)}
.lv.lock{opacity:.55;cursor:not-allowed;background:var(--paper)}
.lv .no{font-size:13px;color:var(--ink3);font-weight:600}
.lv .nm{font-size:15.5px;font-weight:700;margin:3px 0 7px;color:var(--ink)}
.lv .stars{font-size:13px;letter-spacing:2px;color:var(--sun-line)}
.lv .stars .off{color:var(--line)}
.lv.boss{border-color:var(--sun-line);background:linear-gradient(160deg,var(--card),var(--sun-bg))}
.lv.boss .nm{color:var(--sun-ink)}
.lv .boss-tag{position:absolute;top:-9px;right:10px;background:#E0A93C;color:#fff;font-size:10.5px;
  padding:2px 8px;border-radius:999px;font-weight:700}
.lv .lock-tag{position:absolute;top:12px;right:12px;font-size:14px}
.lv .best{font-size:11.5px;color:var(--ink3);margin-top:5px}
.chap-done{display:inline-block;margin-left:8px;font-size:12px;color:var(--ok);font-weight:600}

/* 练习 */
/* 2026-11-02 二次调整：练习卡片改为「撑满一屏的弹性列」——
   卡片吃掉视口剩余高度，键盘容器 flex:1 吸收余量，页面底部不再留大片空白；
   键盘本身不再是「键帽各自 clamp」，而是一整块 880px 设计稿整体等比缩放，
   放大缩小时键宽/键高/字号/圆角/间距同比例变化，不会被单独拉长。 */
.play-wrap{margin-top:0;min-height:calc(100vh - 34px);display:flex}
body.embed .play-wrap{min-height:calc(100vh - 20px)}
.play-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 18px 10px;
  box-shadow:0 8px 26px rgba(60,30,10,.07);
  flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.play-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.play-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.play-top .bt{font-size:15.5px;font-weight:800}
.play-top .sub{font-size:11.5px;color:var(--ink3)}
.live{margin-left:auto;display:flex;gap:8px}
.live .chip{font-variant-numeric:tabular-nums}
.ime-hint{margin-top:10px;background:var(--info-bg);border:1.5px solid var(--info-line);color:var(--info-ink);border-radius:10px;
  padding:8px 12px;font-size:13px;flex:0 0 auto}
.stage1-hint{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink2);font-size:13px}
.stage1-hint b{color:var(--brand)}
/* 课文区（2026-11-02 改）：默认只显示汉字，不显示拼音；
   点击任意汉字，在它上方弹出带声调的拼音气泡（点击别处/再点同字收起）。
   气泡挂在 .text-wrap（position:relative）上 —— 课文打字时逐字重渲染，
   挂在里面会被 innerHTML 冲掉。已打=绿、当前=暖底纹+光标、未打=灰。 */
/* 输入法 / 修饰键提示条（2026-11-02 新增）
   练「大小写与标点」「中英混排」「数字小键盘」时，学生卡住的原因几乎
   都不是"不会打"，而是：输入法状态没切、忘了按 Shift、NumLock 没开。
   所以把「现在该处于什么状态」和「这一下要不要按 Shift」直接摆在
   课文上方，不用等打错了才发现。 */
.ime-bar{display:flex;align-items:center;gap:9px;margin-top:8px;flex-wrap:wrap;
  background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:6px 11px;flex:0 0 auto}
.ime-badge{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:8px;
  background:var(--info-badge-bg);color:var(--info-badge-ink);white-space:nowrap;transition:background .15s,color .15s}
.ime-bar.on-cn .ime-badge{background:var(--brand-soft);color:var(--brand)}
.ime-bar.on-en .ime-badge{background:var(--en-ok-bg);color:var(--en-ok-ink)}
.ime-note{font-size:12px;color:var(--ink3);line-height:1.5;flex:1 1 120px;min-width:0}
.ime-key{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12.5px;
  font-weight:800;color:var(--brand);white-space:nowrap}
.ime-key kbd{font-family:Consolas,monospace;background:var(--surface);border:1.5px solid var(--line);
  border-bottom-width:2.5px;border-radius:6px;padding:1px 6px;font-size:12px;color:var(--ink)}
.ime-key .sl{color:var(--ink3);font-weight:700;font-size:11px}
/* 小键盘篇章：主键区压暗、小键盘提亮，一眼看出用哪个区 */
.kb-blk.kb-dim{opacity:.24;filter:grayscale(.55);transition:opacity .2s}
.kb-blk.kb-focus{filter:drop-shadow(0 0 9px rgba(232,161,60,.45))}
.text-wrap{position:relative;flex:0 0 auto;margin-top:8px}
/* 长文（整篇文章）模式：课文区自己滚动，不把整页撑爆；字号略收一档，
   屏幕上能多看到几行，打字时不用频繁滚动找位置（2026-11-04） */
.text-wrap.long .text-line{max-height:min(42vh,420px);overflow:auto;justify-content:flex-start}
.text-wrap.long .ch .hz{font-size:22px;line-height:28px}
/* ===== 文章逐行视图（2026-11-05） =====
   牛哥要求：文章练习的输入区改成逐行显示，每行与原文行一一对应。
   一行一块：上行是原文（待输入 / 已输入 / 当前），下行是该行的上屏回显
   （打对的字填进对应格、没打到的透明占位），两行字号一致、逐字对齐；
   当前行整块高亮并自动滚到视野里。闪烁光标在下方输入台里，不压课文。 */
.art-box{position:relative;flex:1 1 auto;min-height:0;margin-top:8px;
  display:flex;flex-direction:column;gap:5px;overflow:auto;
  max-height:min(58vh,600px);padding:5px 4px 8px;
  border:2px solid var(--line);border-radius:16px;background:var(--paper)}
.art-row{display:flex;gap:9px;align-items:flex-start;flex:none;
  border-radius:11px;padding:5px 8px 6px;border:1.5px solid transparent;transition:background .12s,border-color .12s}
.art-row.on{background:var(--cur-bg);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.art-no{flex:none;width:24px;text-align:right;font-size:12px;font-weight:700;
  color:var(--ink3);line-height:31px;font-variant-numeric:tabular-nums}
.art-row.on .art-no{color:var(--brand)}
.art-main{flex:1 1 auto;min-width:0}
.art-orig{display:flex;flex-wrap:wrap;gap:2px 3px;align-content:flex-start}
/* 逐行视图（2026-11-05 牛哥定版）：上行「待输入 + 已输入」的原文，
   下行是这一行真正上屏的字。两行共用同一套字号 / 行高 / 字距，
   第 N 个字上下严格对齐；待输入冷灰、已输入深色，只有打错的那个
   已输入字是红色 —— 原文行永远显示原文，不跟着标红。 */
.art-orig .ch .hz,.art-echo .ch .hz{font-size:22px;line-height:28px}
.art-orig .ch.d .hz{color:var(--art-todo)}
.art-orig .ch.o .hz{color:var(--ink)}
.art-orig .ch.c .hz{color:var(--brand)}
.art-orig.en-line{display:block;font-size:22px;line-height:1.62;letter-spacing:.6px;text-align:left}
.art-echo{display:flex;flex-wrap:wrap;gap:2px 3px;min-height:28px;margin-top:2px;
  border-top:1px dashed color-mix(in srgb,var(--line) 90%,transparent);padding-top:3px}
.art-echo .ch.d .hz{color:transparent}
.art-echo .ch.o .hz{color:var(--brand)}
.art-echo .ch.e .hz{color:var(--bad);background:var(--bad-soft)}
.art-echo .ch.sp{width:12px;height:15px}
.art-echo .ch.sp.d{background:transparent;box-shadow:none}
.art-echo .ch.sp.o{background:var(--cur-bg);box-shadow:none}
.art-echo .ch.c::after{display:none}
/* 长文模式下的输入条：只留一个窄条 + 说明，上屏内容已经在每一行下面了 */
.typing-bar.slim{padding:5px 12px}
.typing-bar.slim .tb-field{min-height:34px}
.typing-bar.slim .tb-input{font-size:15px;line-height:24px}
.text-line{background:var(--paper);border:2px solid var(--line);
  /* 顶部留 24px：这是拼音气泡的"停靠带"，气泡落在框内而不是压到上面的标题栏 */
  border-radius:16px;padding:24px 12px 9px;min-height:64px;
  display:flex;flex-wrap:wrap;gap:2px 3px;align-content:flex-start;
  /* 课文居中（2026-11-02 按标注调整）：一句话只有十几个字时，左对齐会让
     框右侧空出大半，学生视线被甩到左边；居中后当前字始终落在框的中央。 */
  justify-content:center}
.ch{display:inline-flex;align-items:center;justify-content:center;line-height:1;
  padding:0 1px;border-radius:7px;cursor:pointer}
.ch .hz{font-size:26px;line-height:30px;font-weight:600;color:var(--dim);
  transition:color .12s,background .12s;border-radius:7px}
.ch:hover .hz{color:var(--ink);background:var(--brand-soft)}
.ch.o .hz{color:var(--ok)}
.ch.e .hz{color:var(--bad);background:var(--bad-soft);box-shadow:0 2px 0 color-mix(in srgb,var(--bad) 45%,transparent)}
.ch.c .hz{color:var(--ink);background:var(--cur-bg);box-shadow:0 2px 0 var(--brand)}
/* 光标（2026-11-05 牛哥定版）：闪烁光标放在「输入台里」，不再盖在课文文字上。
   中文关的课文当前格只用底纹提示位置，光标画在 .tb-field 里的 .tb-caret；
   英文关没有输入台，只在当前格左缘留一根细线（left 是字外侧，不压字）。 */
.ch.c{position:relative}
.en-line .c::after{content:'';position:absolute;left:-2px;top:2px;bottom:2px;width:2px;
  border-radius:2px;background:var(--brand);animation:caretBlink 1.06s steps(1,end) infinite}
@keyframes caretBlink{0%,48%{opacity:1}52%,100%{opacity:0}}
/* 空格占位：画成一个可见的浅色小方块，已打变绿、当前变暖色 ——
   中英混排里「QQ 练」中间那一格，学生以前完全看不出要按空格。 */
.ch.sp{width:15px;height:20px;cursor:default;align-self:center;border-radius:5px;
  background:var(--dim-bg);box-shadow:inset 0 0 0 1px var(--line);transition:background .12s}
.ch.sp.o{background:var(--ok-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 40%,transparent)}
.ch.sp.c{background:var(--cur-bg);box-shadow:0 2px 0 var(--brand)}
.ch.sp.e{background:var(--bad-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 45%,transparent)}
/* 拼音气泡：深底浅字 + 小三角，pointer-events:none 不挡后面的点击；
   顶上放不下时加 .flip 翻到字下面，三角也跟着朝上 */
.py-pop{position:absolute;z-index:40;background:var(--tip-bg);color:var(--tip-ink);
  font-size:12.5px;line-height:1;padding:4px 9px 5px;border-radius:8px;
  box-shadow:0 3px 8px rgba(0,0,0,.28);white-space:nowrap;pointer-events:none}
.py-pop::after{content:'';position:absolute;left:50%;bottom:-4px;margin-left:-4px;
  border:4px solid transparent;border-top-color:var(--tip-bg);border-bottom:0}
.py-pop.flip::after{bottom:auto;top:-4px;border-top:0;border-bottom:4px solid var(--tip-bg)}
/* 英文关卡：不标拼音，按普通流式排版（和上一版一致，避免空格被 flex 吃掉） */
.en-line{display:block;font-size:26px;line-height:1.7;letter-spacing:1px;
  word-break:break-all;font-family:Consolas,Menlo,monospace;font-weight:600;color:var(--dim)}
.en-line .d{color:var(--dim)}
.en-line .o{color:var(--ok)}
.en-line .c{color:var(--ink);background:var(--cur-bg);border-radius:6px;box-shadow:0 2px 0 var(--brand)}
.en-line .e{color:var(--bad);background:var(--bad-soft)}
/* 大写角标（2026-11-04 牛哥反馈：字母大小写显示不明显）：大写字母头顶一个
   小 ⇧，远看一眼分得清 a / A。绝对定位不占布局宽度，回显层逐字对齐不受影响。 */
.en-line span{position:relative}
.en-line span.up::before{content:'⇧';position:absolute;top:-.58em;left:50%;
  transform:translateX(-50%);font-size:13px;font-weight:800;line-height:1;
  color:var(--brand);opacity:.95;pointer-events:none}
/* 英文课文区：没有拼音气泡，顶部那 24px 的「停靠带」就是纯留白，
   上下改成等距后一行字才真正落在框的正中（还顺手把框压缩了一圈）。 */
.text-line.en-line{padding:13px 16px;text-align:center}
/* 大键帽：只做"按哪个键"的提示，竖向占位要小 —— 上一版 112px 高，
   加上文字和间距吃掉了 96px 高度，正好是键盘缺的那 100px。 */
.key-big{flex:0 0 auto;margin-top:2px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:1px 0 2px}
.key-cap{width:clamp(54px,7.6vh,70px);height:clamp(54px,7.6vh,70px);border-radius:14px;background:var(--surface);border:2.5px solid var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:clamp(28px,3.9vh,38px);font-weight:800;color:var(--ink);
  box-shadow:0 3px 0 var(--key-3d),0 7px 14px rgba(180,91,51,.15);font-family:Consolas,monospace}
/* 2026-11-04：删掉 text-transform:uppercase —— 大键帽原来自动作大写，
   小写字母 a 显示成 A，课文里明明是小写学生却看到大写，大小写全乱。 */
.key-finger{font-size:13px;color:var(--ink2)}
/* 按键课敲错标注（2026-11-03）：没有输入框，红字挂在键帽下方；min-height 防跳动 */
.key-err{min-height:19px;font-size:13px;color:var(--bad);font-weight:600}
.key-err:empty{display:none}
.key-err .key-err-bad{color:var(--bad)}
.key-finger b{color:var(--brand)}
/* 输入台：输入框里实时回显「已经打出来的字」（金山打字通的上屏区）——
   打对的字留在框里不消失，打错自动截回，退格可整字回退。 */
/* 输入台（2026-11-02 第二轮：改成「与课文逐字同列」的上屏区）
   核心思路 —— 不去算坐标，而是让回显层复用课文的排版网格：
     ① 外框与 .text-line 同宽、同左右内边距（12px），内容区宽度完全一致；
     ② .tb-echo 照抄课文的字号 26px / 行高 30px / gap 2px 3px / 居中 / 换行规则；
     ③ 未输入的字用透明色占位（不是不渲染）—— 占位保住了宽度，第 i 个字
        才会稳稳落在课文第 i 个字的正下方，多行时换行位置也一模一样；
     ④ 真正的 <input> 绝对定位盖在上面、文字全透明，只负责接收输入法和光标，
        视觉完全交给回显层，两边不会互相打架。
   字少的时候不需要额外拉间距：占位符本来就把每个字放在课文对应的槽里，
   看起来自然是「词与词之间均匀分开、与上文字对齐」。 */
.typing-bar{margin-top:8px;flex:0 0 auto;display:flex;align-items:stretch;
  background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;
  transition:border-color .15s,box-shadow .15s}
.typing-bar:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(180,91,51,.12)}
.tb-field{position:relative;flex:1 1 auto;min-width:0}
/* 回显层：与课文同字号、同行高、同 gap —— 这几项是逐字对齐的全部前提 */
.tb-echo{display:flex;flex-wrap:wrap;gap:2px 3px;justify-content:center;
  align-content:flex-start;min-height:30px;
  font-size:26px;line-height:30px;font-weight:600;pointer-events:none}
.tb-echo .ch.o .hz{color:var(--brand)}
.tb-echo .ch.d .hz{color:transparent}
.tb-echo .ch.d .hz,.tb-echo .ch.o .hz{background:none;box-shadow:none}
.tb-echo .ch.sp.d{background:transparent;box-shadow:none}
.tb-echo .ch.sp.o{background:var(--cur-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 34%,transparent)}
/* 真输入框（2026-11-05 重写）：不再是铺满整个输入台的透明大框。
   以前它左对齐、回显层却居中，浏览器按 input 的 caret 放输入法候选框，
   搜狗候选框就跑到最左边，跟正在打的那个字差了半屏。现在把 input 缩成
   一个「浮动的小输入框」，由 placeTypingInput() 实时挪到第 idx 个字的格子上，
   系统输入法的候选框自然跟着 caret 落在正确位置。文字仍然全透明，
   视觉交给回显层；可见的闪烁光标由 .tb-caret 画在同一个格子里。 */
.tb-input{position:absolute;left:8px;top:4px;width:34px;height:32px;
  border:none;outline:none;background:transparent;padding:0;margin:0;
  font-size:26px;line-height:30px;font-family:inherit;letter-spacing:0;
  color:transparent;caret-color:transparent;overflow:hidden;white-space:pre;
  z-index:4}
.tb-input::placeholder{color:transparent}
/* 输入台里的闪烁光标：与浮动 input 同位置、同高度，属于「输入框内」 */
.tb-caret{position:absolute;z-index:5;width:2px;height:32px;border-radius:2px;
  background:var(--brand);animation:caretBlink 1.06s steps(1,end) infinite;
  pointer-events:none}
.tb-caret[hidden]{display:none}
/* 整篇文章（slim 输入台）：只显示本行已上屏的字，光标与候选框跟在它后面 */
.tb-mini{display:inline-block;max-width:calc(100% - 60px);overflow:hidden;
  text-overflow:ellipsis;white-space:pre;font-size:15px;line-height:24px;
  font-weight:600;color:var(--brand);vertical-align:middle}
/* 输入法组合中（2026-11-03 修复：拼音不再让 input 显形）
   旧做法是隐藏回显层、把真 input 的文字亮出来显示拼音 —— 但 input 是左对齐的，
   一组合整串「晋太元中，wu」就从框左边冒出来，和居中的课文完全对不上。
   现在：input 永远透明，回显层一直显示已上屏的字，组合中的拼音单独做成
   一个跟随的小标（.tb-comp），定位在「本轮要上屏的那个字」的格子里。 */
.tb-comp{position:absolute;z-index:6;padding:0 7px;height:24px;line-height:24px;
  font-size:16px;font-weight:600;color:var(--brand);background:var(--brand-soft);
  border:1px solid color-mix(in srgb,var(--brand) 36%,transparent);border-radius:7px;white-space:nowrap;
  pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.14)}
.tb-comp[hidden]{display:none}
/* 提示浮层：空态时在整个框内居中（多行课文时也不会贴在第一行） */
.tb-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:400;letter-spacing:0;color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tb-input:not(:placeholder-shown) + .tb-ph{display:none}
.tb-count{flex:none;font-size:12px;color:var(--ink3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* 进度条与字数同一行：字数从输入框里搬出来，输入框才能整宽参与对齐 */
.prog-row{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-top:8px}
.prog-row .progress-track{flex:1 1 auto;margin-top:0}
.progress-track{flex:0 0 auto;margin-top:8px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#D89A6E);transition:width .15s}

/* 键盘指法示意图 · 104 键全尺寸（主键区 + 导航簇 + 右侧数字小键盘）
   2026-11-02 三次调整：按标准 104 键重新排版。设计稿用固定像素
   （1u = 48px、键间隙 6、行距 52、主键区 15u / 导航 3u / 小键盘 4u），
   每个键 absolute 定位到 (col,row)，跨行键（+ 和 Enter）用 span 撑高；
   外层只做 transform:scale —— 键宽 / 键高 / 字号 / 圆角 / 间距同比例变化。 */
.kb-wrap{position:relative;flex:1 1 auto;min-height:150px;margin-top:6px;width:100%;overflow:hidden}
.kb{position:absolute;left:50%;top:50%;width:1115px;max-width:none;margin:0;
  transform:translate(-50%,-50%) scale(var(--kbs,1));transform-origin:center center;
  background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px;user-select:none}
.kb-board{position:relative;width:1092px;height:258px;padding-top:44px;display:flex;gap:18px}
/* 功能键行：单独一层绝对定位，和主键区之间留一道缝（真机也是分开的一组） */
.kb-frow{position:absolute;top:0;height:38px}
.kb-blk{position:relative;height:214px;flex:0 0 auto}
.kb-k{position:absolute;height:38px;background:var(--key);border:1px solid var(--key-bd);border-bottom-width:3px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  line-height:1;
  text-align:center;font-size:15px;font-weight:600;letter-spacing:.4px;color:var(--key-ink);padding:0;
  font-family:Consolas,Menlo,monospace;transition:transform .1s}
/* 功能键（Home / NumLk / Enter 等）字多，再缩一档 */
.kb-k.kb-sm{font-size:10.5px;letter-spacing:.1px;font-family:inherit}
/* 导航簇与小键盘的空位保持干净（不画键位底色） */
.kb-k i{position:absolute;top:2px;left:5px;font-size:9px;color:var(--ink3);font-style:normal;font-weight:600}
.kb-k.f-LP,.kb-k.f-RP{background:var(--f-lp);border-color:var(--f-lp-bd)}
.kb-k.f-LR,.kb-k.f-RR{background:var(--f-lr);border-color:var(--f-lr-bd)}
.kb-k.f-LM,.kb-k.f-RM{background:var(--f-lm);border-color:var(--f-lm-bd)}
.kb-k.f-LI{background:var(--f-li);border-color:var(--f-li-bd)}
.kb-k.f-RI{background:var(--f-ri);border-color:var(--f-ri-bd)}
.kb-k.f-TH{background:var(--f-th);border-color:var(--f-th-bd)}
.kb-k.hot{background:var(--cur-bg);border-color:var(--brand);color:var(--brand);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 32%,transparent);animation:kbpulse 1s ease infinite;z-index:1}
.kb-k.hotsh{background:var(--sun-bg);border-color:var(--warn);color:var(--sun-ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 35%,transparent)}
@keyframes kbpulse{50%{transform:translateY(1.5px)}}
/* 实际敲键瞬态高亮（2026-11-03）：任意按键按下，虚拟键盘上对应的键闪一下。
   .press 正常敲下（品牌橙、按下位移），.press-bad 敲错（红）；
   与常驻的 .hot「目标键」高亮互不干扰，100ms 后自动退场。
   2026-11-04 牛哥反馈：按下要立马响应、闪的时间缩短 ——
   键帽默认带 transform .1s 过渡，会拖慢第一帧，瞬态类一律关掉过渡。 */
.kb-k.press,.kb-k.press-bad{transition:none}
.kb-k.press{background:var(--cur-bg);border-color:var(--brand);color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 45%,transparent);
  transform:translateY(2px);z-index:2}
.kb-k.press-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--bad,#E24B4A) 38%,transparent);
  transform:translateY(2px);z-index:2}
/* 指法图：2026-11-02 四次调整 —— 从「圆角方块」改成「圆形徽章 + 手指剪影」：
   ① 每根手指一个白底彩边圆，圆内是一只竖着的手指（指尖圆、指节有折痕），
      圆比方块更贴近"手指落键"的意象，也顺手把十根手指拉成同一节拍；
   ② 名字与键位串排在圆下方，各留 15px / 27px 的基线，行高固定，绝不压字；
   ③ 高亮时圆填色、手指变白、下方名字染成手指色 —— 一眼知道该抬哪根。 */
.hands{flex:0 0 auto;width:100%;max-width:780px;margin:5px auto 0;background:var(--paper);
  border:1.2px solid var(--line);border-radius:12px;padding:6px 8px 4px;user-select:none}
.hands svg{width:100%;height:auto;display:block}
/* 左右手底衬：当前要动的那只手整块微微提亮，一眼知道该抬哪边 */
.hzone{fill:transparent;transition:fill .18s ease}
.hzone.on{fill:var(--zone-on)}
.finger .fcircle{fill:var(--surface);stroke:var(--c,#ccc);stroke-width:2.2;transition:fill .16s,stroke .16s}
/* 高亮环：跟着当前手指一圈圈扩散，比单纯改颜色更容易在余光里捕捉到 */
.finger .fring{fill:none;stroke:var(--c,#ccc);stroke-width:2;opacity:0}
.finger.active .fring{opacity:.95;stroke-width:3.5;animation:fring .9s ease-out infinite}
@keyframes fring{
  0%{r:19;opacity:.8}
  70%{r:28;opacity:0}
  100%{r:28;opacity:0}
}
/* 指纹纹路（2026-11-02 替换手指剪影）：
   原来圆里画一根带指甲的手指，本意是"用这根手指"，但学生第一眼
   容易读成"点这个按钮"的手指指示，反而误解。指纹图标没有歧义 ——
   它就是手机上解锁时按的那个图案，一眼知道"该用哪根手指去碰键"。 */
.finger .fp{fill:none;stroke:var(--c,#ccc);stroke-width:2.15;stroke-linecap:round;
  stroke-linejoin:round;transition:stroke .16s,stroke-opacity .16s}
.finger .fp.dim{stroke-opacity:.42;stroke-width:1.75}
/* 2026-11-03 牛哥要求：高亮必须「原位置」，不许移动图标 ——
   原来这里带 translateY(-5px) scale(1.07) 的「抬起」动效，
   抬起来的圆会跟旁边图标挤到一起，看着错位。现在只靠
   填色 + 扩散环表达「就是这根」，位置一个像素都不动。
   2026-11-04 再加强（高亮不够醒目）：描边加粗、指色光晕、
   印记线条加粗 —— 不动位置，只加对比。 */
.finger.active .fcircle{fill:var(--c,#ccc);stroke:var(--surface);stroke-width:3.4;
  filter:drop-shadow(0 0 6px var(--c,#ccc)) drop-shadow(0 5px 8px rgba(0,0,0,.30))}
.finger.active .fp{stroke:var(--surface);stroke-width:2.6}
.finger.active .fp.dim{stroke-opacity:.72}
/* 敲对了 / 敲错了：按下瞬间给一根手指染色（0.26s 后退回），
   这样"我这一下用的是哪根手指"和"应该用哪根"能同时对得上。
   （原 miss 的左右抖动动画已删：同样是位移，一并按「原位置」原则去掉） */
.finger.hit .fcircle{fill:var(--ok);stroke:var(--surface)}
.finger.hit .fp{stroke:var(--surface)}
.finger.miss .fcircle{fill:var(--bad);stroke:var(--surface)}
.finger.miss .fp{stroke:var(--surface)}
/* 要按住 Shift 时，另一只手的对应小指用虚线描边提示"辅助键在这边" */
.finger.aux .fcircle{stroke-dasharray:3.4 2.6;stroke-width:2.6}
.finger.aux .fn{fill:var(--c);font-weight:900}
/* 文字：没轮到的手指名字调暗（2026-11-04：对比出「就是这根」），
   轮到的染成手指色，一眼锁定 */
.finger .fn{font-size:12.5px;font-weight:800;fill:var(--ink);opacity:.55;transition:fill .16s,opacity .16s;
  paint-order:stroke;stroke:var(--paper);stroke-width:2.6px;stroke-linejoin:round}
.finger.active .fn{fill:var(--c);opacity:1}
.finger .fk{font-size:9.5px;font-weight:700;fill:var(--ink2);opacity:.6;font-family:Consolas,Menlo,monospace;
  letter-spacing:-.2px;transition:fill .16s,opacity .16s;paint-order:stroke;stroke:var(--paper);stroke-width:2.4px;stroke-linejoin:round}
.finger .fk.s{font-size:8.5px}
.finger.active .fk{fill:var(--ink);opacity:1}

.result{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 34px;width:min(460px,94vw);text-align:center;

.result .r-stars .on:nth-child(3){animation-delay:.36s}

/* 结算界面键盘操作（2026-11-05）：↑↓ 切换选中项，↵ 确认（默认就是下一关），

/* 排行榜 */
.lb-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-top:14px}

/* 牧场 */
.ranch-grid{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}
@media (max-width:900px){.ranch-grid{grid-template-columns:1fr}}
.ranch-side{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center}
/* 展示台：径向暖光打底 + 内阴影造出"台面凹进去"的体积，宠物才像站在台上而不是贴在纸上 */
.ranch-side .stage-box{position:relative;border-radius:20px;padding:10px 10px 4px;margin-bottom:14px;
  overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(118% 92% at 50% 6%,#FFFAF1 0%,#FBE9D7 46%,#F1D9C4 100%);
  box-shadow:inset 0 2px 7px rgba(176,118,68,.17),inset 0 -3px 9px rgba(255,255,255,.8),
             0 6px 18px rgba(150,95,50,.10);
  transition:transform .22s ease,box-shadow .22s ease}
.ranch-side .stage-box:hover{transform:translateY(-2px);
  box-shadow:inset 0 2px 7px rgba(176,118,68,.15),inset 0 -3px 9px rgba(255,255,255,.85),
             0 12px 26px rgba(150,95,50,.16)}
.ranch-side .stage-box:active{transform:translateY(0) scale(.994)}
/* 顶光：让宠物头顶有一圈更亮的光晕，暗示"聚光灯" */
.stage-glow{position:absolute;left:50%;top:6%;width:86%;height:66%;transform:translateX(-50%);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(52% 52% at 50% 34%,rgba(255,250,232,.95),rgba(255,240,214,0) 74%)}
/* 台面反光：底部一道柔和高光，强化"平面 vs 立面"的转折 */
.ranch-side .stage-box::after{content:'';position:absolute;left:12%;right:12%;bottom:2px;height:22px;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,255,255,.85),rgba(255,255,255,0) 78%)}
.stage-pet{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;min-height:170px}
.stage-pet svg{width:166px;height:166px;display:block;
  filter:drop-shadow(0 5px 6px rgba(140,88,48,.16));
  animation:p3FadeIn .24s ease-out}
.stage-box.swapin .stage-pet svg{animation:p3PopIn .44s cubic-bezier(.34,1.56,.64,1)}
.stage-box.shake{animation:stageShake .4s ease}
.stage-empty{font-size:56px;line-height:150px;color:#D8CFC5}
.stage-nav{position:absolute;top:46%;transform:translateY(-50%);width:30px;height:30px;z-index:2;
  border-radius:50%;border:1px solid rgba(180,120,70,.24);background:rgba(255,255,255,.9);
  color:#8A6242;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 2px 7px rgba(150,95,50,.18);transition:transform .16s ease,background .16s ease}
.stage-nav:hover{background:#fff;transform:translateY(-50%) scale(1.1)}
.stage-nav.prev{left:5px}
.stage-nav.next{right:5px}
/* ---- 出战特效（2026-11-05 经济系统）：纯 CSS 粒子动画，零外部资源 ----
   .stage-fx 铺满舞台一层，粒子由 JS 按当前特效注入（fxLayer），
   光环 / 极光两类用 ::before 就够，不用粒子。 */
.stage-fx{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;border-radius:inherit}
.stage-fx .p{position:absolute;opacity:0;will-change:transform,opacity}
.fx-sparkle .p{font-size:14px;animation:fxTwinkle 2.4s ease-in-out infinite}
.fx-bubbles .p{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(140,200,255,.85);
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(170,215,255,.32) 62%,rgba(150,200,255,.06));
  animation:fxBubble 4.2s ease-in infinite}
.fx-hearts .p{font-size:14px;animation:fxHeart 3.6s ease-in-out infinite}
.fx-snow .p{font-size:12px;animation:fxSnow 5.2s linear infinite}
.fx-rainbow::before{content:'';position:absolute;left:50%;top:14px;width:132px;height:40px;transform:translateX(-50%);
  border-radius:50%;background:conic-gradient(#FF6B6B,#FFB35C,#FFE066,#7BE382,#5CC9FF,#B28DFF,#FF6B6B);
  filter:blur(4px) saturate(1.2);opacity:.8;animation:fxHue 3.4s linear infinite}
.fx-aurora::before{content:'';position:absolute;inset:-24%;opacity:.55;filter:blur(22px);
  background:linear-gradient(115deg,#63E6BE 0%,transparent 34%,#7FA7FF 55%,transparent 72%,#B78CFF 100%);
  background-size:220% 100%;animation:fxAurora 8s ease-in-out infinite alternate}
@keyframes fxTwinkle{0%,100%{opacity:0;transform:scale(.5)}45%,60%{opacity:1;transform:scale(1)}}
@keyframes fxBubble{0%{opacity:0;transform:translateY(14px) scale(.6)}18%{opacity:.95}
  100%{opacity:0;transform:translateY(-120px) scale(1.06)}}
@keyframes fxHeart{0%{opacity:0;transform:translateY(6px) scale(.6)}25%{opacity:.95}
  60%{opacity:.85;transform:translateY(-46px) scale(1) rotate(14deg)}
  100%{opacity:0;transform:translateY(-92px) scale(.8) rotate(-10deg)}}
@keyframes fxSnow{0%{opacity:0;transform:translateY(-10px)}12%{opacity:.95}
  100%{opacity:.2;transform:translateY(150px)}}
@keyframes fxHue{0%{filter:blur(4px) saturate(1.2) hue-rotate(0)}
  100%{filter:blur(4px) saturate(1.2) hue-rotate(360deg)}}
@keyframes fxAurora{0%{background-position:0% 0}100%{background-position:100% 0}}
/* 背景商店预览小图 + 卡片选中态 */
.bg-prev{height:56px;border-radius:10px;border:1px solid rgba(200,160,120,.25);margin-bottom:8px}

  62%{opacity:1;transform:scale(1.07) translateY(-3px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes stageShake{0%,100%{transform:translateX(0)}22%{transform:translateX(-4px)}70%{transform:translateX(4px)}}

@keyframes wiggle{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-2px)}}
.pet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pet-card{position:relative;width:100%;text-align:center;border-radius:18px;padding:8px 8px 11px;

  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.pet-card:hover{transform:translateY(-3px);
  box-shadow:0 10px 20px rgba(150,95,50,.16),inset 0 1px 0 #fff}
.pet-card.on{border-color:#E8A24E;
  background:linear-gradient(170deg,#FFFDF6,#FFEFDA);
  box-shadow:0 0 0 2px rgba(232,162,78,.22),0 10px 22px rgba(200,140,70,.20),inset 0 1px 0 #fff}
.pet-card.lock{opacity:.55;background:linear-gradient(170deg,#FCFAF6,#F6F0E8)}
/* 卡片里的小展台：一圈暖光托住宠物，和牧场大图是同一套语言 */
.pet-stage{display:flex;justify-content:center;align-items:flex-end;height:104px;border-radius:14px;
  background:radial-gradient(64% 54% at 50% 76%,#FFF7E9 0%,rgba(255,247,233,0) 74%)}

/* ================= 2026-11-02 排版强化：非练习页统一放大 =================
   背景：机房学生机 1080p、坐距一两米，原来 11~15px 的字看着吃力，
   而且地图一排挤 7 张卡片，10 关排成 7+3，右上角空一大片。
   做法：
     1) 所有规则都带 #app / #view 前缀提高特异性，只作用于「地图 / 排行榜 /
        牧场 / 文章库」这几个页面，练习页（.play-*、键盘、指法图）一条不碰；
     2) 字号整体上调约 2~4px，标题 19~22px、正文 14~16.5px、辅助 13~14.5px；
     3) 图标同步放大：阶段 chip 21px、文章图标 28px、部位图标 17px、道具图标 22px；
     4) 减少空白：关卡由 7 列改 5 列（10 关正好两行铺满），卡片固定最小高度，
        排行榜行高与头像放大，衣柜/商店卡片同步加高，页面不再上挤下空；
     5) 窄屏（1000 / 760 / 520）逐级回退，保证小屏不挤、不横向滚动。 */

/* ---------- 按视口高度铺开（仅非练习页） ----------
   地图内容本来只有两行卡片，1080p 屏下面会空出三四百像素。
   这里让 #app 变成撑满一屏的弹性列：关卡网格吃掉剩余高度，
   两行卡片等比长高（封顶 500px，避免超宽屏上卡片变成大空块），
   页脚自然落到屏幕底部。练习页不挂 .ui-big，完全不受影响。 */
#app.ui-big{display:flex;flex-direction:column;min-height:100vh}
#app.ui-big #view{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#app.ui-big .map-page{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#app.ui-big #view .level-grid{flex:1 1 auto;grid-auto-rows:minmax(150px,1fr);min-height:0;
  max-height:min(56vh,500px)}
#app.ui-big .credit{margin-top:auto;padding-top:16px}

/* ---------- 牧场：独立滚动容器（2026-11-05） ----------
   以前 #view 跟着整页一起滚：牧场右边一长串「背景 / 特效 / 衣柜 / 商店」，
   往下翻到商店时左边的宠物详情早就滚出屏幕了，想换宠物还得先滚回顶上。
   现在把 #view 变成自己的滚动容器：高度 = 视口 - 吸顶区 - 页脚（JS 算），
   内部单独滑动，顶栏和页签始终不动，任何屏高下都看得到、点得到。
   overscroll-behavior:contain 防止滑到头时把整页一起带着滚。 */
#app.ui-big #view.view-scroll{
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-gutter:stable;padding-right:4px;
}
#view.view-scroll::-webkit-scrollbar{width:8px}
#view.view-scroll::-webkit-scrollbar-track{background:transparent}
#view.view-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
#view.view-scroll::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
/* 滚动容器里侧栏的 sticky 基准变成容器本身，间距按容器补 */
#view.view-scroll .ranch-side{top:0}

     现在标题行要吸顶，那等于半屏都被它占着 —— 折开以后约 120px。 */

<body>
<div id="app"><div style="text-align:center;padding:80px 0;color:var(--ink3)">正在登上打字冒险岛…</div></div>
<script src="/student/ui-dialog.js?v=20261102"></script>
<script src="/typing/pinyin.js?v=20261102w"></script>
<script src="/typing/typing-data.js?v=20261105a"></script>
<script src="/typing/articles.js?v=20261103a"></script>
<script src="/typing/levels.js?v=20261102x"></script>
<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var app = $('#app');
var S = {
  role: null, demo: false, me: null, progress: null, config: { enabled: false, grades: [] },
  view: 'map', map: { stage: 1, chapter: 1 }, play: null,
  lb: { scope: 'week', rows: [], class_name: '' },
  ranch: { pet: '', decos: [], bg: '', fx: '' },
  /* 文章阅读（2026-11-05 三次定版）：
       art.cat  当前选的类别（'' = 全部），关卡按该类别「字数由短到长」分配；
       art.type 文章库里切到的分类 tab（只影响浏览，不参与选关）；
       art.id   老的单篇锁定，仅用于兼容旧 localStorage，不再由界面设置。 */
  art: { id: '', type: 'all', cat: '' },
  shop: false,
  eggOpening: false
};
/* 文章选择不涉及成绩，存本机即可（换机器会回到默认，不影响进度） */
function readArtId() {
  try { return localStorage.getItem('wb-typing-art') || ''; } catch (e) { return ''; }
}
function saveArtId(id) {
  try { localStorage.setItem('wb-typing-art', id || ''); } catch (e) {}
}
/* 类别选择：2.0.23 起学生选的是"哪一类"，不是"哪一篇" */
function readArtCat() {
  try { return localStorage.getItem('wb-typing-cat') || ''; } catch (e) { return ''; }
}
function saveArtCat(c) {
  try { localStorage.setItem('wb-typing-cat', c || ''); } catch (e) {}
}

/* ---------------- 基础 ---------------- */
/* 主题：与主站共用 wb-smode。'light' / 'dark'，缺省浅色（与主站一致，
   不跟系统 —— 机房系统开深色时学生端不该整页变暗）。 */
var MODE_KEY = 'wb-smode';
function themeIsDark() {
  try { return localStorage.getItem(MODE_KEY) === 'dark'; } catch (e) { return false; }
}
function applyTheme() {
  var dark = themeIsDark();
  document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
  var mb = document.getElementById('modeBtn');
  if (mb) {
    mb.textContent = dark ? '☀' : '🌙';
    mb.title = dark ? '切回浅色' : '切到夜间';
  }
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#191210' : '#B45B33');
}
function toggleTheme() {
  try { localStorage.setItem(MODE_KEY, themeIsDark() ? 'light' : 'dark'); } catch (e) {}
  applyTheme();
}
/* 学生端里切了主题，打字页开着的时候也跟着变（同一 origin 的 storage 事件） */
window.addEventListener('storage', function (e) {
  if (!e || !e.key || e.key === MODE_KEY) applyTheme();
});

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function api(url, opts) {
  return fetch(url, Object.assign({ credentials: 'same-origin' }, opts || {}))
    .then(function (r) { return r.json().catch(function () { return {}; }); });
}
function starsHtml(n) {
  var out = '';
  for (var i = 1; i <= 3; i++) out += '<span class="' + (i <= n ? 'on' : 'off') + '">★</span>';
  return out;
}
function fmtSpeed(v, mode) { return (Math.round(v * 10) / 10) + (mode === 'cn' ? ' 字/分' : ' KPM'); }
/* 全站统一弹窗（app/student/ui-dialog.js）：提示 / 确认 / 警告 / 吐司
   都在这里转发，组件没加载成功时退回原生 alert，保证提示不丢。 */
function uiAlert(o) {
  if (window.WBUI && WBUI.alert) return WBUI.alert(o);
  try { alert(typeof o === 'string' ? o : ((o && (o.title ? o.title + '：' : '') + o.message) || '')); } catch (e) {}
}
function uiConfirm(o) {
  if (window.WBUI && WBUI.confirm) return WBUI.confirm(o);
  var ok = false;
  try { ok = confirm(typeof o === 'string' ? o : ((o && ((o.title ? o.title + '\n' : '') + (o.message || ''))) || '')); } catch (e) {}
  return Promise.resolve(ok);
}
function uiToast(msg, tone) {
  if (window.WBUI && WBUI.toast) return WBUI.toast(msg, tone);
}

/* ---------------- 演示数据 ---------------- */
var DEMO = {
  me: { id: 'demo', name: '演示同学', class_id: '0', class_name: '三年(1)班' },
  progress: {
    stars: 26, week_stars: 12, pts: 300, eggs: 1,
    pets: ['cat', 'dog'], decos: ['hat-red', 'crown', 'sunglass'],
    bgs: ['meadow'], effects: [],
    equip: { pet: 'cat', decos: ['hat-red'], bg: 'meadow', fx: '' },
    best: { 's1c1l1': { stars: 3, wpm: 34 }, 's1c1l2': { stars: 3, wpm: 31 }, 's1c1l3': { stars: 2, wpm: 27 },
            's1c1l4': { stars: 2, wpm: 26 }, 's1c1l5': { stars: 3, wpm: 36 }, 's1c1l6': { stars: 1, wpm: 22 },
            's1c1l7': { stars: 2, wpm: 28 }, 's1c1l8': { stars: 2, wpm: 29 }, 's1c1l9': { stars: 1, wpm: 24 },
            's1c1l10': { stars: 2, wpm: 27 }, 's2c1l1': { stars: 3, wpm: 41 }, 's2c1l2': { stars: 2, wpm: 36 } }
  },
  lb: [
    { name: '李晓明', value: 18, pet: 'dog', decos: ['crown'] },
    { name: '王小虎', value: 15, pet: 'dino', decos: [] },
    { name: '张思思', value: 13, pet: 'unicorn', decos: ['bow'] },
    { name: '陈快乐', value: 9, pet: '', decos: [] },
    { name: '演示同学', value: 12, pet: 'cat', decos: ['hat-red'], me: true }
  ]
};
var DEMO_LB_NAMES = ['李晓明','王小虎','张思思','陈快乐','刘一一','赵小满','孙齐齐','周多多'];

/* ---------------- 启动 ---------------- */
function boot() {
  var qs = new URLSearchParams(location.search);
  /* 2.0.23：学生选的是「类别」不是「单篇」。
     老版本把单篇 id 存在 wb-typing-art 里，这里迁移成它所属的类别后清掉旧键，
     否则老用户会一直停在某一篇的旧状态。 */
  S.art.cat = readArtCat();
  (function migrateOldArt() {
    var oldId = readArtId();
    if (!oldId) return;
    if (!S.art.cat && window.TA && TA.get) {
      var a0 = TA.get(oldId);
      if (a0 && a0.type) { S.art.cat = a0.type; saveArtCat(a0.type); }
    }
    saveArtId('');
  })();
  /* 学生端框架内嵌模式：收窄边距，视觉上融入外层页面 */
  if (qs.get('embed') === '1') document.body.classList.add('embed');
  api('/api/v2/typing/config').then(function (cfg) {
    if (cfg && cfg.ok) S.config = { enabled: !!cfg.enabled, grades: cfg.grades || [] };
    return api('/api/v2/typing/me');
  }).then(function (me) {
    if (me && me.ok) {
      S.role = 'student'; S.demo = false;
      S.me = me.me; S.progress = me.progress; S.config = me.config || S.config;
      if (!S.progress.equip) S.progress.equip = { pet: '', decos: [] };
      S.ranch = ranchFromEquip(S.progress.equip);
      startSyncLoop();
    } else {
      S.demo = true;
      S.me = DEMO.me; S.progress = JSON.parse(JSON.stringify(DEMO.progress));
      try {
        var saved = localStorage.getItem('wb-typing-demo');
        if (saved) { var p = JSON.parse(saved); if (p && p.best) S.progress = p; }
      } catch (e) {}
      S.ranch = ranchFromEquip(S.progress.equip);
      if (me && me.role === 'teacher') {
        /* 教师练习模式（2026-11-03）：老师用同一张地图练手，
           成绩默认只存本机；想跟学生比，可在页顶开关「计入班级排行榜」。
           开关与班级选择记在本机，下次打开保持。 */
        S.role = 'teacher';
        try {
          var tlb = JSON.parse(localStorage.getItem('wb-typing-teacher-lb') || '{}');
          S.teacherLb = { on: !!tlb.on, class_id: tlb.class_id || '' };
        } catch (e) { S.teacherLb = { on: false, class_id: '' }; }
        api('/api/v2/typing/overview').then(function (ov) {
          if (ov && ov.ok) {
            S.teacherClasses = ov.classes || [];
            if (S.teacherClasses.length && !S.teacherLb.class_id) {
              S.teacherLb.class_id = S.teacherClasses[0].id;
            }
            /* 折叠摘要里「成绩计入：某班」的班名也要跟下班级列表 */
            twBarSync();
            /* 教师条已渲染，开关班级下拉补数据 */
            var sel = $('#twCls');
            if (sel) {
              sel.innerHTML = S.teacherClasses.map(function (c) {
                return '<option value="' + esc(c.id) + '"' +
                  (c.id === S.teacherLb.class_id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
              }).join('') || '<option>（暂无班级）</option>';
              sel.disabled = !S.teacherLb.on;
            }
          }
        }).catch(function () {});
      }
    }
    var sc = qs.get('screen');
    if (sc && ['map', 'lb', 'ranch'].indexOf(sc) >= 0) S.view = sc;
    if (qs.get('screen') === 'play' || qs.get('play') === '1') {
      var st = parseInt(qs.get('stage') || '1', 10);
      var ch = parseInt(qs.get('chapter') || '1', 10);
      var lv = parseInt(qs.get('level') || '2', 10);
      startLevel(st, ch, lv);
      return;
    }
    render();
  }).catch(function () {
    S.demo = true; S.me = DEMO.me; S.progress = JSON.parse(JSON.stringify(DEMO.progress));
    render();
  });
}
function demoSave() {
  if (!S.demo) return;
  try { localStorage.setItem('wb-typing-demo', JSON.stringify(S.progress)); } catch (e) {}
}

/* ---------------- 解锁规则 ---------------- */
function passed(st, ch, lv) {
  var b = (S.progress.best || {})['s' + st + 'c' + ch + 'l' + lv];
  return b && b.stars >= 1;
}
function passedCount(st, ch) {
  var n = 0;
  for (var i = 1; i <= 10; i++) if (passed(st, ch, i)) n++;
  return n;
}
function chapterOpen(st, ch) { return ch === 1 || passedCount(st, ch - 1) >= 8; }
function levelOpen(st, ch, lv) {
  if (!chapterOpen(st, ch)) return false;
  return lv === 1 || passed(st, ch, lv - 1);
}
function maxChapter(st) {
  var ch = 1;
  while (chapterOpen(st, ch + 1) && ch < 200) ch++;
  return ch;
}

/* 从服务端 equip 恢复牧场本地状态（宠物 / 装扮 / 背景 / 特效，2026-11-05）：
   旧档案 equip 里没有 bg/fx 字段，这里统一兜底成 ''。 */
function ranchFromEquip(equip) {
  var e = equip || {};
  return { pet: e.pet || '', decos: e.decos || [], bg: e.bg || '', fx: e.fx || '' };
}

/** 顶栏头像的悬停说明：一眼看清「这是哪个伙伴 + 什么背景 + 什么特效」 */
function petTitleText() {
  var bits = [];
  var p = S.ranch.pet ? TD.petById(S.ranch.pet) : null;
  bits.push(p ? '出战宠物：' + p.name : '还没有出战宠物');
  var bg = S.ranch.bg ? TD.bgById(S.ranch.bg) : null;
  if (bg && bg.id) bits.push('背景：' + bg.name);
  var fx = S.ranch.fx ? TD.effectById(S.ranch.fx) : null;
  if (fx) bits.push('特效：' + fx.name);
  return bits.join(' · ');
}

/* ---------------- 统一积分 · 顶栏实时显示 ----------------
   整个应用只有 pts 一种数值：闯关获得、商店消费、老师发放都走它。
   顶栏（.stick-top，本来就吸顶）右上角常驻一枚 chip；练习页没有顶栏，
   练习条的 .live 里放同一枚 chip。两者都用 data-pts-val 标记，
   refreshPts() 只改数字、绝不整页重绘（练习中重绘会丢掉正在打的关卡）。 */
function ptsChipHtml() {
  return '<span class="chip b pts-live" title="当前积分 · 闯关获得，全店通用">' +
    '✨ <b data-pts-val>' + ((S.progress && S.progress.pts) || 0) + '</b> 积分</span>';
}
function refreshPts() {
  var v = (S.progress && S.progress.pts) || 0;
  var nodes = document.querySelectorAll('[data-pts-val]');
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].textContent === String(v)) continue;
    nodes[i].textContent = v;
    var chip = nodes[i].parentNode;
    if (chip && chip.classList) {
      chip.classList.remove('pts-bump');
      void chip.offsetWidth;           /* 强制回流，让动画能连续触发 */
      chip.classList.add('pts-bump');
    }
  }
}

/* ---------------- 渲染框架 ---------------- */
function render() {
  var st = TD.titleFor(S.progress.stars || 0);
  /* 顶栏头像跟牧场同源：背景 + 特效 + 装扮一起带出来（2026-11-05） */

    '<div class="stick-top">' +

          (S.progress.eggs ? '<span class="chip b">🥚 ×' + S.progress.eggs + '</span>' : '') +

          petMini +

            + (themeIsDark() ? '☀' : '🌙') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
      /* ↑ .stick-top 到此结束：只有标题行吸顶。
         演示条 / 教师练习条 / 页签以下都在容器外，随页面正常滚动。 */
      (S.demo && S.role !== 'teacher'
        ? '<div class="demo-bar">🎬 演示模式：当前未登录，展示的是示例数据，成绩只存在本机。' +
          '学生登录后进入这里，成绩会真实记录并上榜。</div>' : '') +
      (S.demo && S.role === 'teacher'
        ? '<div class="demo-bar teacher-bar' + (twBarOpen() ? ' is-open' : '') + '" id="twBar">'
          /* 折叠摘要（默认）：一行说清「现在算不算成绩」，展开才占大块空间 */
          + '<div class="tw-sum">👩‍🏫 <b>教师练习模式</b>'
          + '<span class="tw-state">' + twBarState() + '</span>'
          + '<button class="tw-toggle" type="button">展开设置 ▾</button></div>'
          /* 展开全文：原来的开关 + 班级下拉 + 说明，外加一个「收起」 */
          + '<div class="tw-full">👩‍🏫 <b>教师练习模式</b>：和学生同一张冒险地图，成绩默认只存本机。'
          + '<label class="tw-lb"><input type="checkbox" id="twLb"' + (S.teacherLb && S.teacherLb.on ? ' checked' : '') + '>'
          + '把我的成绩计入</label>'
          /* 班级下拉：从 S.teacherClasses 现取现拼（2026-11-04 修复）。
             以前写死「加载中…」占位，只有 boot 时 overview 回来那一刻才补数据——
             切一次标签页 render() 重画就永远停在「加载中…」，班级列表识别不到。 */
          + '<select id="twCls"' + (S.teacherLb && S.teacherLb.on ? '' : ' disabled') + '>'
          + ((S.teacherClasses && S.teacherClasses.length)
            ? S.teacherClasses.map(function (c) {
                return '<option value="' + esc(c.id) + '"' +
                  (c.id === S.teacherLb.class_id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
              }).join('')
            : '<option>加载中…</option>')
          + '</select>'
          + '<span class="tw-tip">班级排行榜（选班后生效）</span>'
          + '<button class="tw-toggle" type="button">收起 ▴</button></div>'
          + '</div>' : '') +
      (enrolled
        ? '<div class="tabs">' +
            tabBtn('map', '🗺 冒险地图') + tabBtn('lb', '🏆 排行榜') + tabBtn('ranch', '🐾 宠物牧场') +
          '</div>'
        : '') +
    (enrolled ? '' :
      '<div class="off-bar"><div class="big">🚧</div><h2>老师还没开放打字练习</h2>' +
        '<p>等老师在教师端打开开关，这里就会变成打字冒险岛。<br>先回「今日」页看看别的任务吧。</p></div>') +
    (enrolled ? '<div id="view"></div>' : '') +
    '<span class="credit">打字冒险岛 · 班级工作台 2.0 · 牛老师设计</span>';
  app.classList.add('ui-big');   /* 非练习页：内容按视口高度铺开，减少底部空白 */
  app.innerHTML = html;
  refreshPts();                  /* 顶栏积分：数值变动立即刷新，不整页重绘 */
  applyTheme();                  /* 顶栏主题钮的图标 / theme-color 跟着当前主题走 */
  var v = $('#view');
  if (!v) return;
  /* 牧场用独立滚动容器（2026-11-05）：内容比一屏长得多，跟着整页滚会把
     左边宠物详情顶出屏幕。先定 class 再塞内容，最后按当前视口算高度。 */
  var scrollable = (S.view === 'ranch');
  v.classList.toggle('view-scroll', scrollable);
  if (S.view === 'map') v.innerHTML = viewMap();
  else if (S.view === 'lb') { v.innerHTML = viewLb(); loadLb(); }
  else v.innerHTML = viewRanch();
  bindView();
  if (scrollable) { v.scrollTop = 0; fitViewScroll(); }
}

/* 牧场滚动容器的高度：视口 - 吸顶区 - 页脚 - 上下内边距。
   切页签、缩放窗口、手机转屏都要重算（resize 只绑一次，见文件末尾）。

   2026-11-05：吸顶区只剩标题行，页签不再算在吸顶高度里，所以不能再用
   「innerHeight - stickTop.offsetHeight」拍脑袋减 —— 那样会把页签那 40px
   漏掉，容器比可视区高、整页跟着多出一条滚动条。
   改成按 #view 自己到视口的实际距离算：页面没滚动时取它在文档里的位置，
   已经滚过吸顶区时按「吸顶卡片下沿」算，两种情况都不会溢出。 */
function fitViewScroll() {
  var v = document.getElementById('view');
  if (!v || !v.classList.contains('view-scroll')) return;
  var st = document.querySelector('.stick-top');
  var stickH = st ? st.offsetHeight : 0;
  var credit = document.querySelector('.credit');
  var foot = credit ? credit.offsetHeight + 18 : 0;
  var sy = window.scrollY || document.documentElement.scrollTop || 0;
  var docTop = v.getBoundingClientRect().top + sy;   /* #view 在文档中的位置 */
  /* 已经往下滚了的话，可用的上边界是吸顶卡片下沿（含 6px 呼吸位） */
  var visibleTop = Math.max(docTop, sy + stickH + 6);
  var h = window.innerHeight - (visibleTop - sy) - foot - 12;
  v.style.maxHeight = Math.max(220, Math.round(h)) + 'px';
}
/* 窗口变化会让回显层换行位置改变，浮动输入框 / 光标 / 候选框要跟着重算 */
window.addEventListener('resize', function () { fitViewScroll(); placeTypingInput(); });
function tabBtn(id, name) {
  return '<button class="' + (S.view === id ? 'on' : '') + '" data-tab="' + id + '">' + name + '</button>';
}
function bindView() {
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.onclick = function () { S.view = b.getAttribute('data-tab'); render(); };
  });
  /* 顶栏主题钮：切完只改 CSS 变量，不需要重绘整个页面 */
  var mb = document.getElementById('modeBtn');
  if (mb) mb.onclick = toggleTheme;
  document.querySelectorAll('[data-lv]').forEach(function (b) {
    b.onclick = function () {
      var p = b.getAttribute('data-lv').split(',');
      if (b.classList.contains('lock')) return;
      try {
        startLevel(+p[0], +p[1], +p[2]);
      } catch (err) {
        uiAlert({ title: '关卡打不开', tone: 'err', message: '这一关加载出错了，刷新页面再试一次。\n如果还是不行，请截图告诉老师。' });
      }
    };
  });
  document.querySelectorAll('[data-chap]').forEach(function (b) {
    b.onclick = function () {
      S.map.chapter = +b.getAttribute('data-chap');
      render();
    };
  });
  document.querySelectorAll('[data-stage]').forEach(function (b) {
    b.onclick = function () {
      S.map.stage = +b.getAttribute('data-stage');
      S.map.chapter = 1;
      render();
    };
  });
  var ao = $('#artOpen');
  if (ao) ao.onclick = openArtLib;
  bindLb();
  bindRanch();
  bindTeacherBar();
}

/* 教师练习条的开关与班级选择（2026-11-03）：
   记在 localStorage['wb-typing-teacher-lb']，成绩提交时按它决定是否上报。
   2026-11-05 起整条默认折叠（localStorage['wb-typing-teacher-bar'] 记展开状态），
   吸顶区不再常年占一大条；折叠摘要实时显示「成绩算不算」。 */
function twBarOpen() {
  try { return !!(JSON.parse(localStorage.getItem('wb-typing-teacher-bar') || '{}').open); }
  catch (e) { return false; }
}
function twBarState() {
  var lb = S.teacherLb || {};
  if (!lb.on) return '成绩只存本机，不计入班级榜';
  var cls = (S.teacherClasses || []).filter(function (c) { return String(c.id) === String(lb.class_id); })[0];
  return '成绩计入：' + (cls ? cls.name : '所选班级');
}
function twBarSave(open) {
  try { localStorage.setItem('wb-typing-teacher-bar', JSON.stringify({ open: !!open })); } catch (e) {}
}
function twBarSync() {
  var st = document.querySelector('#twBar .tw-state');
  if (st) st.textContent = twBarState();
}
function bindTeacherBar() {
  var bar = document.getElementById('twBar');
  if (bar) {
    bar.querySelectorAll('.tw-toggle').forEach(function (btn) {
      btn.onclick = function () {
        var open = !bar.classList.contains('is-open');
        bar.classList.toggle('is-open', open);
        twBarSave(open);
        twBarSync();
        fitViewScroll();        /* 吸顶区高度变了，牧场容器要跟着重算 */
      };
    });
  }
  var cb = $('#twLb'), sel = $('#twCls');
  if (!cb && !sel) return;
  if (cb) cb.onchange = function () {
    S.teacherLb = S.teacherLb || { on: false, class_id: '' };
    S.teacherLb.on = cb.checked;
    if (sel) sel.disabled = !cb.checked;
    try { localStorage.setItem('wb-typing-teacher-lb', JSON.stringify(S.teacherLb)); } catch (e) {}
    twBarSync();
    uiToast(cb.checked ? '好，下次通关会把成绩计入所选班级的排行榜' : '成绩恢复为只存本机');
  };
  if (sel) sel.onchange = function () {
    S.teacherLb = S.teacherLb || { on: false, class_id: '' };
    S.teacherLb.class_id = sel.value;
    try { localStorage.setItem('wb-typing-teacher-lb', JSON.stringify(S.teacherLb)); } catch (e) {}
    twBarSync();
  };
}

/* ---------------- 冒险地图 ---------------- */
function viewMap() {
  var stg = S.map.stage;
  var stage = TD.stageById(stg) || TD.STAGES[0];
  var ch = Math.min(S.map.chapter, maxChapter(stg));
  S.map.chapter = ch;
  var chips = TD.STAGES.map(function (s) {
    return '<button class="stage-chip' + (s.id === stg ? ' on' : '') + '" data-stage="' + s.id + '">' +
      '<span class="ic">' + s.icon + '</span>' + s.name + '</button>';
  }).join('');
  var nodes = '';
  for (var lv = 1; lv <= 10; lv++) {
    var open = levelOpen(stg, ch, lv);
    var boss = lv === 10;
    var b = (S.progress.best || {})['s' + stg + 'c' + ch + 'l' + lv];
    var stars = b ? b.stars : 0;
    /* 文章篇章：每张卡写这一关实际配到的文章。
       2.0.23 起按「类别 + 字数由短到长」分配，所以同一类别的 10 关
       是从短到长的 10 篇（小类别会循环）。 */
    var _nm, _art = null;
    if (stg === 6 && TL.articleOfCat) {
      _art = TL.articleOfCat(S.art.cat || '', ch, lv);
      if (_art) _nm = '《' + esc(_art.title) + '》';
    }
    var nm = _nm || esc(TL.topicOf(stg, lv) || levelName(stage, boss));
    nodes += '<button class="lv' + (boss ? ' boss' : '') + (open ? '' : ' lock') + '" data-lv="' +
      stg + ',' + ch + ',' + lv + '">' +
      (boss ? '<span class="boss-tag">BOSS</span>' : '') +
      (!open ? '<span class="lock-tag">🔒</span>' : '') +
      '<div class="no">第 ' + lv + ' 关</div>' +
      '<div class="nm">' + nm + '</div>' +
      '<div class="stars">' + (open ? starsHtml(stars).replace(/class="on"/g, 'class="on"').replace(/class="off"/g, 'class="off"') : '') + '</div>' +
      (b ? '<div class="best">最好 ' + (Math.round(b.wpm * 10) / 10) + (stage.lang === 'cn' ? ' 字/分' : ' KPM') + '</div>' : '') +
      '</button>';
  }
  var done = passedCount(stg, ch);
  var diff = TL.difficulty(stg, ch);
  var unit = stage.lang === 'cn' ? ' 字/分' : ' KPM';
  return '<div class="map-page"><div class="map-head">' + chips + '</div>' +
    '<div class="stage-desc">' + esc(stage.icon + ' ' + stage.desc) + '</div>' +
    (stg === 6 ? artBar() : '') +
    '<div class="chap-bar"><b>' + stage.icon + ' 第 ' + ch + ' 卷</b>' +
      '<span class="diff-tag d' + diff.n + '">' + diff.name + '</span>' +
      '<span class="chap-done">本卷已通关 ' + done + '/10</span>' +
      '<span class="chap-speed">速度线 ' + TL.speedLine(stg, ch) + unit + '</span>' +
      '<span class="chap-nav">' +
        '<button data-chap="' + Math.max(1, ch - 1) + '" ' + (ch <= 1 ? 'disabled' : '') + '>‹</button>' +
        '<span>卷 ' + ch + ' / 无限</span>' +
        '<button data-chap="' + (ch + 1) + '" ' + (chapterOpen(stg, ch + 1) ? '' : 'disabled') + '>›</button>' +
      '</span></div>' +
    '<div class="level-grid">' + nodes + '</div>' +
  '</div>';
}

/* ---------------- 文章阅读：当前文章条 ---------------- */
/* 关卡卡片上的名字：不同篇章做的事不一样，统一写「输入挑战」学生分不清。
   有具体知识点的篇章（1/4/7/8）走 TL.topicOf，这里只兜底。 */
function levelName(stage, boss) {
  if (boss) return stage.type === 'keys' ? '守护者挑战' : '连读挑战';
  if (stage.type === 'keys') return '键位训练';
  if (stage.id === 4) return '大小写与标点';
  if (stage.id === 7) return '小键盘';
  if (stage.id === 8) return '中英混排';
  if (stage.id === 5) return '打词语';
  if (stage.id === 6) return '读全文';
  return '输入挑战';
}
function artBar() {
  /* 2026-11-05 三次定版：学生选的不再是"某一篇"，而是"哪一类"。
     选好类别后，本卷 10 关从这个类别里按「字数由短到长」依次取文章，
     既保证一关一篇不重样，又天然满足练字难度由浅入深。 */
  var cat = S.art.cat || '';
  var ch = S.map.chapter;
  var t = null, pool = [];
  if (window.TA) {
    t = TA.TYPES.filter(function (x) { return x.id === cat; })[0] || null;
    pool = TA.ARTICLES.filter(function (x) { return !cat || x.type === cat; })
      .sort(function (a, b) { return a.chars - b.chars; });
  }
  var nm = t ? t.name : '全部分类';
  var ic = t ? t.icon : '📚';
  var desc = t ? t.desc : '七类文章混着来，按字数由短到长分配';
  return '<div class="art-bar">' +
    '<span class="ab-ic">' + ic + '</span>' +
    '<div class="ab-main">' +
      '<div class="ab-t"><b>' + esc(nm) + '</b>' +
        '<span class="ab-type">第 ' + ch + ' 卷 · ' + pool.length + ' 篇轮换</span></div>' +
      '<div class="ab-meta">' + esc(desc) + ' · 本卷 10 关按字数由短到长依次分配</div>' +
    '</div>' +
    '<button class="btn line sm" id="artOpen">换类别</button>' +
  '</div>';
}
/* ---------------- 文章库抽屉 ----------------
   分类用按钮条切换（不用下拉：机房触屏和鼠标都好点），
   卡片一行三列，每张都把「类型 / 难度 / 作者 / 句数字数」写全，
   学生不用点进去就知道这篇适不适合自己。 */
function openArtLib() {
  if (!window.TA) return;
  var total = TA.ARTICLES.reduce(function (n, a) { return n + a.chars; }, 0);
  var mask = document.createElement('div');
  mask.className = 'mask';
  function catCard(id, name, icon, desc, list) {
    var n = list.length, minC = 0, maxC = 0;
    if (n) {
      var cs = list.map(function (a) { return a.chars; });
      minC = Math.min.apply(null, cs);
      maxC = Math.max.apply(null, cs);
    }
    return '<button class="al-card' + ((S.art.cat || '') === id ? ' on' : '') +
        '" data-cat="' + id + '">' +
      '<div class="ac-top"><span class="ac-type">' + icon + '</span>' +
        '<span class="ac-hard">' + n + ' 篇</span></div>' +
      '<b class="ac-title">' + esc(name) + '</b>' +
      '<div class="ac-desc">' + esc(desc) + '</div>' +
      '<div class="ac-meta">' + (n ? ('最短 ' + minC + ' 字 · 最长 ' + maxC + ' 字')
                                  : (TA.ARTICLES.length + ' 篇')) + '</div>' +
    '</button>';
  }
  function catsHtml() {
    var all = catCard('', '全部分类', '📚',
      '七类文章混着来，按字数由短到长分配', TA.ARTICLES);
    return all + TA.TYPES.map(function (t) {
      return catCard(t.id, t.name, t.icon, t.desc, TA.list(t.id) || []);
    }).join('');
  }
  mask.innerHTML = '<div class="artlib">' +
    '<div class="al-head">' +
      '<div><b>📚 选文章类别</b><span class="al-sub">' + TA.TYPES.length + ' 类 · ' +
        TA.ARTICLES.length + ' 篇 · ' + total + ' 字</span></div>' +
      '<button class="al-x" id="alX" aria-label="关闭">✕</button>' +
    '</div>' +
    '<div class="al-grid" id="alGrid">' + catsHtml() + '</div>' +
    '<div class="al-foot">选一个类别：本卷 10 关从这一类里按字数由短到长依次取文章，一关一篇；' +
      '过关进下一关就是更长的一篇，难度自然递进。</div>' +
    '</div>';
  document.body.appendChild(mask);
  function close() { mask.remove(); }
  mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
  mask.querySelector('#alX').onclick = close;
  mask.querySelector('#alGrid').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]');
    if (!b) return;
    S.art.cat = b.getAttribute('data-cat') || '';
    saveArtCat(S.art.cat);
    S.art.id = '';                    /* 单篇锁定彻底退场，只剩类别 */
    saveArtId('');
    S.map.stage = 6;
    S.map.chapter = 1;                /* 换类别 = 从第 1 卷重新开始 */
    close();
    render();
  });
}

/* ---------------- 键盘指法示意图 ----------------
   每个键按对应手指着色：紫=小指 蓝=无名指 青=中指
   左食指=橙 右食指=绿 灰=拇指(空格)。目标键高亮闪烁。 */
var KB_FINGERS = {
  LP: { name: '小指', color: '#8E6FD8' },
  LR: { name: '无名指', color: '#5B8DEF' },
  LM: { name: '中指', color: '#2FA6A0' },
  LI: { name: '食指', color: '#E8A13C' },
  RI: { name: '食指', color: '#3E9E5B' },
  RM: { name: '中指', color: '#2FA6A0' },
  RR: { name: '无名指', color: '#5B8DEF' },
  RP: { name: '小指', color: '#8E6FD8' },
  TH: { name: '拇指', color: '#8B93A1' }
};
var KB_FINGER_OF = {
  '`': 'LP', '1': 'LP', 'q': 'LP', 'a': 'LP', 'z': 'LP',
  '2': 'LR', 'w': 'LR', 's': 'LR', 'x': 'LR',
  '3': 'LM', 'e': 'LM', 'd': 'LM', 'c': 'LM',
  '4': 'LI', '5': 'LI', 'r': 'LI', 't': 'LI', 'f': 'LI', 'g': 'LI', 'v': 'LI', 'b': 'LI',
  '6': 'RI', '7': 'RI', 'y': 'RI', 'u': 'RI', 'h': 'RI', 'j': 'RI', 'n': 'RI', 'm': 'RI',
  '8': 'RM', 'i': 'RM', 'k': 'RM', ',': 'RM',
  '9': 'RR', 'o': 'RR', 'l': 'RR', '.': 'RR',
  '0': 'RP', '-': 'RP', '=': 'RP', 'p': 'RP', '[': 'RP', ']': 'RP',
  ';': 'RP', "'": 'RP', '/': 'RP', '\\': 'RP'
};
var KB_SHIFT_OF = { '!': '1', '@': '2', '#': '3', '$': '4', '%': '5', '^': '6',
  '&': '7', '*': '8', '(': '9', ')': '0', '_': '-', '+': '=', '{': '[', '}': ']',
  ':': ';', '"': "'", '<': ',', '>': '.', '?': '/', '~': '`', '|': '\\' };
/* 小键盘键位 id → 手指。与 kbDiagram 里 kbKey() 第五参数保持同一套，
   改一处必须改两处，否则高亮的键和指法图对不上。 */
var KB_NUM_OF = {
  n7: 'RI', n8: 'RM', n9: 'RR',
  n4: 'RI', n5: 'RM', n6: 'RR',
  n1: 'RI', n2: 'RM', n3: 'RR',
  n0: 'TH', ndot: 'RR',
  nadd: 'RP', nsub: 'RP', nmul: 'RP', ndiv: 'RP', nenter: 'RP', numlk: 'RP'
};
/* 小键盘字符 → 键位 id（NumLock 打开、右手小键盘输入时用） */
var KB_NUM_CH = { '7': 'n7', '8': 'n8', '9': 'n9', '4': 'n4', '5': 'n5', '6': 'n6',
  '1': 'n1', '2': 'n2', '3': 'n3', '0': 'n0', '.': 'ndot',
  '+': 'nadd', '-': 'nsub', '*': 'nmul', '/': 'ndiv', '=': 'nenter' };
var KB_HAND_OF = { LP: 'L', LR: 'L', LM: 'L', LI: 'L', RI: 'R', RM: 'R', RR: 'R', RP: 'R', TH: 'R' };
function kbKeyInfo(ch, zone) {
  ch = String(ch == null ? '' : ch);
  if (ch.length !== 1) return null;
  /* 小键盘篇章：同一个字符要指向右手小键盘那颗键，而不是主键盘数字行。
     学生照着主键区打，手指就永远学不会小键盘的 4-5-6 定位。 */
  if (zone === 'num' && KB_NUM_CH[ch]) {
    var nid = KB_NUM_CH[ch];
    var nf = KB_NUM_OF[nid] || 'RP';
    return { id: nid, shift: null, f: nf, hand: KB_HAND_OF[nf], num: 1 };
  }
  var low = ch.toLowerCase();
  var id = null, needShift = false;
  if (/[a-z0-9]/.test(low)) { id = low; needShift = ch !== low && /[A-Z]/.test(ch); }
  else if (KB_SHIFT_OF[ch]) { id = KB_SHIFT_OF[ch]; needShift = true; }
  else if (KB_FINGER_OF[ch]) { id = ch; }
  else if (ch === ' ') { return { id: 'space', shift: null, f: 'TH', hand: 'L' }; }
  if (!id || !KB_FINGER_OF[id]) return null;
  var f = KB_FINGER_OF[id];
  var hand = KB_HAND_OF[f];
  return { id: id, shift: needShift ? (hand === 'L' ? 'R' : 'L') : null, f: f, hand: hand };
}
/* ---------------- 104 键键盘 ----------------
   设计稿坐标系：1u = 48px，键间隙 6px，行距 52px，键高 46px。
   每个键用 (col, units) → left/width、(row, span) → top/height 绝对定位，
   所以跨行键（小键盘 + 和 Enter）能精确对齐，行与行之间也不会错位。
   主键区 15u(720) + 18 + 导航簇 3u(144) + 18 + 小键盘 4u(192) = 1092。
   —— 指法配色只按「主键区 + 小键盘」的手指归属给，功能键统一灰。 */
var KU = 48, KG = 6, KP = 44;
function kbKey(id, label, alt, col, units, row, span, finger) {
  units = units || 1; row = row || 0; span = span || 1;
  var f = finger || KB_FINGER_OF[id] || 'TH';
  var w = units * KU - KG;
  var small = units <= 1 && label.length > 2;
  return '<span class="kb-k f-' + f + (small ? ' kb-sm' : '') + '" data-kb="' + id + '"' +
    ' style="left:' + (col * KU) + 'px;top:' + (row * KP) + 'px;width:' + w + 'px' +
    (span > 1 ? ';height:' + (span * KP - KG) + 'px' : '') + '">' +
    (alt ? '<i>' + alt + '</i>' : '') + label + '</span>';
}
function kbDiagram() {
  /* 小键盘篇章：主键区与导航簇压暗、小键盘提亮 ——

  var zone = (S.play && S.play.L && S.play.L.kbzone) || '';
  var dim = zone === 'num' ? ' kb-dim' : '';
  var foc = zone === 'num' ? ' kb-focus' : '';
  var r = '<div class="kb-wrap" id="kbWrap"><div class="kb" id="kbBox"><div class="kb-board">';

  /* ---- 功能键行：Esc + F1~F12（主键区上方）+ PrtSc/ScrLk/Pause（导航簇上方） ---- */
  r += '<div class="kb-frow" style="left:0;width:' + (15 * KU) + 'px">';
  r += kbKey('esc', 'Esc', '', 0, 1, 0) +
    kbKey('f1', 'F1', '', 2, 1, 0) + kbKey('f2', 'F2', '', 3, 1, 0) +
    kbKey('f3', 'F3', '', 4, 1, 0) + kbKey('f4', 'F4', '', 5, 1, 0) +
    kbKey('f5', 'F5', '', 6.5, 1, 0) + kbKey('f6', 'F6', '', 7.5, 1, 0) +
    kbKey('f7', 'F7', '', 8.5, 1, 0) + kbKey('f8', 'F8', '', 9.5, 1, 0) +
    kbKey('f9', 'F9', '', 11, 1, 0) + kbKey('f10', 'F10', '', 12, 1, 0) +
    kbKey('f11', 'F11', '', 13, 1, 0) + kbKey('f12', 'F12', '', 14, 1, 0);

  r += kbKey('prtsc', 'PrtSc', '', 0, 1, 0) + kbKey('scrlk', 'ScrLk', '', 1, 1, 0) +
    kbKey('pause', 'Pause', '', 2, 1, 0);
  r += '</div>';

  /* ---- 主键区 15u ---- */
  r += '<div class="kb-blk' + dim + '" style="width:' + (15 * KU) + 'px">';
  r += kbKey('`', '`', '~', 0, 1, 0) + kbKey('1', '1', '!', 1, 1, 0) +
    kbKey('2', '2', '@', 2, 1, 0) + kbKey('3', '3', '#', 3, 1, 0) +
    kbKey('4', '4', '$', 4, 1, 0) + kbKey('5', '5', '%', 5, 1, 0) +
    kbKey('6', '6', '^', 6, 1, 0) + kbKey('7', '7', '&', 7, 1, 0) +
    kbKey('8', '8', '*', 8, 1, 0) + kbKey('9', '9', '(', 9, 1, 0) +
    kbKey('0', '0', ')', 10, 1, 0) + kbKey('-', '-', '_', 11, 1, 0) +
    kbKey('=', '=', '+', 12, 1, 0) + kbKey('backspace', '⌫', '', 13, 2, 0);
  r += kbKey('tab', 'Tab', '', 0, 1.5, 1) + kbKey('q', 'Q', '', 1.5, 1, 1) +
    kbKey('w', 'W', '', 2.5, 1, 1) + kbKey('e', 'E', '', 3.5, 1, 1) +
    kbKey('r', 'R', '', 4.5, 1, 1) + kbKey('t', 'T', '', 5.5, 1, 1) +
    kbKey('y', 'Y', '', 6.5, 1, 1) + kbKey('u', 'U', '', 7.5, 1, 1) +
    kbKey('i', 'I', '', 8.5, 1, 1) + kbKey('o', 'O', '', 9.5, 1, 1) +
    kbKey('p', 'P', '', 10.5, 1, 1) + kbKey('[', '[', '{', 11.5, 1, 1) +
    kbKey(']', ']', '}', 12.5, 1, 1) + kbKey('\\', '\\', '|', 13.5, 1.5, 1);
  r += kbKey('caps', 'Caps', '', 0, 1.75, 2) + kbKey('a', 'A', '', 1.75, 1, 2) +
    kbKey('s', 'S', '', 2.75, 1, 2) + kbKey('d', 'D', '', 3.75, 1, 2) +
    kbKey('f', 'F', '', 4.75, 1, 2) + kbKey('g', 'G', '', 5.75, 1, 2) +
    kbKey('h', 'H', '', 6.75, 1, 2) + kbKey('j', 'J', '', 7.75, 1, 2) +
    kbKey('k', 'K', '', 8.75, 1, 2) + kbKey('l', 'L', '', 9.75, 1, 2) +
    kbKey(';', ';', ':', 10.75, 1, 2) + kbKey("'", "'", '"', 11.75, 1, 2) +
    kbKey('enter', 'Enter ↵', '', 12.75, 2.25, 2);
  r += kbKey('shiftL', 'Shift', '', 0, 2.25, 3) + kbKey('z', 'Z', '', 2.25, 1, 3) +
    kbKey('x', 'X', '', 3.25, 1, 3) + kbKey('c', 'C', '', 4.25, 1, 3) +
    kbKey('v', 'V', '', 5.25, 1, 3) + kbKey('b', 'B', '', 6.25, 1, 3) +
    kbKey('n', 'N', '', 7.25, 1, 3) + kbKey('m', 'M', '', 8.25, 1, 3) +
    kbKey(',', ',', '<', 9.25, 1, 3) + kbKey('.', '.', '>', 10.25, 1, 3) +
    kbKey('/', '/', '?', 11.25, 1, 3) + kbKey('shiftR', 'Shift', '', 12.25, 2.75, 3);
  r += kbKey('ctrlL', 'Ctrl', '', 0, 1.25, 4, 1, 'LP') + kbKey('winL', 'Win', '', 1.25, 1.25, 4, 1, 'LP') +
    kbKey('altL', 'Alt', '', 2.5, 1.25, 4, 1, 'LP') +
    kbKey('space', '—— 空格 · 拇指 ——', '', 3.75, 6.25, 4) +
    kbKey('altR', 'Alt', '', 10, 1.25, 4, 1, 'RP') + kbKey('winR', 'Win', '', 11.25, 1.25, 4, 1, 'RP') +
    kbKey('menu', 'Menu', '', 12.5, 1.25, 4, 1, 'RP') + kbKey('ctrlR', 'Ctrl', '', 13.75, 1.25, 4, 1, 'RP');
  r += '</div>';

  /* ---- 导航簇 3u：Ins/Home/PgUp · Del/End/PgDn · 方向键 ---- */
  r += '<div class="kb-blk' + dim + '" style="width:' + (3 * KU) + 'px">';
  r += kbKey('ins', 'Ins', '', 0, 1, 0, 1, 'RP') + kbKey('home', 'Home', '', 1, 1, 0, 1, 'RP') +
    kbKey('pgup', 'PgUp', '', 2, 1, 0, 1, 'RP');
  r += kbKey('del', 'Del', '', 0, 1, 1, 1, 'RP') + kbKey('end', 'End', '', 1, 1, 1, 1, 'RP') +

  r += kbKey('up', '↑', '', 1, 1, 3, 1, 'RI');
  r += kbKey('left', '←', '', 0, 1, 4, 1, 'RI') + kbKey('down', '↓', '', 1, 1, 4, 1, 'RM') +

  r += '<div class="kb-blk' + foc + '" style="width:' + (4 * KU) + 'px">';
  r += kbKey('numlk', 'NumLk', '', 0, 1, 0, 1, 'RP') + kbKey('ndiv', '/', '', 1, 1, 0, 1, 'RP') +
    kbKey('nmul', '*', '', 2, 1, 0, 1, 'RP') + kbKey('nsub', '-', '', 3, 1, 0, 1, 'RP');
  r += kbKey('n7', '7', '', 0, 1, 1, 1, 'RI') + kbKey('n8', '8', '', 1, 1, 1, 1, 'RM') +
    kbKey('n9', '9', '', 2, 1, 1, 1, 'RR') + kbKey('nadd', '+', '', 3, 1, 1, 2, 'RP');
  r += kbKey('n4', '4', '', 0, 1, 2, 1, 'RI') + kbKey('n5', '5', '', 1, 1, 2, 1, 'RM') +
    kbKey('n6', '6', '', 2, 1, 2, 1, 'RR');
  r += kbKey('n1', '1', '', 0, 1, 3, 1, 'RI') + kbKey('n2', '2', '', 1, 1, 3, 1, 'RM') +
    kbKey('n3', '3', '', 2, 1, 3, 1, 'RR') + kbKey('nenter', 'Enter', '', 3, 1, 3, 2, 'RP');
  r += kbKey('n0', '0', '', 0, 2, 4, 1, 'TH') + kbKey('ndot', '.', '', 2, 1, 4, 1, 'RR');

  r += '</div>';   /* .kb-board */

/* 图例行（2026-11-03 二次调整）：
   手指示例图例（9 枚手指色块）已按牛哥要求删除——
   键盘分区配色 + 手指指法图本身就说明了「哪根手指管哪些键」，
   再摆一排图例属于第三次重复；删除后本行只留道具条，居中放置。 */
function legendRow() {
  return '<div class="legend-row">' + itemBar() + '</div>';
}
/* 图例原位高亮的历史函数：图例已删，#kbLegend 不存在时自动空转（保留调用点兼容） */
function paintLegend(f) {
  var lg = $('#kbLegend');
  if (!lg) return;
  lg.querySelectorAll('span.on').forEach(function (el) { el.classList.remove('on'); });
  if (f && KB_FINGERS[f]) {

function paintKb(ch) {
  var box = $('#kbBox');
  if (!box) return;
  box.querySelectorAll('.kb-k.hot, .kb-k.hotsh').forEach(function (el) {
    el.classList.remove('hot', 'hotsh');
  });
  var zone = (S.play && S.play.L && S.play.L.kbzone) || '';
  var info = kbKeyInfo(ch, zone);
  if (!info) { paintLegend(null); paintHands(null); paintIme(); return; }
  var k = box.querySelector('[data-kb="' + info.id + '"]');
  if (k) k.classList.add('hot');

}

/* 实际敲键瞬态高亮（2026-11-03 牛哥要求）：任意按键按下的那一瞬间，
   虚拟键盘上被按的那颗键闪一下 —— 和常驻的 .hot「目标键」高亮互相独立。
   ok=false（敲错）用红色，正确/普通用品牌色；100ms 自动退场，连打不糊。
   2026-11-04：180ms 缩短到 100ms（按下立马响应、闪完就收）。
   info.shift 时对应手的 Shift 键一起闪。供 keys / 英文 / 中文三个模式共用。 */
function flashPressKey(ch, ok) {
  var box = $('#kbBox');
  if (!box) return;
  var zone = (S.play && S.play.L && S.play.L.kbzone) || '';
  var info = kbKeyInfo(ch, zone);
  if (!info) return;
  var ids = [info.id];
  if (info.shift) ids.push(info.shift === 'L' ? 'shiftL' : 'shiftR');
  ids.forEach(function (id) {
    var el = box.querySelector('[data-kb="' + id + '"]');
    if (!el) return;
    var cls = ok === false ? 'press-bad' : 'press';
    el.classList.remove('press', 'press-bad');
    el.getBoundingClientRect();      /* 强制重排：连续快敲时瞬态也能重放 */
    el.classList.add(cls);
    if (el._pt) clearTimeout(el._pt);
    el._pt = setTimeout(function () { el.classList.remove('press', 'press-bad'); }, 100);
  });
}
window.kbDebugPress = function (ch) {
  var el = $('#kbBox .kb-k.press, #kbBox .kb-k.press-bad');
  return { ch: ch || '', pressed: el ? el.getAttribute('data-kb') : '',
           bad: el ? el.classList.contains('press-bad') : false };
};

/* 键盘整体等比缩放 ------------------------------------------------
   .kb 是固定设计稿（1115×~317），这里算出唯一缩放比 s 后整块 transform:scale(s)：
   键宽 / 键高 / 字号 / 圆角 / 间距同比例变化 —— 是「整张键盘在缩放」，
   而不是把每个按键单独拉长。
   s 取「宽、高谁先受限」的较小值：窗口够高就撑满宽度，窗口矮就按高度收。
   指法图不再跟着键盘拉满（2026-11-02 三次调整：它要更小更紧凑），
   改为自己用 max-width 控制。 */
function fitKeyboard() {
  var wrap = $('#kbWrap'), kb = $('#kbBox');
  if (!wrap || !kb) return;
  var aw = wrap.clientWidth, ah = wrap.clientHeight;
  if (!aw || !ah) return;
  var dw = kb.offsetWidth || 1115;        // offsetWidth 不受 transform 影响，永远是设计稿宽度
  var dh = kb.offsetHeight || 317;
  var s = Math.max(0.3, Math.min(1.8, Math.min(aw / dw, ah / dh)));
  kb.style.setProperty('--kbs', s.toFixed(3));
  kb.style.transform = 'translate(-50%,-50%) scale(' + s.toFixed(3) + ')';
}
var _kbFitTimer = null;
function scheduleFitKb() {
  if (_kbFitTimer) clearTimeout(_kbFitTimer);
  _kbFitTimer = setTimeout(function () { _kbFitTimer = null; fitKeyboard(); }, 60);
}
window.addEventListener('resize', scheduleFitKb);

/* ---------------- 手指指法示意图（手形） ----------------

function handsDiagram() {

      '<g transform="translate(' + d.x + ',' + cy + ')">' +

/* 指法图高亮（2026-11-03 重做）

     · 学生敲错那一下，图上没有任何反馈，"我刚才用哪根手指"对不上；
     · 敲对了也没有即时确认。

     .active  当前目标手指（填色 + 扩散环）
     .aux     需要按住 Shift 的辅助小指（虚线描边）
     .hit/.miss 刚敲下那一下的反馈（绿闪 / 红闪，0.28s 自动退）

  box.querySelectorAll('.finger').forEach(function (el) {
    var f = el.getAttribute('data-finger');

    el.classList.toggle('aux', !!shiftHand && KB_HAND_OF[f] === shiftHand && !on);

  box.querySelectorAll('.hzone').forEach(function (z) {

  el.classList.remove('hit', 'miss');

/* ---------------- 练习引擎 ---------------- */
function startLevel(st, ch, lv) {

function openLevel(st, ch, lv, dr) {
  clearPlayBindings();

    /* 第 6 篇章：按「类别」取文章（S.art.cat），引擎从该类别的池子里
       按字数由短到长分配；nonce 固定 0 —— 同一关任何时候进来都是同一篇，
       成绩与断点才对得上。其余篇章每次进关都换随机内容，防止背顺序。 */
    var artCat = (st === 6) ? (S.art.cat || '') : null;

    /* 防御：关卡数据生成异常（阶段越界 / 文本缺失等）时，给出明确错误而不是白屏或卡死 */
    if (!L || !L.type) throw new Error('关卡数据生成失败（stage=' + st + ' chapter=' + ch + ' level=' + lv + '）');
    if (L.type === 'keys' && !Array.isArray(L.items)) L.items = [];
    if (L.type !== 'keys' && typeof L.text !== 'string') L.text = '';

    S.play = {
      L: L, stage: st, chapter: ch, level: lv,
      idx: 0, keys: 0, errors: 0, t0: 0, timer: null, done: false,
      errChar: null,   /* 当前敲错的字（红色就地标注，打对自动替换） */
      composing: false, composeText: '',
      /* 道具：本关内有效，进关前点「用」才会置 true */
      buff: { hint: false, extra: false, shield: false, double: false },
      resumeDur: 0     /* 断点续打补回的上次已用秒数（结算时计入用时） */
    };

       键位课程关（type=keys）内容在 items 里，不支持续打 → 当新关。 */
    if (dr && L.type === 'text' && dr.text) {
      L.text = String(dr.text);
      if (dr.lines && L.long) { L.lines = dr.lines; L._starts = null; }
      L.timeLimit = Math.max(75, Math.round(L.text.length / (L.speedLine * 0.30)));
      S.play.idx = Math.min(dr.idx || 0, L.text.length - 1);
      S.play.errors = dr.err || 0;
      S.play.keys = dr.keys || 0;

        '\n\n先刷新页面重试；还是不行就截图把这句话发给老师。'

}
