/* ---------------- 课文区渲染 ----------------
   中文：逐字一列，默认只显示汉字；每个字把拼音写进 data-p（多音字靠
   pinyin.js 的词级覆盖），点击时气泡才弹出来 —— 拼音是「查」出来的，
   不是常驻的。英文：保持普通字符流（空格不会被 flex 吃掉）。 */
function textHtml(text, idx, bad, base) {
  var isCn = S.play && S.play.L && S.play.L.mode === 'cn';
  base = base || 0;
  /* 2026-11-05 牛哥定版：原文行永远显示原文、永远不标红。
     「已输入且打错」的那个字只在回显层（echoHtml 的 .ch.e）里红色保留；
     原文当前格用 .c 底纹提示位置即可，不然学生会把红色的原文当成错字。 */
  var i, g, cls, s = '';
  var clsAt = function (n) {
    if (n < idx) return 'o';
    if (n === idx) return bad ? 'e' : 'c';
    return 'd';
  };
  if (isCn && window.PY && PY.annotate) {
    var arr = PY.annotate(text);
    for (i = 0; i < arr.length; i++) {
      g = base + i;
      cls = clsAt(g);
      /* 空格也要带状态：中英混排关里空格很多，原来只渲染一个空 span，
         学生根本看不出"这里要按一下空格"，只会以为两个字挨得近。 */
      if (arr[i].c === ' ') { s += '<span class="ch sp ' + cls + '"></span>'; continue; }
      s += '<span class="ch ' + cls + '"' +
        (arr[i].p ? ' data-p="' + esc(arr[i].p) + '"' : '') +
        '><span class="hz">' + esc(arr[i].c) + '</span></span>';
    }
    return s;
  }
  for (i = 0; i < text.length; i++) {
    g = base + i;
    cls = clsAt(g);
    /* 大写字母加 .up 角标（2026-11-04 牛哥反馈大小写分不清）：⇧ 画在字头顶，
       绝对定位不占布局宽度，回显层逐字对齐不受影响 */
    s += '<span class="' + cls + (/[A-Z]/.test(text[i]) ? ' up' : '') + '">' + esc(text[i]) + '</span>';
  }
  return s;
}
/* 输入框回显层：结构与课文 textHtml 逐字一致（同样的 .ch/.ch.sp 与字符顺序），
   区别只有两点 —— 没有「当前字」高亮，未输入的字交给 CSS 调成透明占位。
   结构一致是逐字对齐的根本：只要字符数和类名相同，flex 排出来的每个字宽度、
   换行位置就和课文一模一样。 */
function echoHtml(text, idx, base) {
  var errCh = (S.play && S.play.errChar) || '';
  var arr = (window.PY && PY.annotate) ? PY.annotate(text) : null;
  base = base || 0;
  var i, g, s = '', cls;
  if (arr) {
    for (i = 0; i < arr.length; i++) {
      g = base + i;
      cls = g < idx ? 'o' : 'd';
      if (arr[i].c === ' ') { s += '<span class="ch sp ' + cls + '"></span>'; continue; }
      if (g === idx && errCh) {
        s += '<span class="ch e"><span class="hz">' + esc(errCh) + '</span></span>';
        continue;
      }
      s += '<span class="ch ' + cls + '"><span class="hz">' + esc(arr[i].c) + '</span></span>';
    }
    return s;
  }
  for (i = 0; i < text.length; i++) {
    g = base + i;
    if (g === idx && errCh) { s += '<span class="e">' + esc(errCh) + '</span>'; continue; }
    s += '<span class="' + (g < idx ? 'o' : 'd') + '">' + esc(text[i]) + '</span>';
  }
  return s;
}
/* 把透明的真输入框、可见光标一起挪到「当前正在打的那个字」的位置。
   这是输入法候选框定位的关键：浏览器按 input 的 caret 矩形摆候选框，
   input 浮在第 idx 格的格子里，搜狗/微软拼音的候选框就跟着落在那里，
   不会再跑到输入台（甚至整页）最左边。每敲一个字都会重算一次。 */
function placeTypingInput() {
  var P = S.play;
  var caret = document.getElementById('tbCaret');
  if (!P || !P.L || P.L.mode !== 'cn' || P.done) {
    if (caret) caret.hidden = true;
    return;
  }
  var cn = document.getElementById('cnInput');
  var field = document.getElementById('tbField');
  if (!cn || !field) return;
  var echo = document.getElementById('tbEcho');
  var mini = document.getElementById('tbMini');
  var left = 8, top = 4, w = 34, h = 32;
  if (mini) {
    /* 整篇文章：输入台里显示本行已上屏的字，光标与候选框跟在它后面 */
    var st = artLineStarts(P.L);
    var li = artLineOf(P.L, Math.min(P.idx, Math.max(0, P.L.text.length - 1)));
    var typed = P.L.text.slice(st[li] || 0, P.idx);
    mini.textContent = typed.length > 40 ? '…' + typed.slice(-40) : typed;
    left = 8 + mini.offsetWidth;
    top = 4; w = 34; h = 26;
  } else if (echo && echo.children.length) {
    /* 短课文：回显层与课文逐字同列，直接取第 idx 格的 offset */
    var cell = echo.children[Math.min(P.idx, echo.children.length - 1)];
    if (cell) {
      left = cell.offsetLeft; top = cell.offsetTop;
      w = Math.max(26, cell.offsetWidth);
      h = Math.max(26, cell.offsetHeight);
    }

  left = Math.max(0, Math.min(left, Math.max(0, field.clientWidth - w)));
  cn.style.left = left + 'px';
  cn.style.top = top + 'px';
  cn.style.width = w + 'px';
  cn.style.height = h + 'px';
  cn.style.textIndent = '0px';       /* 组合输入前后都保持同一落点 */
  if (caret) {
    caret.style.left = left + 'px';
    caret.style.top = top + 'px';
    caret.style.height = h + 'px';
    caret.hidden = false;
  }
}

/* ---------------- 文章逐行视图（2026-11-05） ----------------
   每行一块：上行原文（逐字状态 + 光标），下行该行的上屏回显。
   全局进度仍然只有 P.idx 一个数，行的边界由 lineStarts 换算 ——
   结算用的准确率 / 速度 / 星级完全不受影响。 */
function artLineStarts(L) {
  if (L._starts && L._startsFor === L.text) return L._starts;
  var arr = L.lines || [L.text], out = [], n = 0;
  for (var i = 0; i < arr.length; i++) { out.push(n); n += arr[i].length; }
  L._starts = out; L._startsFor = L.text;
  return out;
}
function artLineOf(L, idx) {
  var st = artLineStarts(L), lo = 0, hi = st.length - 1;
  while (lo < hi) {
    var mid = (lo + hi + 1) >> 1;
    if (st[mid] <= idx) lo = mid; else hi = mid - 1;
  }
  return lo;
}
function artRowHtml(i) {
  var L = S.play.L, P = S.play;
  var line = (L.lines || [])[i] || '';
  var base = artLineStarts(L)[i];
  var isCn = L.mode === 'cn';
  var on = P.idx >= base && P.idx < base + line.length;
  return '<div class="art-row' + (on ? ' on' : '') + '" data-line="' + i + '">' +
    '<span class="art-no">' + (i + 1) + '</span>' +
    '<div class="art-main">' +
      '<div class="art-orig' + (isCn ? '' : ' en-line') + '">' +
        textHtml(line, P.idx, false, base) + '</div>' +

/* 只重画「当前行」和「刚刚离开的那一行」：整篇上百行，每敲一个字全部重排会卡 */
function paintArt() {
  var L = S.play && S.play.L, P = S.play;
  if (!L || !L.lines) return;
  var cur = artLineOf(L, Math.min(P.idx, Math.max(0, L.text.length - 1)));
  var need = [cur];

       NumpadEqual 的 e.key 会是 'Unidentified'，靠 e.key 兜底必然丢。 */
    'NumpadEqual': '=', 'NumpadAdd': '+', 'NumpadSubtract': '-',
    'NumpadMultiply': '*', 'NumpadDivide': '/', 'NumpadDecimal': '.' };
  var KB_CODE_SHIFT = { 'Minus': '_', 'Equal': '+', 'BracketLeft': '{', 'BracketRight': '}',
    'Semicolon': ':', 'Quote': '"', 'Backquote': '~', 'Backslash': '|',
    'Comma': '<', 'Period': '>', 'Slash': '?' };

    var c = e.code, m;

       主键盘 =、小键盘 = 在不同键盘 / 驱动 / 输入法下，e.code 会分别给成
       Equal、NumpadEqual、Unidentified，甚至空串 —— 只认物理键位必然有漏网。

    var acc = Math.min(100, Math.round(done / ks * 100));
    var s1 = $('#liveSpeed'), s2 = $('#liveAcc');
    if (s1) s1.textContent = (Math.round(spd * 10) / 10) + (L.mode === 'cn' ? ' 字/分' : ' KPM');
    if (s2) s2.textContent = acc + '%';
  }
  function startTimer() {
    stopTimer();
    P.timer = setInterval(livePaint, 300);
  }
  function advance() {
    P.idx++;
    var fill = document.querySelector('.progress-fill');
    if (fill) fill.style.width = Math.round(P.idx / total * 100) + '%';
    /* 键帽 / 光标 / 键盘示意图 / 手指指法图一起推进 */
    if (L.type === 'keys') paintKeys();
    else { paintText(false); paintKb(L.text[P.idx]); }
    livePaint();
    if (P.idx >= total) finish();
  }
  function paintKeys() {
    var cur = L.items[P.idx] || { k: '', hint: '' };
    var cap = $('#keyCap'), hf = $('#keyFinger');
    if (cap) cap.textContent = cur.k;
    if (hf) hf.innerHTML = '用 <b>' + esc(cur.hint) + '</b> 敲下这个键';
    paintKb(cur.k);
  }
  function paintText(extraBad) {
    if (S.play && S.play.L && S.play.L.long && S.play.L.lines) {
      paintArt();
      hidePyPop();
      return;
    }
    var line = $('#textLine');
    if (!line) return;
    line.innerHTML = textHtml(L.text, P.idx, !!extraBad);
    /* 课文重排后，原来指着的那颗字已经换位置/换元素，气泡跟着关掉 */
    hidePyPop();
  }
  /* —— 拼音气泡：挂在 textWrap 上，课文重渲染冲不掉它。
     定义在 startLevel 顶层（不能放进中文分支的块里，
     否则英文关 paintText 调到的是 undefined）。 —— */
  function hidePyPop() {
    var pop = $('#pyPop');
    if (pop) pop.hidden = true;
    P.pyCh = null;
  }
  function showPyPop(ch) {
    var pop = $('#pyPop');
    if (!pop || P.done) return;
    var p = ch.getAttribute('data-p') || '';
    if (!p) { hidePyPop(); return; }
    /* 再点同一个字 = 收起 */
    if (P.pyCh === ch && !pop.hidden) { hidePyPop(); return; }
    P.pyCh = ch;
    pop.textContent = p;
    pop.hidden = false;
    pop.className = 'py-pop';
    var wr = pop.parentNode.getBoundingClientRect();
    var cr = ch.getBoundingClientRect();
    pop.style.left = '0px'; pop.style.top = '0px';   /* 先摆出来才能量宽高 */
    var w = pop.offsetWidth, h = pop.offsetHeight;
      var left = cr.left - wr.left + cr.width / 2 - w / 2;
      left = Math.max(2, Math.min(left, wr.width - w - 2));
      /* 气泡只停在课文框的"停靠带"里（padding-top 24），不越到标题栏上方 */
      var top = cr.top - wr.top - h - 5;
      if (top < 2) top = 2;
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }
  function finish() {
    if (P.done) return;
    P.done = true;
    stopTimer();
    /* 断点续打：上次已用的时间补回来，速度/用时口径才不失真 */
    var dur = Math.max(3, (Date.now() - P.t0) / 1000 + (P.resumeDur || 0));
    var chars = total;
    var ks = Math.max(P.keys, chars);
    var acc = Math.min(100, Math.round(chars / ks * 1000) / 10);
    var wpm = Math.round(chars / dur * 60 * 10) / 10;
    var stars = TL.starsFor(L.stage, L.chapter, acc, wpm);
    /* 容错卡：准确率 87% 也算通关，但只补到 1 星 ——
       2 星 3 星的速度线与准确率一点没降，想冲星还得真打 */
    if (!stars && P.buff.shield && acc >= 87) stars = 1;
    submitResult({ stage: L.stage, chapter: L.chapter, level: L.level,
      acc: acc, chars: chars, duration: Math.round(dur),
      shield: P.buff.shield ? 1 : 0, double: P.buff.double ? 1 : 0 }, stars, wpm);
  }
  function wrongFlash() {
    document.body.animate && document.body.animate(
      [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }],
      { duration: 140 });
  }

  if (L.type === 'keys') {
    P._kd = function (e) {
      if (P.done) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var cur = L.items[P.idx];
      if (!cur) return;
      var k = evChar(e);
      if (k == null) return;
      begin();
      P.keys++;
      /* 大写按键课要严格比对：目标是大写字母时必须按住 Shift。
         小写关仍然宽容（大写锁开着也能通关），否则新手会卡在"我明明按了 A"。 */
      var tgt = String(cur.k);
      var strict = /[A-Z]/.test(tgt) || /[!@#$%^&*()_+{}|:"<>?~]/.test(tgt);
      var hit = strict ? (k === tgt) : (k.toLowerCase() === tgt.toLowerCase());
      /* 任意按键都在虚拟键盘上闪对应键：敲对橙、敲错红（2026-11-03） */
      flashPressKey(k, hit);
      var ke = $('#keyErr');
      if (hit) {
        flashFinger(kbFingerOfKey(k), 'hit');     /* 先闪"刚按下的那根手指" */
        advance();                                 /* 再推进到下一键的目标手指 */
        if (ke) ke.textContent = '';
      } else {
        P.errors++;
        wrongFlash();
        flashFinger(kbFingerOfKey(tgt), 'miss');   /* 敲错：把正确的那根手指标红，纠错更直观 */
        /* 敲错的内容就地标注（按键课没有输入框，红字挂在目标键帽下方） */
        if (ke) ke.innerHTML = '刚才按了 <b class="key-err-bad">' + esc(k === ' ' ? '空格' : k) +
          '</b>，目标是 <b>' + esc(tgt) + '</b>';
      }
      e.preventDefault();
    };
    clearKd();
    document.addEventListener('keydown', P._kd);
    S._kd = P._kd;
    paintKeys();
  } else if (L.mode === 'en') {
    /* 英文关：document 级监听 + e.code 判定，输入法开着也不会卡；
       不再依赖隐藏输入框（会被输入法接管组合输入）。
       2026-11-03：敲错的字不再一闪而过 —— 就地显示在课文流的当前格，
       红色标注，打对自动替换（P.errChar）。 */
    P._kd = function (e) {
      if (P.done) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var ch = evChar(e);
      if (ch == null) return;
      begin();
      P.keys++;
      if (ch === L.text[P.idx]) {
        P.errChar = null;
        flashPressKey(ch, true);
        flashFinger(kbFingerOfKey(ch), 'hit');
        advance();
      } else {
        P.errors++; wrongFlash();
        flashPressKey(ch, false);
        flashFinger(kbFingerOfKey(L.text[P.idx]), 'miss');
        /* 错字保留显示（红色），不再 setTimeout 恢复 —— 打对才替换 */
        P.errChar = ch;
        paintText(false);
        /* 大小写锁提示：目标是小写、学生却打出大写 —— 十有八九是
           CapsLock 开着。只提醒一次，不反复弹窗打断打字。 */
        var t0 = L.text[P.idx];
        if (!P._capTip && /[a-z]/.test(t0) && ch === t0.toUpperCase()) {
          P._capTip = 1;
          uiToast('打出来是大写？按一下 CapsLock 关掉大写锁', 'warn');
        }
      }
      e.preventDefault();
    };
    clearKd();
    document.addEventListener('keydown', P._kd);
    S._kd = P._kd;
    paintKb(L.text[0]);
  } else {
    /* 中文：输入法组合输入 + 输入框实时回显（金山打字通的上屏区）
       旧版每上屏一次就清空输入框，学生只看得到课文变色、框里永远空的。
       现在输入框保留「已经打出来的字」，课文区同步推进，两边实时一致；
       打错的字会被截回，退格可整字回退。 */
    var cn = $('#cnInput');
    if (!cn) return;
    P.typed = '';
    cn.value = '';
    cn.focus();
    function setCaret() {
      try { cn.selectionStart = cn.selectionEnd = cn.value.length; } catch (e) {}
    }
    function syncCount() {
      var c = $('#tbCount');
      if (c) c.textContent = P.idx + ' / ' + total;
    }
    function pushFill() {
      var fill = document.querySelector('.progress-fill');
      if (fill) fill.style.width = Math.round(P.idx / total * 100) + '%';
    }
    /* 接受 n 个正确的字：课文区、输入框、进度、键盘、手指一起推进 */
    function accept(n) {
      begin();
      P.idx += n;
      P.keys += n;
      P.typed = L.text.slice(0, P.idx);
      cn.value = P.typed;
      setCaret();
      paintText(false);
      paintEcho();
      syncCount();
      pushFill();
      paintKb(L.text[P.idx]);
      livePaint();
      if (P.idx >= total) finish();
    }
    /* 2026-11-03 重写错误处理（牛哥要求）：打错的字不再截回/吞掉，
       而是保留在输入框里、在回显层的当前格以红色标注；
       打对的那一下自动替换错字并推进。P.errChar = 当前挂着的错字。 */
    P.errChar = null;
    function onInput() {
      if (P.done) return;
      var pre = P.typed.length;
      var v = cn.value;
      if (v === P.typed + (P.errChar || '')) return;   /* 没有新内容（只是光标动） */
      /* ① 变短 / 前缀被改：当作退格回退，只允许退到仍是原文前缀的位置。
            退格删到错字时把红标错字一并清掉。 */
      if (v.length < pre || v.slice(0, pre) !== P.typed) {
        if (L.text.slice(0, v.length) === v) {
          P.idx = v.length;
          P.typed = v;
          P.errChar = null;
          paintText(false);
          paintEcho();
          syncCount();
          pushFill();
          paintKb(L.text[P.idx]);
          setCaret();
        } else {
          cn.value = P.typed + (P.errChar || '');
          setCaret();
          wrongFlash();
        }
        return;
      }
      /* ② 新上屏的内容逐字核对：
            - 与课文相符 → 确认推进（错字同时被正确字顶替）；
            - 不相符 → 不吞不截，字留在输入框，红标注在当前格；
              连续多字上屏时，错字只保留最后一个显示（前面的被顶掉）。 */
      var delta = v.slice(pre);
      if (P.errChar && delta.charAt(0) === P.errChar) delta = delta.slice(1);
      if (!delta.length) { P.errChar = null; return; }   /* 旧错字被退格删掉 */
      var k = 0, err = P.errChar;
      while (k < delta.length) {
        var c = delta.charAt(k);
        if (L.text.charAt(P.idx) === c) { err = null; accept(1); }
        else { err = c; P.errors++; P.keys++; wrongFlash(); }
        k++;
        if (P.done) break;
      }
      P.errChar = err;
      if (err) {
        cn.value = P.typed + err;
        setCaret();
        paintText(false);
        paintEcho();
      }
    }
    /* 中文模式下任意按键也要在虚拟键盘上闪对应键（含拼音输入期间：
       IME 组合时 e.key 是 'Process'，但 e.code 始终是物理键位）。 */
    cn.addEventListener('keydown', function (e) {
      if (P.done) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var k = evChar(e);
      if (k != null) flashPressKey(k, null);
    });
    /* 组合输入期间拼音的落点（2026-11-05 重写）
       input 始终透明，拼音只做成一个浮标贴在「第 idx 个字」的格子上；
       真输入框本身由 placeTypingInput() 浮到同一格，浏览器据此摆放
       搜狗 / 微软拼音的候选框 —— 组合开始、更新、结束全程都不跳位。
       旧的 text-indent 方案只在组合期生效，结束立刻归零，候选框会
       「啪」地跳回最左边，这一版彻底去掉。 */
    var tbf = $('#tbField');
    var tbComp = $('#tbComp');
    function placeComp(txt) {
      placeTypingInput();
      if (!tbComp || !tbf) return;
      var box = $('#tbEcho'), mini = $('#tbMini');
      var left = 8, top = 4;
      if (box && box.children.length) {
        var at = box.children[Math.min(P.idx, box.children.length - 1)];
        if (!at) { tbComp.hidden = true; return; }
        left = at.offsetLeft; top = at.offsetTop + 3;
      } else if (mini) {
        left = 8 + mini.offsetWidth; top = 4;
      }
      tbComp.hidden = false;
      tbComp.textContent = txt || '　';
      /* 贴边保护：拼音比一个字宽时别顶出框外 */
      var maxLeft = tbf.clientWidth - tbComp.offsetWidth - 4;
      if (left > maxLeft) left = Math.max(0, maxLeft);
      tbComp.style.left = left + 'px';
      tbComp.style.top = top + 'px';
    }
    cn.addEventListener('compositionstart', function () {
      P.composing = true;
      if (tbf) tbf.classList.add('comp');
      placeComp('');
    });
    cn.addEventListener('compositionupdate', function (e) {
      if (P.composing) placeComp(e.data || '');
    });
    cn.addEventListener('compositionend', function () {
      P.composing = false;
      if (tbf) tbf.classList.remove('comp');
      if (tbComp) tbComp.hidden = true;
      placeTypingInput();
      setTimeout(onInput, 0);
    });
    cn.addEventListener('input', function (e) {
      if (P.composing || (e && e.isComposing)) return;
      onInput();
    });
    clearAppClick();
    S._appClick = function () { if (!P.done) { cn.focus(); setCaret(); } };
    app.addEventListener('click', S._appClick);
    /* 点生字查拼音：普通课文挂在 #textLine 上，逐行视图挂在 #textWrap 上
       （逐行视图里没有单一的 #textLine，事件委托到整块课文区） */
    var tapBox = $('#textLine') || $('#textWrap');
    if (tapBox) tapBox.addEventListener('mousedown', function (e) {
      var ch = e.target.closest ? e.target.closest('.ch') : null;
      /* preventDefault：输入框不失焦，点完生字还能接着打 */
      if (ch) e.preventDefault();
      if (ch && ch.getAttribute('data-p')) showPyPop(ch); else hidePyPop();
    });
    S._pyDown = function (e) {
      var t = e.target;
      while (t) { if (t.id === 'textWrap') return; t = t.parentNode; }
      hidePyPop();
    };
    document.addEventListener('mousedown', S._pyDown);
    paintKb(L.text[0]);
    syncCount();
  }
  function stopTimer() { if (P.timer) { clearInterval(P.timer); P.timer = null; } }
  S._stopTimer = stopTimer;
}
function stopTimer() { if (S._stopTimer) S._stopTimer(); }
/* 清掉上一关挂在 document / app 上的监听器：
   不清的话旧关卡处理器会在背后 preventDefault 按键、
   甚至弹出旧结算层，表现为"点进去就卡死"。 */
function clearKd() {
  if (S._kd) { document.removeEventListener('keydown', S._kd); S._kd = null; }
}
function clearAppClick() {
  if (S._appClick) { app.removeEventListener('click', S._appClick); S._appClick = null; }
}
function clearPyDown() {
  if (S._pyDown) { document.removeEventListener('mousedown', S._pyDown); S._pyDown = null; }
}
function clearPlayBindings() {
  clearKd();
  clearPyDown();
  clearAppClick();
  stopTimer();
}

/* ---------------- 练习草稿 + 全局同步（2026-11-05） ----------------
   教师端关闭打字练习的那一刻，record 接口会拒收 —— 学生正在打的那一关
   就这么丢，孩子最伤心。三条保障：
   ① 练习中每 10 秒自动把「当前关卡草稿」发到服务端（切后台 / 关页面前也发）；
   ② 12 秒轮询 /typing/me：一旦发现老师关了练习，立刻补发一次草稿，
      弹提示并退回地图（进度不丢，重开后可续打）；
   ③ 重新进这一关时询问「接着打 / 从头开始」。 */
function draftFlushNow() {
  var P = S.play;
  if (!P || P.done || S.demo || S.role !== 'student') return;
  var L = P.L;
  var body = {
    stage: P.stage, chapter: P.chapter, level: P.level,
    idx: P.idx, err: P.errors || 0, keys: P.keys || 0,
    dur: P.t0 ? (Date.now() - P.t0) / 1000 : 0,
    text: L.text || '',
    lines: (L.long && L.lines) ? L.lines : null
  };
  if (navigator.sendBeacon) {
    try {
      navigator.sendBeacon('/api/v2/typing/draft',
        new Blob([JSON.stringify(body)], { type: 'application/json' }));
      return;
    } catch (e) {}
  }
  api('/api/v2/typing/draft', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
}
function startSyncLoop() {
  /* 练习中：每 10 秒自动存草稿（页面隐藏 / 关页前也立刻存一次） */
  setInterval(function () {
    if (S.play && !S.play.done && !document.hidden) draftFlushNow();
  }, 10000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) draftFlushNow();
  });
  window.addEventListener('pagehide', function () { draftFlushNow(); });
  /* 全局同步：教师发放/扣除积分、开关打字练习，学生端 12 秒内跟上。
     练习中绝不整页重绘（会冲掉正在打的关卡），只在地图/牧场页刷余额。 */
  setInterval(function () {
    if (S.demo || S.role !== 'student' || document.hidden) return;
    api('/api/v2/typing/me').then(function (me) {
      if (!me || !me.ok) return;
      var wasEnabled = !!(S.config && S.config.enabled);
      var old = S.progress || {};
      S.progress = me.progress;
      refreshPts();                 /* 老师发/扣积分：顶栏数字立刻跟上 */
      if (!S.progress.equip) S.progress.equip = { pet: '', decos: [] };
      S.config = me.config || S.config;
      /* 老师把练习关了：先补发草稿，再弹提示退回地图 */
      if (S.play && !S.play.done && !(S.config && S.config.enabled)) {
        draftFlushNow();
        clearPlayBindings();
        S.view = 'map'; S.play = null;
        render();
        uiAlert({ title: '练习暂停了', tone: 'warn',
          message: '老师暂时关闭了打字练习。\n你这一关的进度已经自动保存好，重新开放后回来接着打。' });
        return;
      }
      var nowEnabled = !!(S.config && S.config.enabled);
      if (nowEnabled !== wasEnabled) { render(); return; }
      /* 只有余额真的变了才重绘，避免 12 秒一次的无谓跳动 */
      if (S.view === 'ranch' || S.view === 'map') {
        if ((old.pts || 0) !== (S.progress.pts || 0) ||
            (old.stars || 0) !== (S.progress.stars || 0) ||
            (old.eggs || 0) !== (S.progress.eggs || 0)) render();
      }
    });
  }, 12000);
}

/* ---------------- 结算 ---------------- */
function submitResult(payload, stars, wpm) {
  if (S.demo) {
    var key = 's' + payload.stage + 'c' + payload.chapter + 'l' + payload.level;
    var pr = S.progress;
    var prev = pr.best[key];
    var newBest = !prev || stars > prev.stars || (stars === prev.stars && wpm > prev.wpm);
    var gained = newBest ? Math.max(0, stars - (prev ? prev.stars : 0)) : 0;
    if (newBest) {
      pr.best[key] = { stars: stars, wpm: wpm };
      pr.stars = (pr.stars || 0) + gained;
      pr.week_stars = (pr.week_stars || 0) + gained;
      /* 统一积分公式与 levels.js / typing_store.py 一致：
         基础积分 + 难度积分，加倍卡只翻基础那一份 */
      var addPts = TL.ptsFor(stars, payload.stage, payload.chapter,
                             payload.level, false, !!payload.double);
      pr.pts = (pr.pts || 0) + addPts;
      refreshPts();
      var pool = ['hat-red', 'crown', 'sunglass', 'glasses', 'scarf', 'bow', 'headset', 'bg-star'];
      var needs = [10, 20, 40, 60, 80, 100, 130, 160];
      var newDecos = [];
      for (var i = 0; i < needs.length; i++) {
        if (pr.stars >= needs[i] && pr.decos.indexOf(pool[i]) < 0) { pr.decos.push(pool[i]); newDecos.push(pool[i]); }
      }
      var egg = payload.level === 10 && !prev && stars > 0;
      if (egg) pr.eggs = (pr.eggs || 0) + 1;
      demoSave();
      /* 教师练习模式：勾了「计入班级排行榜」就把这关同步给服务端
         （星数与速度由服务端按同一套公式复核，防刷） */
      if (S.role === 'teacher' && S.teacherLb && S.teacherLb.on && S.teacherLb.class_id) {
        api('/api/v2/typing/teacher-record', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ class_id: S.teacherLb.class_id,
            /* 老师这一行也要有宠物和背景特效，否则榜上永远是个灰爪印（2026-11-05） */
            equip: { pet: S.ranch.pet, decos: S.ranch.decos, bg: S.ranch.bg, fx: S.ranch.fx } },
            payload))
        });
      }
      showResult(stars, wpm, payload, { newBest: newBest, gained: gained,
        pts_gained: addPts, rewards: { egg: !!egg, decos: newDecos } });
    } else {
      var repPts = TL.ptsFor(stars, payload.stage, payload.chapter,
                             payload.level, true, !!payload.double);
      pr.pts = (pr.pts || 0) + repPts;
      demoSave();
      refreshPts();
      showResult(stars, wpm, payload, { newBest: false, gained: 0,
        pts_gained: repPts, rewards: {} });
    }
    return;
  }
  api('/api/v2/typing/record', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function (r) {
    if (r && r.ok) {
      S.progress = r.stu;
      if (S.progress && !S.progress.equip) S.progress.equip = { pet: '', decos: [] };
      S.ranch = ranchFromEquip(S.progress.equip);
      refreshPts();
      showResult(r.stars, r.wpm, payload, r);
    } else {
      showResult(stars, wpm, payload, { error: (r && r.msg) || '成绩没有保存成功' });
    }
  }).catch(function () {
    showResult(stars, wpm, payload, { error: '网络不通，成绩没有保存成功' });
  });
}
function showResult(stars, wpm, payload, res) {
  var L = S.play.L;
  var stage = TD.stageById(L.stage) || TD.STAGES[0];
  var nextOpen = stars > 0 && L.level < 10;
  var nextChOpen = stars > 0 && L.level === 10;
  var rewards = res.rewards || {};
  var rewardBits = [];
  if (rewards.egg) rewardBits.push('🥚 掉落了一颗宠物蛋！快去牧场孵化');
  (rewards.decos || []).forEach(function (d) {
    var dd = TD.decoById(d);
    if (dd) rewardBits.push('🎀 解锁新装扮：「' + dd.name + '」');
  });
  if (res.gained) rewardBits.push('⭐ 星数 + ' + res.gained);
  if (res.pts_gained) rewardBits.push('✨ 积分 + ' + res.pts_gained +
    (payload.double ? '（加倍卡 · 基础分 ×2）' : ''));
  if (payload.shield && stars > 0 && payload.acc < 90) rewardBits.push('🛡 容错卡生效：这次按通关算，下次试试不用道具');
  var hasNextCh = TL.isBoss(L.level) && stars > 0 && (L.chapter + 1 < 200);
  var mask = document.createElement('div');
  mask.className = 'mask';
  var nextBtn = (stars > 0 && (nextOpen || nextChOpen))
    ? '<button class="btn" id="rNext" data-rsel="next">下一关 ›</button>' : '';
  mask.innerHTML =
    '<div class="result">' +
      '<h2>' + (stars > 0 ? (stars === 3 ? '完美通关！' : stars === 2 ? '优秀！' : '通关啦！') : '差一点点') + '</h2>' +
      '<div class="r-sub">' + esc(stage.icon + ' ' + L.title) + '</div>' +
      '<div class="r-stars">' + starsHtml(stars) + '</div>' +
      '<div class="r-grid">' +
        '<div class="r-cell"><b>' + wpm + '</b><span>' + (L.mode === 'cn' ? '字/分钟' : '击键/分钟') + '</span></div>' +
        '<div class="r-cell"><b>' + payload.acc + '%</b><span>准确率</span></div>' +
        '<div class="r-cell"><b>' + payload.duration + 's</b><span>用时</span></div>' +
      '</div>' +
      (res.error ? '<div class="r-reward">⚠️ ' + esc(res.error) + '</div>' :
        (rewardBits.length ? '<div class="r-reward">' + rewardBits.join('<br>') + '</div>' : '')) +
      '<div class="r-btns">' + nextBtn +
        '<button class="btn line" id="rRetry" data-rsel="retry">再打一次</button>' +
        '<button class="btn ghost" id="rMap" data-rsel="map">回地图</button>' +
      '</div>' +
      '<div class="r-keys"><kbd>↵</kbd> ' + (nextBtn ? '进入下一关' : '确认') +
        '<span class="rk-sep">·</span><kbd>↑</kbd><kbd>↓</kbd> 切换选择' +
        '<span class="rk-sep">·</span><kbd>Esc</kbd> 回地图</div>' +
    '</div>';
  document.body.appendChild(mask);

  /* 键盘操作：默认高亮第一项（通关时就是「下一关」），回车直接进下一关；
     上下键在三个选项间循环，Esc / 点空白回地图。用捕获阶段监听，
     避免被练习页残留的按键监听抢走；弹层一移除就解绑。 */
  var opts = [].slice.call(mask.querySelectorAll('[data-rsel]'));
  var sel = 0;
  function paintSel() {
    opts.forEach(function (b, i) { b.classList.toggle('sel', i === sel); });
  }
  function dismiss() {
    document.removeEventListener('keydown', onKey, true);
    mask.remove();
  }
  function goMap() { dismiss(); clearPlayBindings(); S.view = 'map'; S.play = null; render(); }
  function goRetry() { dismiss(); startLevel(L.stage, L.chapter, L.level); }
  function goNext() {
    dismiss();
    if (nextOpen) startLevel(L.stage, L.chapter, L.level + 1);
    else if (nextChOpen) { S.map.stage = L.stage; S.map.chapter = L.chapter + 1; S.view = 'map'; S.play = null; render(); }
  }
  var onKey = function (e) {
    if (!document.body.contains(mask)) {
      document.removeEventListener('keydown', onKey, true); return;
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (opts.length) {
        sel = (sel + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length;
        paintSel();
      }
    } else if (e.key === 'Enter') {
      e.preventDefault(); e.stopPropagation();
      if (opts[sel]) opts[sel].click();
    } else if (e.key === 'Escape') {
      e.preventDefault(); e.stopPropagation(); goMap();
    }
  };
  document.addEventListener('keydown', onKey, true);
  mask.addEventListener('click', function (e) { if (e.target === mask) goMap(); });
  var bm = mask.querySelector('#rMap'); if (bm) bm.onclick = goMap;
  var br = mask.querySelector('#rRetry'); if (br) br.onclick = goRetry;
  var bn = mask.querySelector('#rNext'); if (bn) bn.onclick = goNext;
  paintSel();
}

/* ---------------- 排行榜 ---------------- */
function loadLb() {
  if (S.demo) {
    /* 教师练习模式且选了班级 → 拉真实班级榜（接口支持教师会话按班查询，
       服务端会把开启上报的教师成绩一并排进去） */
    if (S.role === 'teacher' && S.teacherLb && S.teacherLb.on && S.teacherLb.class_id) {
      api('/api/v2/typing/leaderboard?scope=' + S.lb.scope +
          '&class_id=' + encodeURIComponent(S.teacherLb.class_id))
        .then(function (r) {
          if (r && r.ok) {
            S.lb.rows = (r.rows || []).map(function (row) {
              return Object.assign({}, row, { me: row.student_id === '__teacher__' });
            });
            S.lb.class_name = r.class_name || '';
          } else { S.lb.rows = []; S.lb.class_name = ''; }
          paintLb();
        }).catch(function () { paintLb(); });
      return;
    }
    var names = DEMO_LB_NAMES.slice();
    var scope = S.lb.scope;
    var rows = names.map(function (n, i) {
      var v = scope === 'week' ? Math.max(1, 20 - i * 2 + (i % 3))
            : scope === 'total' ? 90 - i * 9
            : Math.round((58 - i * 3.4) * 10) / 10;
      var pets = ['dog', 'dino', 'unicorn', '', 'cat', 'penguin', 'panda', 'rabbit'];
      return { name: n, value: v, pet: pets[i], decos: i === 0 ? ['crown'] : (i === 2 ? ['bow'] : []), me: n === S.me.name };
    });
    rows.push({ name: S.me.name, value: scope === 'speed' ? 33.6 : (scope === 'week' ? S.progress.week_stars || 0 : S.progress.stars || 0),
      pet: S.ranch.pet, decos: S.ranch.decos, bg: S.ranch.bg, fx: S.ranch.fx, me: true });
    rows.sort(function (a, b) { return b.value - a.value; });
    S.lb.rows = rows; S.lb.class_name = S.me.class_name;
    paintLb();
    return;
  }
  api('/api/v2/typing/leaderboard?scope=' + S.lb.scope).then(function (r) {
    if (r && r.ok) { S.lb.rows = r.rows || []; S.lb.class_name = r.class_name || ''; paintLb(); }
  });
}
function viewLb() {
  var tabs = [['week', '⭐ 本周星光'], ['total', '🏆 累计总星'], ['speed', '⚡ 手速之王']];
  /* 标题里的班级名用「榜单实际所属班级」（S.lb.class_name，来自接口返回）。
     2026-11-04 牛哥反馈：教师练习模式下标题写 S.me.class_name，那是**老师
     自己的班**（三年1班），跟下拉里选的班（七1班）对不上，看着像数据错乱。 */
  return '<div class="lb-card">' +
    '<div class="lb-title" id="lbTitle">' +
      esc(S.lb.class_name || S.me.class_name || '') + ' · 打字排行榜</div>' +
    '<div class="lb-sub">每周一星光榜自动清零，坚持每天练一点，榜上见！</div>' +
    '<div class="lb-tabs">' + tabs.map(function (t) {
      return '<button class="' + (S.lb.scope === t[0] ? 'on' : '') + '" data-lbscope="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>' +
    '<div id="lbRows"><div class="lb-empty">加载中…</div></div>' +
    '</div>';
}
function paintLb() {
  var box = $('#lbRows');
  if (!box) return;
  /* 标题跟着榜单数据一起刷新（切班 / 切榜单后班级名必须同步变） */
  var tt = $('#lbTitle');
  if (tt) tt.textContent = (S.lb.class_name || S.me.class_name || '') + ' · 打字排行榜';
  if (!S.lb.rows.length) {
    box.innerHTML = '<div class="lb-empty">这周还没有人上榜，第一个通关的人就是你！</div>';
    return;
  }
  var unit = S.lb.scope === 'speed' ? 'KPM' : '星';
  box.innerHTML = S.lb.rows.map(function (r, i) {
    var rankCls = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
    var medal = i < 3 ? ['🥇', '🥈', '🥉'][i] : (i + 1);
    /* 榜上每一行的小像都带背景与特效 —— 和牧场里看到的是同一副样子（2026-11-05） */
    var tile = TD.petTile({ pet: r.pet, decos: r.decos, bg: r.bg, fx: r.fx, cls: 'lb-pet' });
    return '<div class="lb-row' + (r.me ? ' me' : '') + '">' +
      '<span class="lb-rank ' + rankCls + '">' + medal + '</span>' +
      tile +
      '<span class="lb-name">' + esc(r.name) + (r.me ? '<small>（我）</small>' : '') + '</span>' +
      '<span class="lb-val">' + (Math.round(r.value * 10) / 10) + '<small>' + unit + '</small></span>' +
      '</div>';
  }).join('');
}
function bindLb() {
  document.querySelectorAll('[data-lbscope]').forEach(function (b) {
    b.onclick = function () {
      S.lb.scope = b.getAttribute('data-lbscope');
      var box = $('#lbRows');
      if (box) box.innerHTML = '<div class="lb-empty">加载中…</div>';
      loadLb();
      document.querySelectorAll('[data-lbscope]').forEach(function (x) {
        x.classList.toggle('on', x.getAttribute('data-lbscope') === S.lb.scope);
      });
    };
  });
}

function eggSvg() {

    '<radialGradient id="egShell" cx="34%" cy="24%" r="82%">' +

    '</defs>' +
    '<ellipse cx="50" cy="114" rx="23" ry="5" fill="#A8894E" opacity=".26"/>' +

    '<ellipse cx="39.5" cy="35" rx="7.5" ry="11.5" fill="url(#egHi)" opacity=".85" transform="rotate(-18 39.5 35)"/>' +
    '<path d="M50 9c15.5 0 26 22.5 26 40.5S65.5 80 50 80 24 67.5 24 49.5 34.5 9 50 9Z" fill="url(#egVig)"/>' +
    '<circle cx="63" cy="52" r="3.2" fill="#E3CDA0" opacity=".85"/>' +

    '<div class="ranch-tip">💡 点击伙伴即可切换出战；点牧场大图也能轮换，装扮会跟着它出现在练习页和排行榜上。</div>';
  return '<div class="ranch-grid">' + side + '<div>' + grid +
    (pet ? wardrobe() : '') + itemShopBox() + bgShopBox() + fxShopBox() + '</div></div>';

/* ---------------- 衣柜：按部位分架 ----------------
   为什么要分架：原来十二件挤成一行，帽子眼镜围巾混在一起，
   而且能同时戴三顶帽子。现在按「头饰 / 面饰 / 上衣 / 下衣 / 整套」
   五个部位分开摆，同一部位只能穿一件 —— 换帽子就是摘帽子。
   没买到的直接显示积分价，点一下就能买，不用先去别处解锁。 */
function wardrobe() {
  var pr = S.progress || {};
  var owned = pr.decos || [];
  var cur = S.ranch.decos || [];
  var cats = TD.DECO_CATS.map(function (c) {
    var list = TD.DECOS.filter(function (d) { return d.cat === c.id; });
    if (!list.length) return '';
    var worn = null;
    list.forEach(function (d) { if (cur.indexOf(d.id) >= 0) worn = d; });
    var dots = list.map(function (d) {
      var has = owned.indexOf(d.id) >= 0;
      var on = cur.indexOf(d.id) >= 0;
      if (!has) {
        return '<button class="deco-dot buy" data-decobuy="' + d.id + '" ' +
          'title="' + esc(d.name + '：' + d.price + ' 积分，或累计 ' + d.need + ' 星解锁') + '">' +
          TD.decoSvg(d) + '<span class="dd-price">✨' + d.price + '</span></button>';
      }
      return '<button class="deco-dot' + (on ? ' on' : '') + '" data-deco="' + d.id + '" ' +
        'title="' + esc(d.name + (on ? '（已穿，点击脱下）' : '（点击穿上）')) + '">' +
        TD.decoSvg(d) + '</button>';
    }).join('');
    return '<div class="deco-sec">' +
      '<div class="ds-head"><span class="ds-ic">' + c.icon + '</span><b>' + c.name + '</b>' +
        (worn ? '<span class="ds-worn">' + esc(worn.name) + '</span>'
              : '<span class="ds-worn none">空着</span>') +
      '</div>' +
      '<div class="deco-row">' + dots + '</div>' +
    '</div>';
  }).join('');
  return '<div class="wardrobe">' +
    '<div class="w-head"><b>👗 衣柜</b>' +
      '<span>五类部位，同类只能穿一件 · 未拥有的可直接用积分买</span>' +
      '<span class="w-pts">✨ ' + (pr.pts || 0) + '</span></div>' +
    '<div class="w-body">' + cats + '</div>' +
  '</div>';
}

/* ---------------- 道具商店 ----------------
   放在牧场而不是练习页主界面：道具是「卡住时的备用方案」，
   不该在地图上一眼就看到，否则会变成「先买道具再打」。 */
function itemShopBox() {
  var pr = S.progress || {};
  var inv = pr.items || {};
  return '<div class="item-shop">' +
    '<div class="is-head"><b>🏪 道具商店</b>' +
      '<span>积分购买 · 只在当前这一关有效</span>' +
      '<span class="w-pts">✨ ' + (pr.pts || 0) + '</span></div>' +
    '<div class="is-grid">' + TD.ITEMS.map(function (it) {
      var n = inv[it.id] || 0;
      var full = n >= it.max;
      return '<div class="is-card">' +
        '<div class="ic-top"><span class="ic-ic">' + it.icon + '</span>' +
          '<b>' + esc(it.name) + '</b><span class="ic-have">' + n + '/' + it.max + '</span></div>' +
        '<div class="ic-desc">' + esc(it.desc) + '</div>' +
        '<div class="ic-tip">' + esc(it.tip) + '</div>' +
        '<button class="btn sm' + (full ? ' line' : '') + '" data-buyitem="' + it.id + '"' +
          (full ? ' disabled' : '') + '>✨ ' + it.price + (full ? '　已满' : '　购买') + '</button>' +
      '</div>';
    }).join('') + '</div>' +
  '</div>';
}

/* ---------------- 背景商店（2026-11-05） ----------------
   背景只改牧场舞台的「风景」，人人可买（不需要先有宠物），
   预览小图直接用背景本身的 CSS 渐变，所见即所得。 */
function bgShopBox() {
  var pr = S.progress || {};
  var owned = [''].concat(pr.bgs || []);
  var cur = S.ranch.bg || '';
  return '<div class="item-shop">' +
    '<div class="is-head"><b>🖼 牧场背景</b>' +
      '<span>积分购买 · 给伙伴换一片风景</span>' +
      '<span class="w-pts">✨ ' + (pr.pts || 0) + '</span></div>' +
    '<div class="is-grid">' + TD.BACKGROUNDS.map(function (b) {
      var has = owned.indexOf(b.id) >= 0;
      var on = b.id === cur;
      return '<div class="is-card' + (on ? ' on' : '') + '">' +
        '<div class="bg-prev" style="background:' + b.css + '"></div>' +
        '<div class="ic-top"><b>' + esc(b.name) + '</b></div>' +
        (has
          ? '<button class="btn sm" data-bgsel="' + esc(b.id) + '"' + (on ? ' disabled' : '') + '>' +
              (on ? '使用中' : '换上') + '</button>'
          : '<button class="btn sm" data-bgbuy="' + esc(b.id) + '" title="' +
              esc(b.name + '：' + b.price + ' 积分') + '">✨ ' + b.price + '</button>') +
      '</div>';
    }).join('') + '</div>' +
  '</div>';
}

/* ---------------- 特效商店（2026-11-05） ----------------
   积分购买（全店最贵）：积分靠打出好成绩攒 —— 基础键位篇 0 分、
   越难的篇章每星越多。买下即自动开启，也可随时换回「无特效」。 */
function fxShopBox() {
  var pr = S.progress || {};
  var owned = (pr.effects || []).slice();
  var cur = S.ranch.fx || '';
  var noneOn = !cur;
  var cards = TD.EFFECTS.map(function (f) {
    var has = owned.indexOf(f.id) >= 0;
    var on = f.id === cur;
    return '<div class="is-card' + (on ? ' on' : '') + '">' +
      '<div class="ic-top"><span class="ic-ic">' + f.icon + '</span>' +
        '<b>' + esc(f.name) + '</b></div>' +
      '<div class="ic-desc">' + esc(f.desc) + '</div>' +
      (has
        ? '<button class="btn sm" data-fxsel="' + f.id + '"' + (on ? ' disabled' : '') + '>' +
            (on ? '特效中' : '开启') + '</button>'
        : '<button class="btn sm" data-fxbuy="' + f.id + '" title="' +
            esc(f.name + '：' + f.price + ' 积分') + '">✨ ' + f.price + '</button>') +
    '</div>';
  }).join('');
  return '<div class="item-shop">' +
    '<div class="is-head"><b>✨ 出战特效</b>' +
      '<span>积分购买 · 全店最贵的排面，跟着你的伙伴一起亮相</span>' +
      '<span class="w-pts">✨ ' + (pr.pts || 0) + '</span></div>' +
    '<div class="is-grid">' +
      '<div class="is-card' + (noneOn ? ' on' : '') + '">' +
        '<div class="ic-top"><span class="ic-ic">🚫</span><b>无特效</b></div>' +
        '<div class="ic-desc">干干净净，专注练字</div>' +
        '<button class="btn sm" data-fxsel=""' + (noneOn ? ' disabled' : '') + '>' +
          (noneOn ? '特效中' : '关闭特效') + '</button>' +
      '</div>' + cards + '</div>' +
  '</div>';
}
/** 特效粒子层：按当前特效生成一小组绝对定位粒子（光环/极光靠 CSS ::before） */
function fxLayer(fx) {
  if (!fx) return '';
  var out = '<span class="stage-fx fx-' + esc(fx) + '">';
  var i;
  if (fx === 'sparkle') {
    for (i = 0; i < 7; i++)
      out += '<span class="p" style="left:' + (8 + i * 13) + '%;top:' +
        (12 + ((i * 29) % 62)) + '%;animation-delay:' + (i * .38) + 's">✨</span>';
  } else if (fx === 'bubbles') {
    for (i = 0; i < 6; i++)
      out += '<span class="p" style="left:' + (10 + i * 15) + '%;bottom:' +
        (4 + (i % 3) * 12) + 'px;animation-delay:' + (i * .9) + 's"></span>';
  } else if (fx === 'hearts') {
    for (i = 0; i < 5; i++)
      out += '<span class="p" style="left:' + (16 + i * 16) + '%;bottom:16px;animation-delay:' +
        (i * .75) + 's">💖</span>';
  } else if (fx === 'snow') {
    for (i = 0; i < 8; i++)
      out += '<span class="p" style="left:' + (6 + i * 12) + '%;top:0;animation-delay:' +
        (i * .65) + 's">❄️</span>';
  }
  return out + '</span>';
}
function buyBg(id) {
  var b = TD.bgById(id);
  if (!b || !b.id) return;
  if (S.demo) {
    S.progress.pts = Math.max(0, (S.progress.pts || 0) - b.price);
    (S.progress.bgs = S.progress.bgs || []).push(id);
    S.ranch.bg = id;
    demoSave(); render();
    uiToast('换上「' + b.name + '」啦', 'ok');
    return;
  }
  api('/api/v2/typing/buy', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind: 'bg', id: id })
  }).then(function (r) {
    if (r && r.ok) { S.progress = r.stu || S.progress; S.ranch.bg = id; render(); uiToast('换上「' + b.name + '」啦', 'ok'); }
    else uiToast((r && r.msg) || '买不了', 'warn');
  });
}
function buyFx(id) {
  var f = TD.effectById(id);
  if (!f) return;
  if (S.demo) {
    S.progress.pts = Math.max(0, (S.progress.pts || 0) - f.price);
    (S.progress.effects = S.progress.effects || []).push(id);
    S.ranch.fx = id;
    demoSave(); render();
    uiToast('「' + f.name + '」已开启，好闪！', 'ok');
    return;
  }
  api('/api/v2/typing/buy', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind: 'effect', id: id })
  }).then(function (r) {
    if (r && r.ok) { S.progress = r.stu || S.progress; S.ranch.fx = id; render(); uiToast('「' + f.name + '」已开启，好闪！', 'ok'); }
    else uiToast((r && r.msg) || '买不了', 'warn');
  });
}
function selectBg(id) { if (S.ranch.bg === id) return; S.ranch.bg = id; saveEquip(); render(); }
function selectFx(id) { if (S.ranch.fx === (id || '')) return; S.ranch.fx = id || ''; saveEquip(); render(); }
/** 在已拥有的伙伴之间轮换出战（dir = 1 下一只 / -1 上一只）。
    只有一只时摇一下舞台做提示，不弹窗打断。 */
function cyclePet(dir) {
  var owned = (S.progress.pets || []);
  var box = $('#stageBox');
  if (owned.length < 2) {
    if (box) {
      box.classList.remove('shake');
      void box.offsetWidth;              /* 强制回流，让动画可重复触发 */
      box.classList.add('shake');
    }
    return;
  }
  var i = owned.indexOf(S.ranch.pet);
  i = (i + (dir || 1) + owned.length) % owned.length;
  S.ranch.pet = owned[i];
  S.petSwap = 1;                        /* 下次渲染播放"登场"动画 */
  saveEquip();
  render();
}
/** 孵化成功的统一庆祝弹窗：把刚孵出的伙伴直接画进弹窗里，比一行字有仪式感 */
function petHatched(id) {
  var p = TD.petById(id);
  uiAlert({
    title: '孵化成功', tone: 'ok', confirmText: '去看看',
    message: '恭喜！蛋壳裂开了，「' + (p ? p.name : '新伙伴') + '」已经住进你的牧场。',
    html: p ? TD.petSvg(p, []) : ''
  });
}
function bindRanch() {
  S.petSwap = 0;
  var sb = $('#stageBox');
  if (sb) {
    sb.onclick = function (ev) {
      if (ev.target && ev.target.closest && ev.target.closest('[data-petnav]')) return;
      cyclePet(1);
    };
  }
  document.querySelectorAll('[data-petnav]').forEach(function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      cyclePet(parseInt(b.getAttribute('data-petnav'), 10) || 1);
    };
  });
  document.querySelectorAll('[data-pet]').forEach(function (b) {
    b.onclick = function () {
      S.ranch.pet = b.getAttribute('data-pet');
      S.petSwap = 1;
      saveEquip();
      render();
    };
  });
  document.querySelectorAll('[data-deco]').forEach(function (b) {
    b.onclick = function () {
      var id = b.getAttribute('data-deco');
      /* 双保险：即便 DOM 被手动改过，也再校验一次是否真的拥有 */
      if ((S.progress.decos || []).indexOf(id) < 0) {
        var dd = TD.decoById(id);
        uiToast('「' + (dd ? dd.name : '这个装扮') + '」还没解锁', 'warn');
        return;
      }
      var wasOn = S.ranch.decos.indexOf(id) >= 0;
      /* 部位互斥交给 TD.equipDeco：穿上新帽子自动摘下旧帽子，
         穿整套自动脱掉上下装 —— 规则只写在一个地方，服务端再执行一遍 */
      S.ranch.decos = TD.equipDeco(S.ranch.decos, id);
      saveEquip();
      render();
      var dd2 = TD.decoById(id);
      if (!wasOn && dd2) {
        /* 不写死默认名：这里可能还没出战后一只宠物，叫「伙伴」就不会张冠李戴 */
        uiToast('「' + dd2.name + '」上身，伙伴' + (dd2.act || '开心地动了动'), 'ok');
      }
    };
  });
  /* 未拥有的装扮：点了直接问「买不买」，不再只是弹一句"还差几星" */
  document.querySelectorAll('[data-decobuy]').forEach(function (b) {
    b.onclick = function () {
      var d = TD.decoById(b.getAttribute('data-decobuy'));
      if (d) buyDeco(d);
    };
  });
  document.querySelectorAll('[data-buyitem]').forEach(function (b) {
    b.onclick = function () { buyItem(b.getAttribute('data-buyitem')); };
  });
  /* 背景 / 特效（2026-11-05）：买与切换都在牧场页完成 */
  document.querySelectorAll('[data-bgbuy]').forEach(function (b) {
    b.onclick = function () { buyBg(b.getAttribute('data-bgbuy')); };
  });
  document.querySelectorAll('[data-bgsel]').forEach(function (b) {
    b.onclick = function () { selectBg(b.getAttribute('data-bgsel')); };
  });
  document.querySelectorAll('[data-fxbuy]').forEach(function (b) {
    b.onclick = function () { buyFx(b.getAttribute('data-fxbuy')); };
  });
  document.querySelectorAll('[data-fxsel]').forEach(function (b) {
    b.onclick = function () { selectFx(b.getAttribute('data-fxsel') || ''); };
  });
  /* 锁着的装扮：可点，但只解释「还差多少星」，不会穿上 */
  document.querySelectorAll('[data-deco-lock]').forEach(function (b) {
    b.onclick = function () {
      var d = TD.decoById(b.getAttribute('data-deco-lock'));
      if (!d) return;
      var lack = Math.max(0, (d.need || 0) - (S.progress.stars || 0));
      uiToast(lack > 0
        ? '「' + d.name + '」还差 ' + lack + ' 星解锁'
        : '「' + d.name + '」需要累计 ' + d.need + ' 星', 'warn');
    };
  });
  var eb = $('#eggBtn');
  if (eb) eb.onclick = function () {
    if (S.demo) {
      var unowned = TD.PETS.map(function (p) { return p.id; })
        .filter(function (id) { return S.progress.pets.indexOf(id) < 0; });
      S.progress.eggs--;
      if (unowned.length) {
        var pet = unowned[Math.floor(Math.random() * unowned.length)];
        S.progress.pets.push(pet);
        if (!S.ranch.pet) S.ranch.pet = pet;
        demoSave();
        render();
        setTimeout(function () { petHatched(pet); }, 60);
      } else {
        S.progress.pts += 50;
        demoSave(); render();
      }
      return;
    }
    eb.disabled = true; eb.textContent = '孵化中…';
    api('/api/v2/typing/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(function (r) {
        if (r && r.ok) {
          return api('/api/v2/typing/me').then(function (me) {
            if (me && me.ok) {
              S.progress = me.progress;
              if (!S.progress.equip) S.progress.equip = { pet: '', decos: [] };
              S.ranch = ranchFromEquip(S.progress.equip);
            }
            render();
            if (r.pet) setTimeout(function () { petHatched(r.pet); }, 60);
            else if (r.msg) setTimeout(function () {
              uiAlert({ title: '没能孵化', tone: 'warn', message: r.msg });
            }, 60);
          });
        }
        render();
      }).catch(function () { render(); });
  };
}
function saveEquip() {
  if (S.demo) {
    S.progress.equip = { pet: S.ranch.pet, decos: S.ranch.decos.slice(),
                         bg: S.ranch.bg || '', fx: S.ranch.fx || '' };
    demoSave();
    /* 教师练习模式：老师换装不上榜也要让班级排行榜那行跟着变，
       否则榜上永远是上次练习时穿的那身（2026-11-05） */
    if (S.role === 'teacher' && S.teacherLb && S.teacherLb.on && S.teacherLb.class_id) {
      api('/api/v2/typing/teacher-equip', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ class_id: S.teacherLb.class_id,
          equip: { pet: S.ranch.pet, decos: S.ranch.decos,
                   bg: S.ranch.bg || '', fx: S.ranch.fx || '' } })
      });
    }
    return;
  }
  api('/api/v2/typing/equip', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pet: S.ranch.pet, decos: S.ranch.decos,
                           bg: S.ranch.bg || '', fx: S.ranch.fx || '' })
  });
}

/* 积分兜底同步：任何路径改了 S.progress.pts（购买 / 孵化 / 教师发放 /
   结算 / 道具），250ms 内顶栏数字必然跟上，而且只改数字、不重绘页面 ——
   练习中整页重绘会把正在打的关卡冲掉，这条铁律不能破。 */
setInterval(refreshPts, 250);
boot();
})();
</script>
</body>
</html>
