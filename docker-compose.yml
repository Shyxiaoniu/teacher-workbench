# ============================================================
# 班级工作台 2.0 · Docker Compose 编排（NAS 部署）
# ------------------------------------------------------------
# 一个网页入口，四个容器：
#
#   gateway     nginx 反向代理，唯一对外端口（默认 8080）
#                ├─ /       → workbench（教师端 /teacher/、学生端 /s/）
#                └─ /qf/    → quickform（QuickForm 教师版）
#   workbench   工作台主服务：教师端 / 学生端 / 同步 / 课件 / 提交（容器内 20020）
#   quickform   QuickForm 教师版（容器内 5055，独立镜像、可单独升级替换）
#   init        一次性容器：修正数据卷属主、补建子目录，跑完即退出
#
# 对外只有一个地址：  http://<NAS 的局域网 IP>:8080/
#   · 教师端   http://<NAS>:8080/teacher/
#   · 学生端   http://<NAS>:8080/s/
#   · QuickForm http://<NAS>:8080/qf/
#
# 常用命令：
#   docker compose up -d --build        构建并启动全部服务
#   docker compose ps                   看状态（都 healthy 即可用）
#   docker compose logs -f quickform    看 QuickForm 日志
#   docker compose restart quickform    只重启 QuickForm
#   docker compose down                 停止并删除容器（数据卷保留）
#
# 只更新 QuickForm（不动工作台）：
#   docker compose build quickform && docker compose up -d quickform
#   或把官方源码解压覆盖到 ./quickform/app 后：
#   docker compose restart quickform
#
# 推到镜像仓库（可选）：
#   IMAGE_REPO=registry.cn-guangzhou.aliyuncs.com/<命名空间>/teacher-workbench \
#   IMAGE_TAG=2.0 docker compose build && docker compose push
# ============================================================
name: teacher-workbench

services:
  # ---------------------------------------------------------
  # init：一次性数据卷初始化（属主 / 子目录）
  # 命名卷首次挂载会继承镜像里的属主；旧卷或 bind mount 则不一定，
  # 主服务会因写不了数据目录直接退出。这一层先修好再放行。
  # ---------------------------------------------------------
  init:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPO:-teacher-workbench}:${IMAGE_TAG:-2.0}
    container_name: teacher-workbench-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # 注意：Compose 会把 $XXX 当变量插值，脚本里的 shell 变量必须写 $$XXX；
    # 这里故意不用变量，避免踩坑。
    command:
      - |
        set -eu
        if [ ! -w /app/data ] || [ "$$(stat -c %u /app/data 2>/dev/null || echo 0)" != "10001" ]; then
          echo "[init] 工作台数据卷属主异常，修正 -> 10001:10001"
          chown -R 10001:10001 /app/data
        else
          echo "[init] 工作台数据卷属主正常（10001）"
        fi
        mkdir -p /app/data/files /app/data/backup /app/data/courseware \
                 /app/data/submissions/enh /app/data/submissions/uploads
        chown -R 10001:10001 /app/data

        if [ -d /qfdata ]; then
          echo "[init] QuickForm 数据卷 -> 10002:10002"
          mkdir -p /qfdata/db /qfdata/uploads /qfdata/assets /qfdata/logs
          chown -R 10002:10002 /qfdata
        fi
        echo "[init] 数据卷就绪"
    volumes:
      - workbench-data:/app/data
      - quickform-data:/qfdata
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    restart: "no"
    network_mode: none
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------
  # workbench：工作台主服务（不直接对外，统一从 gateway 进）
  # ---------------------------------------------------------
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPO:-teacher-workbench}:${IMAGE_TAG:-2.0}
    container_name: teacher-workbench
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    # 只绑宿主机回环，留一个「绕开网关」的排障入口；
    # 学生和老师平时都走 gateway 的 8080，不要用这个端口。
    ports:
      - "127.0.0.1:${WORKBENCH_DEBUG_PORT:-20020}:20020"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "20020"
      BIND: "0.0.0.0"
      WB_DATA_DIR: /app/data
      WB_SUBMISSION_DATA_DIR: /app/data/submissions
      # 课件库根目录：放在数据卷里，重建镜像 / 换容器都不丢
      WB_COURSEWARE_DIR: /app/data/courseware
      PYTHONUNBUFFERED: "1"
      # 对外地址（可选）：留空 = 跟随浏览器访问的地址（推荐）。
      # 只有前面还套了一层域名/端口映射时才需要写死，例如 http://nas.example.lan:8080
      WB_PUBLIC_URL: "${WB_PUBLIC_URL:-}"
      # QuickForm 服务地址（后端生成学生提交页链接时用；前端走同源 /qf）
      WB_QUICKFORM_URL: "${WB_QUICKFORM_URL:-http://quickform:5055}"
      # 信任内网反向代理传来的 X-Forwarded-For（网关容器 → 本容器）。
      # 不开的话所有师生会共用网关那一个 IP：限速互相拖累、日志分不清是谁。
      WB_TRUST_PROXY: "1"
      # 内部调用密钥：跨容器调用 QuickForm 的 /_wb_internal/* 时校验。
      # 必须与 quickform 服务的同名变量完全一致，否则「数据大屏」清空/删除会 403。
      WB_INTERNAL_SECRET: "${WB_INTERNAL_SECRET:-wb-internal-change-me}"
    volumes:
      - workbench-data:/app/data
      # 想在 NAS 文件管理器里直接改数据，把上一行换成（Linux 需先 chown -R 10001:10001 ./data）：
      # - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request;r=urllib.request.urlopen('http://127.0.0.1:20020/api/v2/ping',timeout=3);sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------
  # quickform：QuickForm 教师版（独立镜像，可单独升级）
  # 源码在 ./quickform/app，替换后重启本容器即生效；
  # 数据（SQLite / 学生提交附件 / 任务附件）全在 quickform-data 卷里。
  # ---------------------------------------------------------
  quickform:
    build:
      context: .
      dockerfile: quickform/Dockerfile
    image: ${QF_IMAGE_REPO:-teacher-workbench-quickform}:${QF_IMAGE_TAG:-2.5}
    container_name: teacher-workbench-quickform
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 会话加密密钥：务必在 .env 里换成随机串（不换则每次重启登录态失效）
      SECRET_KEY: "${QF_SECRET_KEY:-please-change-me-in-dotenv}"
      QF_PREFIX: /qf
      QUICKFORM_PORT: "5055"
      QF_DATA_DIR: /data
      # 首次启动自动创建的账号（已存在任何账号时不会覆盖）
      QF_ADMIN_USER: "${QF_ADMIN_USER:-wst}"
      QF_ADMIN_PASSWORD: "${QF_ADMIN_PASSWORD:-quickform}"
      # 内部调用密钥：必须与 workbench 服务的同名变量一致（同改同不改）
      WB_INTERNAL_SECRET: "${WB_INTERNAL_SECRET:-wb-internal-change-me}"
    volumes:
      - quickform-data:/data
      # 想让「换官方源码」不用重建镜像：把官方仓库解压到宿主机目录后挂进来（下一行取消注释）
      # - ./quickform/app:/opt/quickform/app:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request;r=urllib.request.urlopen('http://127.0.0.1:5055/login',timeout=4);sys.exit(0 if r.status<500 else 1)"
      interval: 30s
      timeout: 6s
      start_period: 40s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------
  # gateway：统一网页入口（唯一对外端口）
  # ---------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    container_name: teacher-workbench-gateway
    depends_on:
      workbench:
        condition: service_started
      quickform:
        condition: service_started
    restart: unless-stopped
    ports:
      # 老师/学生都访问这个端口；换端口只改 .env 的 WEB_PORT，不用重建镜像
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/gw-health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  # 固定卷名：换 compose 项目名、重装容器都不会丢数据
  workbench-data:
    name: ${WORKBENCH_VOLUME:-teacher-workbench-data}
  quickform-data:
    name: ${QUICKFORM_VOLUME:-teacher-workbench-quickform-data}
